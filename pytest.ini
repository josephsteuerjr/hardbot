[pytest]
# Одна команда «зелено» для ИТ — но сначала один раз поставить зависимости:
#
#     pip install -r requirements-dev.txt
#     pytest
#
# Почему двумя строчками, а не одной: server/requirements.txt — это состав
# боевого образа, туда нельзя класть Qt, FastAPI и COM ради тестов. Всё лишнее
# для прогона собрано отдельно, в requirements-dev.txt, и там же написано,
# зачем каждая строка.
#
# Чего делать НЕ надо: задавать что-либо в окружении перед запуском. Раньше без
# ADMIN_ID часть проверок роли владельца молча пропускалась или падала с 403 —
# теперь синтетический владелец ставится сам в tests/conftest.py.
#
# Чего нет на машине — то честно пропускается, а не роняет прогон: нет PySide6
# (окна пульта), нет fastapi (движок), не Windows (Excel через COM). Строка
# «skipped» в итоге — это норма, «error» — нет.

# 8.2 — не круглое число, а нижняя граница по факту: раньше у importorskip не
# было exc_type, и «Qt установлен, но не поднимается» валило весь прогон вместо
# пропуска. Со старым pytest этот файл честно откажется работать.
minversion = 8.2
testpaths = tests
python_files = test_*.py

# --color=no: консоль у владельца бывает cp1251, ANSI-раскраска её ломает.
addopts = -q --color=no

# Тест, помеченный «ожидаемо падает», обязан падать. Иначе пометка живёт годами
# после того, как проблему починили, и прячет обратную поломку.
xfail_strict = true
