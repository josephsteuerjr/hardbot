  $("plist").innerHTML =
    `<div class="muted" style="margin:4px 0 10px">🧭 ${esc(t.routeday)}: ${items.length}`+
    (j.km?` · ≈ ${j.km} км`:"")+`</div>`+
    items.map((p,i)=>`<div class="pcard" onclick="openP(${jsq(p.rep)})">
       <span style="flex:0 0 24px;height:24px;border-radius:50%;background:#2F80ED;color:#fff;
         display:flex;align-items:center;justify-content:center;font:600 12px/1 sans-serif">${i+1}</span>
       <div class="pinfo"><div class="pname">${esc(p.client)}</div>
         <div class="psub">${p.km!=null?("→ "+p.km+" км · "):""}${totalStr(p)}</div></div>
       <span class="pchev">${ic("chevR")}</span>
     </div>`).join("");
}
let LIST_RENDER_SEQ=0;
function personCardHTML(p,t){
  const dotStyle = (!p.visited && p.score!=null) ? ` style="background:${priColor(p.score)}"` : "";
  return `<div class="pcard" onclick="openP(${jsq(p.rep)})">
     <span class="dot ${p.visited?'v':'n'}"${dotStyle}></span>
     <div class="pinfo"><div class="pname">${esc(p.client)}</div>
       <div class="psub">${p.n>1?(p.n+" "+t.kd+" · "):""}${totalStr(p)}</div></div>
     <span class="pchev">${ic("chevR")}</span>
   </div>`;
}
function drawList(items){
  const host=$("plist"); if(!host) return;
  const t=L(), seq=++LIST_RENDER_SEQ, batch=60;
  let offset=0;
  host.innerHTML="";
  const append=()=>{
    // Поиск/маршрут/переход могли заменить экран, пока ждали следующий кадр.
    if(seq!==LIST_RENDER_SEQ || $("plist")!==host) return;
    const end=Math.min(offset+batch,items.length);
    host.insertAdjacentHTML("beforeend",items.slice(offset,end).map(p=>personCardHTML(p,t)).join(""));
    offset=end;
    if(offset<items.length) requestAnimationFrame(append);
  };
  try{ append(); }catch(e){ clientMetric("render_error", {persons:items.length}); }
}
// Поиск по списку. Подсказка обещает «ФИО, договор, телефон» — и ищем ровно по
// трём, а не по одному имени: выездник в поле оперирует номером договора,
// который ему называет офис, и телефоном должника, а не написанием фамилии.
// Номера и телефоны приходят вместе со списком (persons[].ids/tels), телефоны —
// одними цифрами: «+998 90 123-45-67» набирают подряд, и сырую строку реестра
// такой набор никогда не совпадёт.
// ФИО должников в реестре записаны ЛАТИНИЦЕЙ («TUKHTASINOV NUSRATULLO»), а
// ищут их набором по-русски — «Тухтасинов». Совпадения не было ни одного, и
// человек в поле видел пустой экран при живом клиенте в портфеле. Сводим обе
// стороны к общему звуковому скелету: сначала кириллица в латиницу, затем
// гасим разнобой самой латиницы. Один и тот же узбекский звук пишут
// по-разному, и это не опечатки, а две живые традиции записи:
// х = kh или x, ж = j или zh, қ = q или k, Мирзаев = Mirzaev или Mirzayev.
const FOLD_MAP={"а":"a","б":"b","в":"v","г":"g","ғ":"g","д":"d","е":"e","ё":"yo",
  "ж":"j","з":"z","и":"i","й":"y","к":"k","қ":"q","л":"l","м":"m","н":"n","о":"o",
  "п":"p","р":"r","с":"s","т":"t","у":"u","ў":"u","ф":"f","х":"x","ҳ":"h","ц":"ts",
  "ч":"ch","ш":"sh","щ":"sh","ъ":"","ы":"i","ь":"","э":"e","ю":"yu","я":"ya"};
function fold(s){
  let t=String(s||"").toLowerCase();
  t=t.replace(/[Ѐ-ӿ]/g,c=>FOLD_MAP[c]!==undefined?FOLD_MAP[c]:c);
  t=t.replace(/['`‘’ʻʼ]/g,"");   // o', g', ʻ — украшения письма
  // Порядок важен: kh гасим ДО одиночного x, иначе из «kh» вышло бы «hh».
  t=t.replace(/zh/g,"j").replace(/kh/g,"h").replace(/x/g,"h").replace(/gh/g,"g")
     .replace(/ts/g,"s").replace(/q/g,"k").replace(/ye/g,"e")
     .replace(/yo/g,"o").replace(/yu/g,"u").replace(/ya/g,"a").replace(/w/g,"v");
  t=t.replace(/(.)\1+/g,"$1");                        // Tojiddinov = Tojidinov
  return t.replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
}
function personMatches(p,q,qd,qf){
  const name=String(p.client||"").toLowerCase();
  if(name.includes(q)) return true;
  // Скелет считаем ОДИН раз на человека и держим при нём: пересчитывать 760
  // имён на каждую набранную букву — заметная пауза на телефоне в поле.
  if(qf && (p._fold||(p._fold=fold(p.client))).includes(qf)) return true;
  if(!qd) return false;
  if((p.ids||[]).some(id=>id.includes(qd))) return true;
  // Одна-две цифры — это ещё не телефон: по ним совпал бы весь портфель.
  return qd.length>=3 && (p.tels||[]).some(tel=>tel.includes(qd));
}
function filterList(){
  const raw=$("q").value.trim();
  if(!raw){ drawList(STATE.persons); return; }
  const q=raw.toLowerCase(), qd=raw.replace(/\D+/g,""), qf=fold(raw);
  drawList(STATE.persons.filter(p=>personMatches(p,q,qd,qf)));
}

async function openP(rep){
  let d=null;
  try{ d=await api("/api/person?rep="+enc(rep));
    if(d){ STATE.online=true; IDB.put("cards",d,rep).catch(()=>{}); } }   // освежить кэш карточки
  catch(e){ d=await loadCard(rep); if(d) STATE.online=false; }            // нет сети → из кэша
  if(!d){ toast(STATE.online===false?"нет данных оффлайн":"✕"); return; }
  // Старые IndexedDB-карточки могли содержать form-prefill из master. До
  // доказанного snapshot он не является пользовательским вводом и очищается;
  // отдельный localStorage-черновик восстановится поверх пустой формы ниже.
  if(!d.visited){
    (d.form||[]).forEach(f=>{ f.current=""; });
    // Текущий комментарий месяца — живой совместный текст офиса и бота. Его
    // сохраняем даже до первого завершённого визита; очищаем только недоказанный
    // legacy-prefill прочих полей.
    d.call_comment=""; d.tips="";
    IDB.put("cards",d,rep).catch(()=>{});
  }
  STATE.cur=d; STATE.tab="visit";
  // Когда человек открыл карточку. Офис просил видеть время на адресе, а
  // честная граница измерения — именно карточка: приложение не знает, когда он
  // подошёл к подъезду, но знает, когда открыл должника и когда закрыл выезд.
  // Повторное открытие того же КД начинает отсчёт заново.
  STATE.openedAt=Date.now();
  prStart(rep);      // следы выезда: где телефон, пока открыта эта карточка
  FORM_TOUCHED.clear(); FORM_CLEARED.clear();
  // ПОВТОРНОЕ открытие уже закрытого визита: считаем тронутым всё, что человек
  // видит заполненным. Иначе второе сохранение («утром Нет контакта, вечером
  // Оплачен», «поправил опечатку») отправляет только заново набранное поле, а
  // снимок визита перезаписывается им целиком — и контакт, кто на адресе,
  // местонахождение, цель, договорённость и комментарий обнуляются молча.
  // Провенанс не страдает: у завершённого визита форма префиллится ИСКЛЮЧИТЕЛЬНО
  // из доказанного снимка (мастер её не префиллит, см. очистку выше), поэтому
  // отправляем ровно то, что уже было подтверждено нами же.
  if(d.visited){
    (d.form||[]).forEach(f=>{ if(f.current) FORM_TOUCHED.add(f.key); });
    // Симметрично d.form: иначе второе сохранение выкидывало бы обещание из
    // снимка (readForm шлёт только затронутые ключи).
    if(d.formTyped) Object.keys(d.formTyped).forEach(k=>{
      if(d.formTyped[k]) FORM_TOUCHED.add(k); });
    // Серверный комментарий текущего месяца показываем для продолжения, но не
    // считаем касанием формы: простое открытие/закрытие карточки не должно
    // превращать импортированный текст в доказанный результат нового визита.
    if(d.tips) FORM_TOUCHED.add("tips");
  }
  draftDirty=false; clearTimeout(draftTimer);   // новый клиент — сбросить состояние сессии черновика
  renderDetail();
}

// --- Карта (MapLibre GL). Основной слой — свой Protomaps PMTiles; пин — наш.
// Ленивая загрузка карт-библиотек: в оболочке их нет (чтобы оффлайн-старт не зависел от
// карт). Все библиотеки лежат на том же сервере: телефон больше не зависит от jsdelivr.
let _mapLibs=null;
function ensureMapLibs(){
  if(window.maplibregl && window.pmtiles && window.protomaps_themes_base) return Promise.resolve(true);
  if(_mapLibs) return _mapLibs;
  const addCss=(href)=>{ if(document.querySelector(`link[href="${href}"]`)) return;
    const l=document.createElement("link"); l.rel="stylesheet"; l.href=href; document.head.appendChild(l); };
  const addJs=(src)=>new Promise((res)=>{ const s=document.createElement("script"); s.src=src; s.onload=()=>res(true); s.onerror=()=>res(false); document.head.appendChild(s); });
  _mapLibs=(async()=>{
    addCss("/vendor/maplibre-gl-4.7.1.css");
    if(!await addJs("/vendor/maplibre-gl-4.7.1.js")){ _mapLibs=null; return false; }
    await addJs("/vendor/pmtiles-3.2.1.js");
    await addJs("/vendor/protomaps-themes-base-4.4.0.js");
    return !!window.maplibregl;
  })();
  return _mapLibs;
}
let MAP=null, PROTO_REG=false;
const RASTER_STYLE={version:8,sources:{osm:{type:"raster",
  tiles:["/tiles/raster/{z}/{x}/{y}.png"],
  tileSize:256,maxzoom:19,attribution:"© OpenStreetMap"}},
  layers:[{id:"osm",type:"raster",source:"osm"}]};
function removeMap(){ if(MAP){ try{MAP.remove();}catch(e){} MAP=null; } }
// Наш вектор-тайлсет (Protomaps PMTiles), если подложен на сервере; иначе растр.
function vectorStyle(url){
  if(!PROTO_REG){ maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile); PROTO_REG=true; }
  const ptb=window.protomaps_themes_base;
  // Symbol-слои требуют внешних glyph/sprite с protomaps.github.io. Дороги,
  // здания и вода полезнее подписей, которые могут снова уронить карту из-за CDN.
  const themed = ptb.layers ? ptb.layers("protomaps","light","ru") : ptb.default("protomaps","light");
  const layers = themed.filter(layer=>layer.type!=="symbol");
  return {version:8,
    sources:{protomaps:{type:"vector",url:"pmtiles://"+location.origin+url,attribution:"© OpenStreetMap"}},
    layers};
}

// --- Карта всех моих клиентов: цвет точки = приоритет выезда, тап → карточка ---
function priColor(s){
  if(s==null) return "#9b9b9b";
  if(s>=92) return "#B0472C";   // ехать первым
  if(s>=82) return "#C9852A";   // высокий
  if(s>=70) return "#6E8F3F";   // средний
  return "#9bb08a";             // ниже
}
// Маршрут дня: едем по городам (где суммарно «жирнее»), внутри города — по приоритету.
// Так нет зигзагов между городами Сугда (они далеко друг от друга).
function routeOrder(pts){
  const sc=p=>(p.score==null?-1:p.score), byCity={};
  pts.forEach(p=>{ const c=p.city||"—"; (byCity[c]=byCity[c]||[]).push(p); });
  const cities=Object.keys(byCity).sort((a,b)=>
    byCity[b].reduce((s,p)=>s+sc(p),0)-byCity[a].reduce((s,p)=>s+sc(p),0));
  const out=[];
  cities.forEach(c=>byCity[c].sort((a,b)=>sc(b)-sc(a)).forEach(p=>out.push(p)));
  return out;
}

// Одно поле-выпадашка. Контрол остаётся <select> (мобильный нативный пикер удобен для
// длинных вариантов), автосохранение и восстановление работают по data-k без изменений.
function formField(f){
  const list=(STATE.meta&&STATE.meta.dropdowns&&STATE.meta.dropdowns[f.key])||[];
  const opts=list.map(o=>
    `<option value="${esc(o.value)}" ${o.value===f.current?"selected":""}>${esc(o.label)}</option>`).join("");
  // Пустой список — это поломка, а не поле. Молчаливый <select> с одним «—»
  // неотличим от «не открывается пикер»: человек тапает и не понимает, кто виноват.
  if(!list.length) return `<label class="fld">${esc(f.title)}</label>
    <div class="warnfld" data-k="${f.key}">${esc(L().nolist)}</div>`;
  // <select> ОСТАЁТСЯ в DOM и остаётся источником истины: по нему читают форму,
  // в него восстанавливают черновик, на него подписан автосейв. Меняем только
  // способ выбрать — своей кнопкой и своим списком, потому что системный пикер
  // 04.08.2026 не открылся у выездника, и человек встал на полтора часа.
  const cur=list.find(o=>o.value===f.current);
  return `<label class="fld">${esc(f.title)}</label>
    <select data-k="${f.key}" class="nativesel"><option value="">—</option>${opts}</select>
    <button type="button" class="pick${cur?" has":""}" data-for="${f.key}"
      onclick="openPick(${jsq(f.key)})">${esc(cur?cur.label:"—")}</button>`;
}
// Свой список вариантов. Открывается листом снизу, вариант — крупная кнопка.
// Не зависит от прошивки телефона и от того, умеет ли webview показывать
// системный <select>.

// --- Обещание выездника (контракт v3): дата барабаном + сумма ---------------
// Скрытый <input data-k> — ИСТИНА (как <select> у пикера): по нему читает
// readForm, в него восстанавливается черновик, на него подписан автосейв.
// Барабан и чипы — только способ выбрать. Даты только сегодня-и-вперёд:
// обещание в прошлое сразу попадало бы в «Просроченные» руководителю.
function localToday(){ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
         String(d.getDate()).padStart(2,"0"); }
function srvToday(){
  // meta.today приезжает и из ОФЛАЙН-снимка бутстрапа недельной давности —
  // дата в прошлом дороже даты вперёд (кладёт должника в «Просроченные» и
  // врёт киллер-фильтру), поэтому берём ПОЗДНЮЮ из серверной и локальной.
  const s=(STATE.meta&&STATE.meta.today)||"";
  const loc=localToday();
  return (/^\d{4}-\d{2}-\d{2}$/.test(s)&&s>loc)?s:loc;
}
function typedFields(){ return (STATE.meta&&STATE.meta.typedFields)||[]; }
// Предел обещания оплаты — решение офиса: «не более трёх дней + к дню выезда».
// Ноль значит «без предела». Считаем от СЕРВЕРНОГО сегодня: часы телефона врут,
// а обещание, уехавшее за предел из-за сбитой даты, вернётся отказом сервера.
function promiseMaxDays(){ const n=+((STATE.meta||{}).promiseMaxDays||0);
  return Number.isFinite(n)&&n>0?n:0; }
function promiseMaxDate(){
  const n=promiseMaxDays(); if(!n) return "";
  const b=srvToday();
  const d=new Date(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10)+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
         String(d.getDate()).padStart(2,"0");
}
function promiseSection(d){
  const tf2=typedFields();
  if(!tf2.length) return "";
  const cur=(d&&d.formTyped)||{};
  const reg=(d&&d.formTypedRegistry)||{};
  const rows=tf2.map(f=>{
    const v=cur[f.key]||"";
    if(f.kind==="date"){
      const lim=(f.key==="promise_date")?promiseMaxDays():0;
      return `<label class="fld">${esc(f.title)}</label>
        <input type="hidden" data-k="${esc(f.key)}" value="${esc(v)}">
        <button type="button" class="pick${v?" has":""}" data-for="${esc(f.key)}"
          onclick="openDateWheel(${jsq(f.key)})">${esc(v||"—")}</button>
        ${lim?`<div class="muted" style="font-size:11px;margin:-6px 0 8px">не дальше ${esc(promiseMaxDate())} (${lim} дн от выезда)</div>`:""}
        ${reg[f.key]&&!v?`<div class="muted" style="font-size:11px;margin:-6px 0 8px">офис: ${esc(reg[f.key])}</div>`:""}`;
    }
    return `<label class="fld">${esc(f.title)}</label>
      <div class="moneyrow" style="margin-bottom:${reg[f.key]&&!v?"2px":"10px"}">
        <input data-k="${esc(f.key)}" inputmode="numeric" class="money" placeholder="0"
          value="${esc(fmtMoneyInput(v))}" oninput="onMoneyInput(this)">
        <button type="button" class="xbtn" aria-label="очистить"
          onclick="typedClear(${jsq(f.key)})">×</button>
      </div>
      ${reg[f.key]&&!v?`<div class="muted" style="font-size:11px;margin:0 0 10px">офис: ${esc(reg[f.key])}</div>`:""}`;
  }).join("");
  return `<div class="fsec"><div class="fsec-h">🤝</div>${rows}</div>`;
}
// Сумма: храним и шлём только цифры, показываем с разрядами («15 000»).
function fmtMoneyInput(v){
  const d=String(v==null?"":v).replace(/[^0-9]/g,"").slice(0,13);
  return d.replace(/\B(?=(\d{3})+(?!\d))/g," ");
}
function onMoneyInput(el){
  const shown=fmtMoneyInput(el.value);
  if(el.value!==shown) el.value=shown;
  if(el.value) FORM_CLEARED.delete(el.dataset.k);

function syncTypedLabels(){

  });

const MONTH_NAMES=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
let WHEEL={key:null,months:[]};
function openDateWheel(key){
  const el=document.querySelector('#panel input[data-k="'+key+'"]');
  if(!el) return;
  const base=srvToday();
  const by=+base.slice(0,4), bm=+base.slice(5,7);
  // Предел офиса действует только на дату обещания: встреча и напоминание
  // могут стоять сколь угодно далеко.
  WHEEL={key,months:[],max:(key==="promise_date")?promiseMaxDate():""};
  const lim=WHEEL.max?promiseMaxDays():0;
  const span=WHEEL.max?((+WHEEL.max.slice(0,4)-by)*12+(+WHEEL.max.slice(5,7)-bm)+1):13;
  for(let i=0;i<span;i++){                 // год вперёд, а с пределом — до него
    const m=(bm-1+i)%12, y=by+Math.floor((bm-1+i)/12);
    WHEEL.months.push({y,m:m+1,label:MONTH_NAMES[m]+" "+y});
  }
  const cur=el.value&&/^\d{4}-\d{2}-\d{2}$/.test(el.value)?el.value:null;
  const preset=lim?[["Завтра",1],["Послезавтра",2],["Через 3 дня",3]].filter(x=>x[1]<=lim)
                  :[["Завтра",1],["Через неделю",7],["Через месяц",30]];
  const chips=preset.map(
    ([label,days])=>`<button type="button" class="datechip"
      onclick="wheelChip(${days})">${label}</button>`).join("");
  const monthRows=WHEEL.months.map((mm,i)=>
    `<div class="wheelitem" data-i="${i}" onclick="wheelTap(this,'m')">${esc(mm.label)}</div>`).join("");
  const box=document.createElement("div");
  box.className="picksheet"; box.id="picksheet";
  box.innerHTML=`<div class="pickbg" onclick="closePick()"></div>
    <div class="pickbody">
      <div class="datechips" style="padding-top:12px">${chips}</div>
      <div class="wheelwrap wheelhead">
        <div class="wheelband"></div>
        <div class="wheel" id="wh_m"><div class="wheelpad"></div>${monthRows}<div class="wheelpad"></div></div>
        <div class="wheel" id="wh_d"><div class="wheelpad"></div><div class="wheelpad"></div></div>
      </div>
      <div style="display:flex;gap:8px;padding:0 14px 14px">
        <button type="button" class="btn line" style="flex:1" onclick="typedClear(${jsq(key)})">Убрать</button>
        <button type="button" class="btn acc" style="flex:1" onclick="wheelDone()">Готово</button>
      </div>
    </div>`;
  document.body.appendChild(box);
  let mi=0, day=null;
  if(cur){
    const cy=+cur.slice(0,4), cm=+cur.slice(5,7);
    const found=WHEEL.months.findIndex(x=>x.y===cy&&x.m===cm);
    if(found>=0){ mi=found; day=+cur.slice(8,10); }
  }
  wheelFillDays(mi, day);
  wheelScrollTo("wh_m", mi);
  const wm=$("wh_m");
  wm.addEventListener("scroll",()=>{ clearTimeout(wm._t);
    wm._t=setTimeout(()=>{ const i=wheelIndex("wh_m");
      wheelFillDays(i,null); wheelMark(); },120); },{passive:true});
  const wd=$("wh_d");
  wd.addEventListener("scroll",()=>{ clearTimeout(wd._t);
    wd._t=setTimeout(wheelMark,120); },{passive:true});
  wheelMark();
}
function wheelFillDays(mi, day){
  const mm=WHEEL.months[mi]; if(!mm) return;
  const base=srvToday();
  let dim=new Date(mm.y,mm.m,0).getDate();
  // первый месяц — только с сегодняшнего дня: обещание всегда вперёд
  const from=(mm.y===+base.slice(0,4)&&mm.m===+base.slice(5,7))?+base.slice(8,10):1;
  // последний месяц предела — только до предельного числа включительно
  if(WHEEL.max&&mm.y===+WHEEL.max.slice(0,4)&&mm.m===+WHEEL.max.slice(5,7))
    dim=Math.min(dim,+WHEEL.max.slice(8,10));
  const rows=[];
  for(let d2=from;d2<=dim;d2++)
    rows.push(`<div class="wheelitem" data-d="${d2}" onclick="wheelTap(this,'d')">${d2}</div>`);
  $("wh_d").innerHTML=`<div class="wheelpad"></div>${rows.join("")}<div class="wheelpad"></div>`;
  if(day){
    const idx=Math.max(0,day-from);
    wheelScrollTo("wh_d", idx);
  }
}
function wheelScrollTo(id,i){ const w=$(id); if(w) w.scrollTop=i*44; }
function wheelIndex(id){ const w=$(id); return w?Math.round(w.scrollTop/44):0; }
function wheelTap(el,kind){
  const w=el.parentElement;
  const items=[...w.querySelectorAll(".wheelitem")];
  w.scrollTo({top:items.indexOf(el)*44,behavior:"smooth"});
  setTimeout(wheelMark,180);
  if(kind==="m") setTimeout(()=>{ wheelFillDays(wheelIndex("wh_m"),null); },200);
}
function wheelMark(){
  ["wh_m","wh_d"].forEach(id=>{
    const w=$(id); if(!w) return;
    const i=wheelIndex(id);
    [...w.querySelectorAll(".wheelitem")].forEach((el,j)=>
      el.classList.toggle("on",j===i));
  });
}
function wheelChip(days){
  const base=srvToday();
  const d2=new Date(+base.slice(0,4),+base.slice(5,7)-1,+base.slice(8,10)+days);
  wheelSet(d2.getFullYear()+"-"+String(d2.getMonth()+1).padStart(2,"0")+"-"+
           String(d2.getDate()).padStart(2,"0"));
}
function wheelDone(){
  const mm=WHEEL.months[wheelIndex("wh_m")];
  const w=$("wh_d");
  const items=w?[...w.querySelectorAll(".wheelitem")]:[];
  const it=items[wheelIndex("wh_d")]||items[0];
  if(!mm||!it) return closePick();
  wheelSet(mm.y+"-"+String(mm.m).padStart(2,"0")+"-"+
           String(+it.dataset.d).padStart(2,"0"));
}
function wheelSet(iso){
  const el=document.querySelector('#panel input[data-k="'+WHEEL.key+'"]');
  if(el&&el.value!==iso){
    el.value=iso;
    FORM_CLEARED.delete(WHEEL.key);
    // change — тот же сигнал, что у пикера: автосейв и черновик подписаны на него
    el.dispatchEvent(new Event("change",{bubbles:true}));
  }
  FORM_TOUCHED.add(WHEEL.key);
  syncTypedLabels();
  closePick();
}

// не открываются), поэтому везде — обычные https deep-link'и.

}
function providerChips(d){

    <a href="${esc(l.yandex)}" target="_blank" rel="noopener noreferrer" onclick="openExt(event,this.href)">${ic("map")}<span>Я.Карты</span></a>
    <a href="${esc(l.google)}" target="_blank" rel="noopener noreferrer" onclick="openExt(event,this.href)">${ic("map")}<span>Google</span></a>
    <a href="${esc(l.twogis)}" target="_blank" rel="noopener noreferrer" onclick="openExt(event,this.href)">${ic("map")}<span>2ГИС</span></a>
  </div>`;
}
function openExt(e,url){ if(TG&&TG.openLink){ e.preventDefault(); TG.openLink(url); } }
function call(){ if(STATE.cur.phone) location.href="tel:"+STATE.cur.phone.replace(/[^+\d]/g,""); }

// Гео снимается В МОМЕНТ съёмки (не отправки): фактическая точка вручения
// досудебки. Уходит ЗАГОЛОВКОМ (не в URL — query оседает в access-логах),
// одинаково для онлайн-пути и оффлайн-очереди. ts — реальное время гео-фикса
// (не момент вызова): кэшированная точка не выдаётся за точку съёмки.
function photoHeaders(geo,ext,meta){
  const h=authHeaders();
  h["Content-Type"]="application/octet-stream";
  h["X-Photo-Raw"]="1";
  h["X-Photo-Ext"]=ext||".jpg";
  // geo.ts||0: сервер трактует gat<=0 как «фикса нет». Date.now() здесь выдавал
  // бы момент ДОСЫЛА из очереди за время съёмки.
  if(geo) h["X-Photo-Geo"]=geo.lat+","+geo.lon+","+(geo.acc||0)+","+(geo.ts||0);
  // Ниже — ТОЛЬКО опциональное. Обязательный новый заголовок сломал бы
  // установленные v12/v13: legacy-ветка сервера отвечает 503 и держит
  // очередь вечно. Нет заголовка = «не знаем», а не «нарушение».
  if(meta){
    if(meta.at) h["X-Photo-Shot"]=String(meta.at);
    if(meta.src) h["X-Photo-Source"]=meta.src;
    if(meta.sm!=null) h["X-Photo-Shrunk"]=String(meta.sm);
    const x=exifHeader(meta.exif); if(x) h["X-Photo-Exif"]=x;
  }
  return h;
}
// ДВЕ КНОПКИ, А НЕ УГАДЫВАНИЕ. Из поля просили прикладывать уже снятое — снял
// на камеру телефона, оформил вечером. Но точка съёмки у фото не украшение: по
// ней руководитель видит, что человек был на адресе. Камерное фото снимается
// ЗДЕСЬ И СЕЙЧАС, и текущая точка ему правда; лежавшее в галерее снято когда-то
// в другом месте, и подставить ему сегодняшнюю точку — соврать руководителю.
// Различать по file.lastModified нельзя: часть webview отдаёт время копирования
// файла в песочницу, то есть «сейчас» для любого старого снимка. Поэтому путь
// выбирает человек кнопкой, а мы просто не приписываем галерее того, чего не
// знаем. Само фото доезжает целиком — именно этого и просили.
async function upPhoto(id, live){
  const el=$(id||"photo"); if(!el) return;
  const files=[...(el.files||[])]; if(!files.length) return;
  if(!STATE.cur) return;                       // карточку успели закрыть
  const rep=STATE.cur.rep;
  // Намерение «переснять» живёт до первого снимка пачки, только для него и
  // только в пределах своего же КД.
  const retakeOf=(RETAKE_FOR&&RETAKE_FOR.rep===rep)?RETAKE_FOR.op_id:null;
  RETAKE_FOR=null;
  PHOTO_BUSY++;
  // Важно для iOS: читаем и жмём ВСЕ выбранные файлы сразу, пока
  // security-scoped файлы из picker живы. Дальше в сеть и IndexedDB идут
  // самостоятельные ArrayBuffer'ы, не File/Blob path.
  const prepared=[];
  try{
    for(const f of files){
      try{
        // EXIF — ПЕРВЫМ: shrinkPhoto стирает метаданные без следа и без лога.
        // Таймаут: медленное чтение не должно расширять окно, в котором файл
        // живёт только в памяти (iOS выгружает PWA на любом await).
        const exif=await Promise.race([
          readExifMeta(f).catch(()=>exifNone("error")),
          new Promise(r=>setTimeout(()=>r(exifNone("error")),EXIF_MS))]);
        // Жмём ДО чтения в ArrayBuffer: иначе в память и в IndexedDB ляжет
        // восьмимегабайтный оригинал, который потом всё равно не уедет.
        const small=await shrinkPhoto(f);
        exif.sm=small?1:0;   // «пережато/оригинал»: у HEIC-оригинала разбор возможен позже
        prepared.push({bytes:await photoBytes(small||f),
                       mime:small?"image/jpeg":(f.type||"image/jpeg"),
                       ext:small?".jpg":photoExt(f.name,f.type), exif});
      }catch(e){ toast(L().photolost); }
    }
    try{ el.value=""; }catch(e){}
    // Держим «занят» до конца отправки ВСЕЙ пачки: пока идёт сеть по первому
    // снимку, остальные живут только в памяти, и перезагрузка их потеряет.
    for(let i=0;i<prepared.length;i++)
      await sendPhoto(rep,prepared[i],live!==false,i===0?retakeOf:null);
  }finally{ PHOTO_BUSY--; }
}
async function sendPhoto(rep,p,live,retakeOf){
  const op_id=uuid(), at=Date.now();
  const bytes=p.bytes, mime=p.mime, ext2=p.ext;
  // Сначала фиксируем единственную самостоятельную копию и ждём commit IDB.
  // Только после этого допустимы geolocation/fetch: iOS может выгрузить PWA на
  // любом await, а pageshow/следующий запуск безопасно досылает тот же op_id.
  const entry={op_id,kind:"photo",rep,bytes,mime,ext:ext2,geo:null,at,
               src:live?"camera":"gallery", exif:p.exif};
  let geo=null;
  PHOTO_PREPARING.add(op_id);
  try{
    if(!(await enqueue(entry))){ toast(L().photolost); return; }
    // Связь ставим ТОЛЬКО если человек нажал «Переснять». Раньше её вешали на
    // «самое старое неудачное фото этого КД», и обычное добавление снимка молча
    // убирало из очереди чужую запись — вместе с напоминанием, что её надо
    // переснять. С мультивыбором это стало бы заметнее.
    if(retakeOf&&retakeOf!==op_id){
      entry.replaces_op_id=retakeOf;
      try{ await IDB.put("queue",entry); }catch(e){}  // базовая запись уже committed
    }
    // maximumAge 5с: для пруфа съёмки нужна свежая точка, а не кэш минутной
    // давности от прошлого адреса. Нет разрешения/сигнала — фото без точки.
    // Галерея точку не получает вовсе (см. комментарий у upPhoto).
    if(live){
      geo=await grabGeo(4000,5000);
      entry.geo=geo;
      try{ await IDB.put("queue",entry); }catch(e){}  // без geo фото всё равно сохранено
    }
  }finally{
    PHOTO_PREPARING.delete(op_id);
  }
  PHOTO_INFLIGHT.add(op_id);
  try{
    const r=await fetch("/api/photo?rep="+enc(rep)+"&op="+op_id,
      {method:"POST",headers:photoHeaders(geo,ext2,
         {at,src:entry.src,sm:p.exif&&p.exif.sm,exif:p.exif}),body:bytes});
    if(r.ok){
      const j=await r.json(); STATE.online=true;
      showPhotoCount(rep,j.photos);
      await retireReplacedPhoto(entry);
      try{ await IDB.del("queue",op_id); }catch(e){}
      toast(L().saved); updateOffBar(); return;
    }
    if(r.status!==401&&r.status!==403&&r.status<500){
      await markPhotoFailed(entry,String(r.status));
      await retireReplacedPhoto(entry);
      STATE.online=true;
      toast(L().photolost); updateOffBar(); return;
    }
    throw new Error(r.status);
  }catch(e){
    // Нет сети/временная серверная ошибка: committed-запись уже в очереди.
    // Счётчик покажем оптимистично, тот же op_id досылается при связи.
    // STATE.cur обнуляется тапом по нижней навигации. Без проверки это TypeError,
    // и он рвёт цикл отправки: остальные снимки пачки не уходят вообще.
    STATE.online=false;
    if(STATE.cur&&STATE.cur.rep===rep){
      STATE.cur.photos=(STATE.cur.photos||0)+1;
      const el=$("phc");
      if(el) el.textContent=L().photos+": "+STATE.cur.photos+" ("+L().queuedn+")";
    }
    toast(L().savedoff); updateOffBar();
  }finally{
    PHOTO_INFLIGHT.delete(op_id);
  }
}
// --- Геопозиция --------------------------------------------------------------
// ПОЧЕМУ ЗДЕСЬ ОТДЕЛЬНЫЙ ЗАПРОС ПРАВ. Раньше приложение не просило разрешение
// никогда и нигде: точку дёргали неявно, изнутри сохранения визита и отправки
// фото, и с таймаутом 3–4 секунды. За это время человек физически не успевает
// прочитать системный диалог «Разрешить доступ к геопозиции?» и нажать
// «Разрешить»: таймер срабатывает первым, промис закрывается, ответ выбрасывать
// уже некому. iOS второй раз диалог не показывает — и прав нет никогда, а значок
// геолокации не загорается. На андроиде, где права однажды дали, всё работало,
// поэтому баг и дожил. Отсюда правила ниже.
const GEO={state:"unknown",   // unknown | granted | denied | unavailable
           last:null, lastErr:0,
           // Удалось ли ВООБЩЕ спросить систему о состоянии прав. В телеграмном
           // webview на айфоне и в старом Safari `navigator.permissions` нет, и
           // тогда «unknown» означает «не знаем», а не «прав нет».
           probed:false};

function geoErrText(code){
  const t=L();
  if(code===1) return t.geodenied;
  if(code===2) return t.geonosignal;
  if(code===3) return t.geoslow;
  return t.nogeo;
}

// Телеграм на айфоне не всегда пробрасывает navigator.geolocation в свой webview:
// у неё для этого собственный LocationManager (Bot API 8.0+). Если он есть —
// работаем через него, иначе остаётся обычный браузерный путь.
let TGLOC=null;
function tgGeoInit(){
  try{
    if(TG && TG.LocationManager && TG.LocationManager.init){
      TG.LocationManager.init(()=>{ TGLOC=TG.LocationManager; });
    }
  }catch(e){}
}

function tgGetLocation(){
  return new Promise(res=>{
    if(!TGLOC || !TGLOC.getLocation) return res(null);
    try{
      TGLOC.getLocation(d=>{
        if(d && typeof d.latitude==="number"){
          GEO.state="granted";
          GEO.last={lat:d.latitude, lon:d.longitude,
                    acc:Math.round(d.horizontal_accuracy||0), ts:Date.now()};
          return res(GEO.last);
        }
        res(null);
      });
    }catch(e){ res(null); }
  });
}

// Явный запрос прав. Вызывается ТОЛЬКО по нажатию и БЕЗ таймаута: сколько
// человеку нужно на диалог — столько и ждём. Возвращает точку или null.
async function askGeo(){
  const viaTg = await tgGetLocation();
  if(viaTg) return viaTg;
  return askGeoBrowser();
}

function askGeoBrowser(){
  return new Promise(res=>{
    if(!navigator.geolocation){ GEO.state="unavailable"; return res(null); }
    navigator.geolocation.getCurrentPosition(
      p=>{ GEO.state="granted"; GEO.lastErr=0;
           GEO.last={lat:p.coords.latitude, lon:p.coords.longitude,
                     acc:Math.round(p.coords.accuracy||0), ts:p.timestamp||0};
           res(GEO.last); },
      e=>{ GEO.lastErr=(e&&e.code)||0;
           GEO.state=(GEO.lastErr===1)?"denied":"unknown";
           res(null); },
      {enableHighAccuracy:true, maximumAge:0});   // timeout НЕ задаём намеренно
  });
}

// Фоновый снимок точки: для гео-контроля визита и пруфа фото. Не блокирует
// сохранение — нет разрешения или сигнала, сохраняем без точки.
// Короткий таймаут допустим ТОЛЬКО когда права уже подтверждены: иначе он снова
// обгонит системный диалог. Пока прав нет — не дёргаем систему вхолостую.
async function grabGeo(ms,maxAge){
  // У телеграмного LocationManager НЕТ ни таймаута, ни фолбэка: если попап прав
  // закрыли или свернули приложение, колбэк не приходит НИКОГДА. А «Сохранить
  // выезд» ставит SAVING=true и гасит кнопку ДО этого await — значит блокировка
  // не снималась бы до перезапуска, и визит не ушёл бы ни на сервер, ни в очередь.
  // Приложение открывают в Телеграме, так что это основная ветка, а не редкая.
  if(TGLOC){
    const p = await Promise.race([
      tgGetLocation(),
      new Promise(r=>setTimeout(()=>r(null), ms)),
    ]);
    if(p) return p;
  }
  return grabGeoBrowser(ms,maxAge);
}

function grabGeoBrowser(ms,maxAge){
  return new Promise(res=>{
    if(!navigator.geolocation){ GEO.state="unavailable"; return res(null); }
    if(GEO.state==="denied") return res(null);
    // Права подтверждены — берём точку. Состояние НЕ выяснено, потому что спросить
    // систему нечем (телеграмный webview на айфоне, старый Safari) — тоже пробуем:
    // там права вполне могли быть выданы раньше, и молчаливый отказ отнял бы точку
    // у тех, у кого всё работало. А вот когда система ЯВНО сказала «ещё не
    // спрашивали», тихий запрос бессмыслен: он лишь сожжёт единственный показ
    // диалога на четырёхсекундном таймауте. Там работает кнопка.
    if(GEO.state!=="granted" && GEO.probed) return res(null);
    let done=false;
    const fin=v=>{ if(!done){ done=true; clearTimeout(t); res(v); } };
    const t=setTimeout(()=>fin(null), ms);
    navigator.geolocation.getCurrentPosition(
      p=>{ GEO.state="granted";   // получилось — значит права есть, плашку убрать
           GEO.last={lat:p.coords.latitude, lon:p.coords.longitude,
                     acc:Math.round(p.coords.accuracy||0), ts:p.timestamp||0};
           fin(GEO.last); },
      e=>{ GEO.lastErr=(e&&e.code)||0;
           if(GEO.lastErr===1) GEO.state="denied";
           fin(null); },
      {enableHighAccuracy:true, timeout:ms,
       maximumAge:(maxAge==null?60000:maxAge)});
  });
}

// Плашка «Включить геопозицию» на списке клиентов. Показывается, пока права не
// подтверждены: без явного нажатия система прав не даст, а молча падать —
// ровно та ошибка, из-за которой гео не работало вообще.
function geoStatusHTML(){
  const t=L();
  if(GEO.state==="granted") return "";
  if(GEO.state==="unavailable") return "";
  const msg = GEO.lastErr ? `<br>${esc(geoErrText(GEO.lastErr))}` : "";
  return `<div class="sline" id="geocard"><span class="d w"></span>
      <span>📍 ${esc(t.geowhy)}${msg}</span>
      <button class="toolbtn" onclick="geoEnable()">${esc(t.geoon)}</button></div>`;
}

function geoBanner(){ const el=$("geobar"); if(el) el.innerHTML=geoStatusHTML(); }

async function geoEnable(){
  const t=L(), card=$("geocard");
  if(card) card.innerHTML=`<div class="muted">📍 ${esc(t.geowait)}</div>`;
  const p=await askGeo();
  if(p){ toast("✅ "+t.geook); }
  else if(GEO.lastErr) toast(geoErrText(GEO.lastErr));
  geoBanner();
}

// Состояние прав на старте. permissions.query есть не везде (старый iOS Safari
// его не знает) — там остаёмся в "unknown" и показываем кнопку.
async function geoProbe(){
  try{
    if(navigator.permissions && navigator.permissions.query){
      const st=await navigator.permissions.query({name:"geolocation"});
      GEO.probed=true;
      if(st.state==="granted") GEO.state="granted";
      else if(st.state==="denied") GEO.state="denied";
      if(st.addEventListener) st.addEventListener("change",()=>{
        GEO.state=(st.state==="granted")?"granted":(st.state==="denied"?"denied":"unknown");
        try{ geoBanner(); }catch(e){}
      });
    }
  }catch(e){}
}

// --- Подтверждение выезда: следы телефона, пока открыта карточка --------------
// Раньше от выезда оставалась одна точка — где нажали «Сохранить выезд», — и её
// можно было нажать за квартал от адреса. Теперь, пока открыта карточка
// должника, телефон тихо отмечает, где он (шаг ≥30 с или ≥25 м), и всё это
// уезжает на сервер вместе с визитом — и онлайн, и через оффлайн-очередь.
// Черновик раз в 20 с несёт свежую точку отдельно: у неё будет серверное время
// приёма — доказательство связи на месте, которое с телефона не подделать.
// Буфер живёт в localStorage: iOS выгружает приложение, а следы терять нельзя.
const PR={rep:null,session:null,buf:[],watch:null,timer:null,last:null,lastTs:0,
          openedAt:0,fgSince:0,fgMs:0,openGeo:null,onlineOpen:null};
const PR_MAX=240, PR_MIN_MS=30000, PR_MIN_M=25;
function prKey(rep){ return "hb_presence:"+currentUid()+":"+rep; }
function prLoad(rep){ try{ const s=localStorage.getItem(prKey(rep)); return s?JSON.parse(s):null; }catch(e){ return null; } }
function prClear(rep){ try{ localStorage.removeItem(prKey(rep)); }catch(e){} }
function prOnline(){ return STATE.online!==false && (typeof navigator.onLine!=="boolean" || navigator.onLine); }
function prFg(){ return PR.fgMs+(PR.fgSince?Date.now()-PR.fgSince:0); }
function prSave(){
  if(!PR.rep) return;
  try{ localStorage.setItem(prKey(PR.rep), JSON.stringify({session:PR.session, opened_at:PR.openedAt,
    open_geo:PR.openGeo, online_open:PR.onlineOpen, fg_ms:prFg(), buf:PR.buf.slice(-PR_MAX)})); }catch(e){}
}
function prPush(p, kind){
  if(!PR.rep || !p || typeof p.lat!=="number" || typeof p.lon!=="number") return;
  const ts=p.ts||Date.now();
  // Стоящий на месте телефон шлёт точку каждую секунду — держим шаг.
  if(kind==="sample" && PR.last && ts-PR.lastTs<PR_MIN_MS && haversineKm(PR.last,p)*1000<PR_MIN_M) return;
  PR.last={lat:p.lat,lon:p.lon}; PR.lastTs=ts;
  PR.buf.push({ts, lat:+p.lat.toFixed(6), lon:+p.lon.toFixed(6), acc:Math.round(p.acc||0),
               on:prOnline()?1:0, vis:document.hidden?0:1, k:kind});
  if(PR.buf.length>PR_MAX) PR.buf.splice(0, PR.buf.length-PR_MAX);
  prSave();
}
function prOnPos(p){
  const g={lat:p.coords.latitude, lon:p.coords.longitude,
           acc:Math.round(p.coords.accuracy||0), ts:p.timestamp||Date.now()};
  GEO.state="granted"; GEO.last=g;
  prPush(g,"sample");
}
async function prStart(rep){
  prStop();
  const prev=prLoad(rep);   // карточку уже открывали, приложение выгружали — та же сессия
  PR.rep=rep; PR.session=(prev&&prev.session)||uuid(); PR.buf=(prev&&prev.buf)||[];
  PR.openedAt=(prev&&prev.opened_at)||Date.now(); PR.fgMs=(prev&&prev.fg_ms)||0;
  PR.fgSince=document.hidden?0:Date.now(); PR.openGeo=(prev&&prev.open_geo)||null;
  PR.onlineOpen=(prev&&prev.online_open!=null)?prev.online_open:(prOnline()?1:0);
  PR.last=null; PR.lastTs=0; prSave();
  // Точка открытия — только если права уже есть: системный диалог по открытию
  // карточки человек не ждёт, для него есть кнопка «Включить геопозицию».
  if(GEO.state==="granted"||GEO.last||TGLOC){
    const g=await grabGeo(8000,15000);
    if(g && PR.rep===rep && !PR.openGeo){
      PR.openGeo={lat:g.lat,lon:g.lon,acc:g.acc||0,ts:g.ts||Date.now()}; prPush(PR.openGeo,"open"); }
  }
  if(PR.rep!==rep) return;
  if(navigator.geolocation && GEO.state==="granted"){
    try{ PR.watch=navigator.geolocation.watchPosition(prOnPos, ()=>{},
           {enableHighAccuracy:true, maximumAge:15000, timeout:30000}); }catch(e){}
  }else if(TGLOC){
    PR.timer=setInterval(async()=>{ const p=await tgGetLocation(); if(p) prPush(p,"sample"); }, 60000);
  }
}
function prStop(){
  if(PR.watch!=null && navigator.geolocation){ try{ navigator.geolocation.clearWatch(PR.watch); }catch(e){} }
  PR.watch=null;
  if(PR.timer){ clearInterval(PR.timer); PR.timer=null; }
  if(PR.fgSince){ PR.fgMs+=Date.now()-PR.fgSince; PR.fgSince=0; }
  prSave();
  PR.rep=null; PR.session=null; PR.buf=[]; PR.openGeo=null;
}
// Что уезжает с «Сохранить выезд» (и в очередь): сессия, следы, точка открытия,
// связь при открытии и сколько минут приложение было на экране.
function prPayload(rep){
  let d;
  if(PR.rep===rep) d={session:PR.session, buf:PR.buf, open_geo:PR.openGeo, online_open:PR.onlineOpen, fg_ms:prFg()};
  else d=prLoad(rep)||{};
  return {session_id:d.session||uuid(), presence:(d.buf||[]).slice(-PR_MAX), open_geo:d.open_geo||null,
          online_at_open:d.online_open==null?null:d.online_open, foreground_ms:Math.round(d.fg_ms||0)};
}
document.addEventListener("visibilitychange", ()=>{
  if(!PR.rep) return;
  if(document.hidden){ if(PR.fgSince){ PR.fgMs+=Date.now()-PR.fgSince; PR.fgSince=0; } prSave(); }
  else PR.fgSince=Date.now();
});
// Гео выключена — выезд не подтвердится. Говорим об этом в карточке, а не только
// плашкой в списке: там её давно перестали замечать.
function geoOffVisitHTML(t){
  if(GEO.state!=="denied") return "";
  return `<div class="box" style="border-color:var(--danger);margin-bottom:10px">
    <div>📵 ${esc(t.geooffvisit)}</div>
    <button class="btn line" style="margin-top:8px" onclick="geoEnable()">${esc(t.geoon)}</button></div>`;
}
// Заполненные, но не закрытые карточки: за четыре дня теста таких набралось 16 —
// человек уезжал с адреса, думая, что выезд записан.
function draftsLeft(){
  const out=[];
  for(const p of (STATE.persons||[])){
    if(p.visited) continue;
    const d=loadDraft(p.rep);
    if(d && d.v && Object.keys(d.v).length) out.push(p);
  }
  return out;
}
function draftsLeftHTML(t){
  const ds=draftsLeft(); if(!ds.length) return "";
  return `<div class="box" style="border-color:var(--danger);margin-bottom:10px">
    <div>✍️ ${esc(t.draftsleft)}: <b>${ds.length}</b></div>
    ${ds.slice(0,5).map(p=>`<button class="btn line" style="margin-top:6px" onclick="openP(${jsq(p.rep)})">${esc(p.client)} ›</button>`).join("")}</div>`;
}

// Голосовой комментарий: диктовка → /api/voice → текст в поле.
// Выездники часто плохо пишут по-русски; голосом быстрее и полнее.
let REC=null,VOICE_WAIT=false;
async function toggleVoice(){
  const t=L(), btn=$("micbtn");
  if(VOICE_WAIT) return;
  if(REC){ try{REC.stop();}catch(e){} return; }
  if(!(navigator.mediaDevices&&window.MediaRecorder)){ toast(t.voicefail); return; }
  let stream=null;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast(t.voicefail); return; }
  const chunks=[];
  REC=new MediaRecorder(stream);
  REC.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  REC.onstop=async()=>{
    stream.getTracks().forEach(x=>x.stop());
    REC=null;
    if(btn) btn.innerHTML="🎤 <span>"+esc(t.voice)+"</span>";
    const blob=new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||"audio/webm"});
    if(blob.size<800) return;   // случайный тап — тишину не шлём
    VOICE_WAIT=true;
    toast(t.voicewait);
    const fd=new FormData(); fd.append("voice",blob,"voice.webm");
    const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),70000);
    // КАКАЯ карточка была открыта, когда говорили. Распознавание идёт до минуты,
    // и за это время выездник успевает уйти к следующему должнику. Раньше текст
    // вставлялся в ту карточку, что открыта в момент ОТВЕТА, и автосохранение
    // уносило его на сервер под чужим КД: и мусор в чужой строке реестра, и
    // смешение персональных данных двух людей. Заметить это нельзя — человек уже
    // смотрит следующий адрес.
    const rep0 = STATE.cur ? STATE.cur.rep : null;
    try{
      const r=await fetch("/api/voice?rep="+enc(rep0||""),
                          {method:"POST",headers:authHeaders(),body:fd,signal:ctl.signal});
      if(r.status===429||r.status===503){ toast(t.voiceunavail); return; }
      if(!r.ok) throw 0;
      const j=await r.json();
      if(!(j&&j.text)){ toast(t.voicefail); return; }
      const sameCase = STATE.cur && STATE.cur.rep===rep0;
      const ta=$("f_visit_comment");
      if(sameCase && ta){
        ta.value=(ta.value?ta.value.trim()+" ":"")+j.text;
        ta.dispatchEvent(new Event("input",{bubbles:true}));   // черновик подхватит
        toast("✓");
      }else if(rep0){
        // Ушли из карточки, пока говорили. Текст не теряем — дописываем в её
        // черновик и честно говорим, к кому он лёг.
        appendToDraft(rep0, j.text);
        toast(t.voiceother);
      }else toast(t.voicefail);
    }catch(e){ toast(e&&e.name==="AbortError"?t.voiceunavail:t.voicefail); }
    finally{ clearTimeout(timer); VOICE_WAIT=false; }
  };
  REC.start();
  if(btn) btn.innerHTML="⏹ <span>"+esc(t.voicestop)+"</span>";
  setTimeout(()=>{ if(REC){ try{REC.stop();}catch(e){} } }, 60000);   // предохранитель
}

// --- Фото должны уехать РАНЬШЕ карточки визита -------------------------------
// Карточка «Выезд отработан» уходит руководителю в момент закрытия визита, а
// снимок едет своим запросом. /api/save — короткий JSON, /api/photo — сотни
// килобайт: по журналу за 8–10.09.2026 из 293 карточек 48 ушли с «📸 без фото»
// при том, что фото появлялось на сервере в среднем через 2 секунды. Человек
// просто жал «Сохранить выезд», не дожидаясь, пока снимок догрузится.
//
// Поэтому сохранение сначала дожидается своих фото. Ждём ограниченно: без сети
// ждать нечего (визит и снимки уедут очередью в правильном порядке — она
// отсортирована по времени события), а держать человека у чужого подъезда
// нельзя. Что не успело — уходит в photos_pending, и сервер довешивает столько
// же ожидания уже у себя.
const PHOTO_SETTLE_MS=25000, PHOTO_SETTLE_STEP_MS=500;

// Снимки этого КД, которые сервер ещё не подтвердил. failed — отклонённые
// сервером (их ждать бессмысленно, они ждут пересъёмки).
async function pendingPhotos(rep){
  let items=[]; try{ items=(await IDB.all("queue"))||[]; }catch(e){ return 0; }
  return items.filter(it=>it.kind==="photo"&&it.rep===rep&&!it.failed).length;
}

async function waitPhotosSettled(rep){
  let left=await pendingPhotos(rep);
  if(!left&&!PHOTO_BUSY&&!PHOTO_PREPARING.size) return 0;
  const until=Date.now()+PHOTO_SETTLE_MS;
  let told=false;
  while(Date.now()<until){
    if(!PHOTO_BUSY&&!PHOTO_PREPARING.size&&!PHOTO_INFLIGHT.size){
      // Всё, что можно было отдать, отдано или лежит в очереди — толкаем её.
      await flushQueue();
      // Очередь не сдвинулась из-за отсутствия сети: ждать нет смысла, дальше
      // порядок держит сама очередь (фото записано раньше визита).
      if(!STATE.online) break;
    }
    left=await pendingPhotos(rep);
    if(!left&&!PHOTO_BUSY&&!PHOTO_PREPARING.size&&!PHOTO_INFLIGHT.size) return 0;
    if(!told){ told=true; toast(L().photosending); }
    await new Promise(r=>setTimeout(r,PHOTO_SETTLE_STEP_MS));
  }
  return await pendingPhotos(rep);
}

// Кнопка гасится на всё время отправки: grabGeo ждёт точку до 4 секунд, и за эту паузу
// палец успевает нажать ещё раз. Каждое нажатие — новый op_id, то есть отдельный выезд и
// отдельная отбивка руководителю (в проде так набралось 34 записи по одному договору).
let SAVING=false;
async function saveVisit(){
  if(SAVING) return;
  if(!FORM_VERSION){
    toast("Подключитесь к сети и обновите форму");
    return;
  }
  const values=readForm(), input_keys=[...FORM_TOUCHED];
  if(!values.call_status || !FORM_TOUCHED.has("call_status")){
    toast(L().resultreq);
    return;
  }
  SAVING=true;
  const btn=$("savebtn"); if(btn) btn.disabled=true;
  try{
    const rep=STATE.cur.rep, op_id=uuid();
    const geo=await grabGeo(4000,5000);   // свежая точка, не с прошлого адреса
    // Сначала фото, потом карточка: иначе руководителю уйдёт «📸 без фото» по
    // визиту, снимок которого догрузится через пару секунд.
    const photos_pending=await waitPhotosSettled(rep);
    // occurred_at — КОГДА выезд отработан. Онлайн это «сейчас», но та же форма
    // уходит в очередь и может доехать через сутки-двое (в горах под Худжандом
    // глушат интернет), и сервер без этой отметки датировал бы визит днём
    // доставки. Шлём всегда, чтобы оба пути были одинаковы.
    const occurred_at=Date.now();
    const body={rep,values,finish:true,op_id,photos_pending,occurred_at,
      opened_at:STATE.openedAt||occurred_at,
      form_version:FORM_VERSION,input_keys};
    const clearedNow=[...FORM_CLEARED].filter(k=>FORM_TOUCHED.has(k));
    if(clearedNow.length) body.cleared_keys=clearedNow;
    if(geo) body.geo=geo;
    // Следы выезда (сессия карточки, точки, точка открытия, связь, экран) —
    // одинаково в онлайн-тело и в запись очереди: pr снимается СЕЙЧАС.
    const pr=prPayload(rep);
    Object.assign(body, pr);
    try{
      const j=await api("/api/save",{method:"POST",body:JSON.stringify(body)});
      STATE.online=true; STATE.cur=j.person; IDB.put("cards",j.person,rep).catch(()=>{});
      finishSavedUI(rep, L().saved);
      // Визит сохранён, но поле сервер не принял (дата обещания за пределом,
      // нечитаемая сумма). Молчать нельзя: человек уедет с адреса уверенным,
      // что записал дату.
      const bad=j.rejected||null;
      if(bad&&bad.promise_date) toast("Дата обещания не принята: не дальше "+
        (promiseMaxDays()||3)+" дн от выезда");
      else if(bad) toast("Часть полей не принята: "+Object.keys(bad).join(", "));
    }catch(e){
      // Нет сети — кладём выезд в очередь, помечаем визит локально; уйдёт при связи.
      await enqueue({op_id, kind:"save", rep, values, input_keys,
        cleared_keys:clearedNow, photos_pending, occurred_at,
        opened_at:STATE.openedAt||occurred_at,
        form_version:FORM_VERSION, geo, pr, at:occurred_at});
      STATE.online=false; applyVisitLocally(rep, values);
      finishSavedUI(rep, L().savedoff);
    }
  } finally {
    SAVING=false;
    const b=$("savebtn"); if(b) b.disabled=false;
  }
}

// --- Автосохранение черновика формы (устойчивость к обрыву связи) ------------
// localStorage — источник истины: черновик переживает закрытие вкладки/обрыв сети.
// Раз в 20 сек тихо шлём его на сервер (POST /api/save finish:false — визит НЕ
// помечается завершённым, уведомления в группу не уходят, см. web.py _save).
// Полная очистка черновика — только после явного «Сохранить выезд» (finish:true).
let draftTimer=null, syncTimer=null, draftDirty=false;

function currentUid(){
  try{ if(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user) return TG.initDataUnsafe.user.id; }catch(e){}
  return new URLSearchParams(location.search).get("dev_uid") || "anon";
}
function draftKey(rep){ return "draft:"+currentUid()+":"+rep; }

// В payload попадают только явно затронутые пользователем контролы. Это отделяет
// локальный черновик от старого master-prefill в кэшированной карточке.
function fieldKey(el){
  if(!el) return "";
  if(el.dataset&&el.dataset.k) return el.dataset.k;
  if(el.id==="f_visit_comment") return "visit_comment";
  if(el.id==="f_tips") return "tips";
  return "";
}
function readForm(){
  const values={};
  document.querySelectorAll("#panel select[data-k]").forEach(s=>{
    if(FORM_TOUCHED.has(s.dataset.k)&&s.value) values[s.dataset.k]=s.value;
  });
  const cc=$("f_visit_comment");
  if(FORM_TOUCHED.has("visit_comment")&&cc&&cc.value.trim())
    values.visit_comment=cc.value.trim();
  const tp=$("f_tips");
  if(FORM_TOUCHED.has("tips")&&tp&&tp.value.trim()) values.tips=tp.value.trim();
  typedFields().forEach(f=>{
    if(!FORM_TOUCHED.has(f.key)) return;
    const el=document.querySelector('#panel input[data-k="'+f.key+'"]');
    if(!el) return;
    const v=f.kind==="date"?(el.value||"").trim():(el.value||"").replace(/[^0-9]/g,"");
    if(v) values[f.key]=v;
    else if(FORM_CLEARED.has(f.key)) values[f.key]="";  // явная очистка кнопкой
  });
  return values;
}
function formVisible(){ return !!(STATE.cur && STATE.tab==="form" && $("f_visit_comment")); }

function loadDraft(rep){ try{ const s=localStorage.getItem(draftKey(rep)); return s?JSON.parse(s):null; }catch(e){ return null; } }
function clearDraft(rep){ try{ localStorage.removeItem(draftKey(rep)); }catch(e){} }
function saveDraft(){
  if(!formVisible()) return;   // не читать DOM другой вкладки — иначе затрём черновик пустотой
  const v=readForm(), key=draftKey(STATE.cur.rep);
  try{
    if(Object.keys(v).length) localStorage.setItem(
      key, JSON.stringify({v, keys:[...FORM_TOUCHED], at:Date.now()}));
    else localStorage.removeItem(key);
  }catch(e){}
}
function flushDraft(){ clearTimeout(draftTimer); saveDraft(); }   // немедленно, перед уходом с формы

// Дописать текст в черновик ЧУЖОЙ (не открытой сейчас) карточки. Нужен ровно
// одному сценарию: голос ушёл на распознавание, а выездник за эту минуту перешёл
// к следующему должнику. Терять надиктованное нельзя, вставлять в открытую
// карточку — тем более: это чужие персональные данные.
function appendToDraft(rep, text){
  if(!rep || !text) return;
  let d=loadDraft(rep) || {v:{}, keys:[], at:Date.now()};
  const prev=(d.v && d.v.visit_comment) ? String(d.v.visit_comment).trim() : "";
  d.v=d.v||{}; d.v.visit_comment = prev ? (prev+" "+text) : text;
  d.keys=[...new Set([...(d.keys||[]), "visit_comment"])];
  d.at=Date.now();
  try{ localStorage.setItem(draftKey(rep), JSON.stringify(d)); }catch(e){}
}

function onFormChange(event){
  const key=fieldKey(event&&event.target);
  if(key) FORM_TOUCHED.add(key);
  draftDirty=true;
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{ saveDraft(); markDraftBadge(true); }, 500);
}
function markDraftBadge(dirty){
  const e=$("draftstat"); if(!e) return; const t=L();
  e.style.display="flex";
  e.innerHTML=`<span class="d" style="background:${dirty?'var(--danger)':'var(--success)'}"></span>`+
    `<span class="muted">${dirty?t.draftwait:t.draftsent}</span>`;
}

// Восстановление черновика поверх серверных значений при открытии формы.
function restoreDraftIntoForm(){
  if(!STATE.cur) return;
  const d=loadDraft(STATE.cur.rep); if(!d||!d.v) return;
  const draftKeys=new Set(
    Array.isArray(d.keys) ? d.keys : Object.keys(d.v)
  );
  let applied=false;
  Object.entries(d.v).forEach(([k,val])=>{
    if(!draftKeys.has(k)) return;
    let el=null;
    // call_comment — легаси-черновики, сохранённые старой оболочкой в localStorage
    if(k==="visit_comment"||k==="call_comment") el=$("f_visit_comment");
    else if(k==="tips") el=$("f_tips");
    else el=document.querySelector('#panel select[data-k="'+k+'"], #panel input[data-k="'+k+'"]');
    if(el){
      FORM_TOUCHED.add(k==="call_comment"?"visit_comment":k);
      if(el.value!==val){ el.value=val; applied=true; }
    }
  });
  if(applied||FORM_TOUCHED.size){ draftDirty=true; markDraftBadge(true); }
}
function setupFormDraft(){
  const p=$("panel"); if(!p) return;
  restoreDraftIntoForm();
  syncPickLabels();   // черновик мог проставить значения мимо наших кнопок
  syncTypedLabels();
  p.querySelectorAll('select[data-k], input[data-k], #f_visit_comment, #f_tips').forEach(el=>{
    el.addEventListener(

}

// Тихое фоновое обновление портфеля. iOS-ярлык неделями живёт без перезагрузки
// страницы (процесс замораживается/размораживается), boot() не перезапускается —
// без этого свежий разброс «не появлялся» (выглядело как кэш; данные /api service
// worker НЕ кэширует, виновата вечно спящая вкладка). Обновляем STATE и оффлайн-
// снимок; список перерисовываем ТОЛЬКО если он сейчас на экране — открытую
// карточку/форму не дёргаем, черновики целы.
let LAST_REFRESH=0;
async function refreshData(){
  if(Date.now()-LAST_REFRESH<60000) return;      // не чаще раза в минуту
  if(!appToken() && !(TG&&TG.initData)) return;  // входа нет — экран входа фоном не дёргаем
  const gen=WIPE_GEN;
  try{
    const d=await api("/api/bootstrap");
    if(gen!==WIPE_GEN) return;                   // телефон очистили, пока шёл запрос
    LAST_REFRESH=Date.now();
    offerSwap(d);        // новую ссылку открыли без связи: вход жив — теперь и спросить
    if(d.needsOnboarding) return;                // экраны входа фоном не дёргаем
    const prev=await loadBootstrapSnapshot();
    if(prev && prev.employee && d.employee && prev.employee!==d.employee){
      const left = await pendingCount();
      await clearLocalData({keepQueue: left > 0});
    }
    if(gen!==WIPE_GEN) return;
    const sig=ps=>JSON.stringify((ps||[]).map(p=>[p.rep,p.visited,p.n]));
    const changed=sig(STATE.persons)!==sig(d.persons);
    setMeta(d.meta, true); STATE.persons=d.persons; STATE.kind=d.kind||"agent";
    STATE.roles=d.roles||null;   // роль руководителя: список его сотрудников + текущий
    STATE.online=true; cacheBootstrap(d); updateOffBar();
    if(changed){
      warmCards();                               // и полные карточки новых клиентов
      const q=$("q");                            // поиск есть только на экране списка
      if(!STATE.cur && q){ const qs=q.value; renderList();
        if(qs){ $("q").value=qs; filterList(); } }
    }
  }catch(e){
    // Вход отозвали, пока приложение было открыто (iOS-ярлык живёт неделями без
    // перезагрузки): решаем так же, как при запуске, — подмена кандидатом или
    // очистка телефона. Но не посреди работы: открытую форму и отправку фото не
    // рвём, это сделает следующая проверка или запуск. Нет сети/5xx — молча.
    const st=+((e&&e.message)||0);
    if((st===401||st===403) && gen===WIPE_GEN && appToken() && !(TG&&TG.initData)
       && !SAVING && !PHOTO_BUSY && !PHOTO_PREPARING.size && !PHOTO_INFLIGHT.size
       && !formVisible()) onAuthRejected();
  }
}

// Апостроф тоже экранируется: в тексте и в атрибутах браузер вернёт его сам, а
// атрибут в одинарных кавычках без этого рвался бы (ревью 25.09.2026, Low).
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// Строка — аргумент встроенного обработчика: onclick="f(${jsq(x)})". Одного esc
// здесь мало: браузер раскодирует &#39; и &quot; в атрибуте ДО разбора JS, и
// апостроф узбекской латиницы («Farg'ona») закрыл бы строку — кнопка ломалась, а
// строка с нагрузкой исполнялась бы. enc() не спасает: апостроф он не кодирует.
// JSON.stringify даёт корректный JS-литерал, esc — корректный атрибут.
function jsq(s){ return esc(JSON.stringify(String(s==null?"":s))); }

// --- Геометки: захват точки (геолокация телефона) + сохранение ---
// Метка ставится по нажатию, значит можно и нужно спрашивать права здесь же —
// БЕЗ таймаута. Прежние 10 секунд тоже обгоняли системный диалог на холодном
// устройстве, и человек проваливался в ручной ввод координат, хотя всего лишь
// не успел нажать «Разрешить».
function getLoc(){
  return new Promise((resolve,reject)=>{
    const manual=()=>{ const s=prompt("lat, lon"); if(s&&s.includes(",")){
      const [a,b]=s.split(",").map(x=>parseFloat(x.trim())); if(!isNaN(a)&&!isNaN(b)) return resolve({lat:a,lon:b}); }
      reject(new Error("denied")); };
    askGeo().then(p=>{ if(p) resolve({lat:p.lat,lon:p.lon}); else manual(); })
            .catch(()=>manual());
  });
}

// Живая точка «где я сейчас». Без неё карта отвечает на вопрос «где должники»,
// но не на «где я относительно них» — а в поле нужен именно второй.
function startMeWatch(){
  stopMeWatch();
  if(!navigator.geolocation) return;
  if(GEO.state==="denied") return;
  if(GEO.state!=="granted" && GEO.probed) return;   // см. grabGeoBrowser
  try{
    MEWATCH=navigator.geolocation.watchPosition(
      p=>{ GEO.last={lat:p.coords.latitude, lon:p.coords.longitude,
                     acc:Math.round(p.coords.accuracy||0), ts:p.timestamp||0};
           drawMePin(GEO.last); },
      ()=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  }catch(e){}
}
function stopMeWatch(){
  if(MEWATCH!=null && navigator.geolocation){
    try{ navigator.geolocation.clearWatch(MEWATCH); }catch(e){}
  }
  MEWATCH=null; MEPIN=null;
}

// ═══ Вкладка руководителя («Сводка» → экран статистики) ═══════════════════════
// СОДЕРЖИМОЕ русское — как весь дайджест (решение владельца): руководители
// читают по-русски. В I18N живут только подпись вкладки и служебные состояния.
// Данные приходят ТОЛЬКО с сервера (/api/manager/*): даты и окна периода
// считает сервер (контейнер в UTC, телефон в +3/+5 — клиентская дата утром
// показывала бы пустой день); клиент шлёт пресет и число сдвигов либо две
// строки из полей «с/по» и сам дат не строит. Всё из БД проходит через esc();
// в onclick уходят ЧИСЛОВЫЕ индексы состояния, а редкие строки (дата, код
// страны и офиса) — только через jsq(): апостроф в ФИО и городах на узбекской
// латинице — норма, и голый esc в JS-строке обработчика его не удержит.
let DG={view:"stats", date:null, today:null, prev:null, next:null,
        preset:"today", shift:0, from:null, to:null, range:null,
        emp:null, rep:null, seq:0, last:0, rows:[], cases:[], items:[], days:[],
        sort:"visits", dir:-1, country:"", q:"", stats:null,
        binds:null, baccs:[], bindacc:null, bindq:"", btargets:[]};
function dgQ(extra){ const p=new URLSearchParams(); if(DG.date) p.set("date",DG.date);
  Object.entries(extra||{}).forEach(([k,v])=>{ if(v!=null&&v!=="") p.set(k,v); });
  const s=p.toString(); return s?("?"+s):""; }
function dgRangeQ(extra){
  const p=new URLSearchParams();
  if(DG.preset==="custom"){ if(DG.from) p.set("from",DG.from); if(DG.to) p.set("to",DG.to); }
  else p.set("preset",DG.preset||"today");
  if(DG.shift) p.set("shift",DG.shift);
  Object.entries(extra||{}).forEach(([k,v])=>{ if(v!=null&&v!=="") p.set(k,v); });

    b.innerHTML=`<div class="center">${esc(t.dggone)}</div>`; return; }
  // 403 выше — отняли роль, вход жив; 401 — отозван сам вход: как при запуске.
  if(st===401){ onAuthRejected(); return; }

    <button class="btn line" style="margin-top:12px" onclick="dgGo('stats')">←</button>`;

  b.innerHTML=`<div class="center">${esc(!st?t.dgneednet:t.dgerr)}</div>

function dgKpis(t,rg){

    ${k(t.visits||0,"выездов",c("visits"))}${k(t.paid||0,"оплачен",c("paid"))}${k(t.promised||0,"обещают",c("promised"))}

// Пометки контроля у выезда: доехал не в свой день, закрыт без точки телефона.
const DG_EV={confirmed:"🛡 на адресе",far:"⚠️ у адреса не был",nofix:"❔ точка неточная",coarse:"❔ адрес неточный"};
function caseMarks(c){
  const out=[];
  if(c.late_days) out.push("⏱ +"+c.late_days+" дн");
  if(c.geo===false) out.push("📍 без гео");
  if(c.fill_text) out.push("⏱ карточка "+c.fill_text);
  // Подтверждение выезда — одним словом, как в карточке руководителю.
  const ev=DG_EV[c.evidence_level];
  if(ev) out.push(ev+((c.evidence_level==="confirmed"&&c.near_min)?" "+c.near_min+" мин":""));
  if(c.saved_away) out.push("✍️ заполнен не на адресе");
  if(c.series) out.push("🧾 "+c.series);
  return out.length?" · "+out.join(" · "):"";
}

// Экран руководителя, одноязычный по решению владельца — как digest.py.
// Blob-URL живут в LRU на 12 записей: <img src> с токеном невозможен (токен в
// query запрещён), поэтому байты тянутся fetch'ем с заголовками.
const PHOTOBLOBS=new Map();
const PHOTOBLOBS_MAX=12;
async function photoBlobUrl(key){
  if(PHOTOBLOBS.has(key)){ const u=PHOTOBLOBS.get(key);
    PHOTOBLOBS.delete(key); PHOTOBLOBS.set(key,u); return u; }
  const r=await fetch("/api/manager/photo?file="+enc(key),{headers:authHeaders()});
  if(!r.ok) throw new Error(r.status);
  const u=URL.createObjectURL(await r.blob());
  PHOTOBLOBS.set(key,u);
  while(PHOTOBLOBS.size>PHOTOBLOBS_MAX){
    const k0=PHOTOBLOBS.keys().next().value;
    URL.revokeObjectURL(PHOTOBLOBS.get(k0)); PHOTOBLOBS.delete(k0);
  }
  return u;
}
function photoBlobsFree(){ for(const u of PHOTOBLOBS.values()) URL.revokeObjectURL(u);
                           PHOTOBLOBS.clear(); }

// --- Полноэкранная навигация: «Поехать» переводит миниапп в режим навигатора. ---
// Живая геопозиция (watchPosition) + камера «по курсу» (track-up, как в обычных
// навигаторах) + линия маршрута (свой OSRM, если поднят, иначе честная прямая) +
// нижняя плашка с расстоянием/ETA. Внешние приложения (Я/Google/2ГИС) остаются
// для настоящей голосовой turn-by-turn навигации — это сознательное решение:
// здесь остаются живой превью-навигатор и быстрый переход.
let NAV = {map:null, watchId:null, follow:true, lastPos:null, lastHeading:0,
           meMarker:null, destMarker:null, routeFetched:false, refreshTimer:null,
           dest:null, bannerTimeout:null, free:false,

function bearingBetween(a,b){
  const toRad=x=>x*Math.PI/180, toDeg=x=>x*180/Math.PI;
  const dLon=toRad(b.lon-a.lon);
  const y=Math.sin(dLon)*Math.cos(toRad(b.lat));
  const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(dLon);
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function haversineKm(a,b){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

  const r=STATE.roles; if(!r||!(r.employees||[]).length) return;
  const box=document.createElement("div");
  box.className="picksheet"; box.id="picksheet";
  box.innerHTML=`<div class="pickbg" onclick="closePick()"></div>
    <div class="pickbody"><div class="pname" style="padding:2px 8px 8px">${esc(L().pfpick)}</div>
      <div class="searchwrap" style="margin:0 6px 6px">${ic("search")}<input class="search" id="pfq"
        placeholder="${esc(L().search)}" oninput="drawPortfolioPick(this.value)"></div>
      <div id="pflist"></div></div>`;
  document.body.appendChild(box);
  drawPortfolioPick("");
}
function drawPortfolioPick(q){
  const el=$("pflist"), r=STATE.roles; if(!el||!r) return;
  const f=fold(q||"").trim();
  el.innerHTML=(r.employees||[]).map((e,i)=>[e,i]).filter(([e])=>!f||fold(e).includes(f))
    .map(([e,i])=>`<button type="button" class="pickrow${e===r.acting?" on":""}" onclick="pickPortfolio(${i})">${esc(e)}</button>`)
    .join("")||`<div class="center">—</div>`;
}
function pickPortfolio(i){
  const e=((STATE.roles||{}).employees||[])[i]; closePick();
  if(!e) return;
  // После переключения boot() откроет тот режим, что выбран: портфель выбирают
  // из «Выездника» — туда и вернуться.
  try{ localStorage.setItem(modeKey(), "field"); }catch(ex){}
  actAs(e);
}

async function actAs(employee){
  if(!employee || (STATE.roles && employee===STATE.roles.acting)) return;
  const t = L();
  // Сначала пытаемся ДОСЛАТЬ незавершённое: переключение портфеля не должно
  // стоить человеку уже сделанной работы.
  await flushQueue();
  const left = await pendingCount();
  if(left && !confirm(t.mgrpending.replace("{n}", left))){
    renderList();                 // вернуть селектор к текущему сотруднику
    return;
  }
  toast(t.mgrswitching);
  try{
    await api("/api/act_as", {method:"POST", body:JSON.stringify({employee})});
  }catch(e){ toast("✕"); return; }
  // Чужие карточки убираем всегда; неотправленную очередь сохраняем — её судьбу
  // человек только что решил сам.
  await clearLocalData({keepQueue: left > 0});
  await boot();
}

// --- Оффлайн-подгрузка карточек: видимый процесс ------------------------------
// Раньше карточки тянулись молча, и выездник уезжал в поле не зная, докачалось ли.
// Теперь виден прогресс, итог и время последней загрузки — а при обрыве понятно,
// что кэш неполный и надо повторить, пока сеть ещё есть.
const WARM_KEY = "hb_warm_at";

function warmBar(html){ const el=$("warmbar"); if(el) el.innerHTML=html; }

function warmStatusHTML(){
  const t = L();
  const at = +(localStorage.getItem(WARM_KEY) || 0);
  const n = STATE.warmCount || 0, total = (STATE.persons||[]).length;
  // v62: строка статуса с маленькой кнопкой, а не коробка с большой — список
  // клиентов начинается выше, на первом экране телефона.
  if(!at) return `<div class="sline"><span class="d w"></span><span>${esc(t.warmnone)}</span>
      <button class="toolbtn" onclick="warmCards(true)">⬇ ${esc(t.warmgo)}</button></div>`;
  const ok = n >= total && total > 0;
  return `<div class="sline"><span class="d${ok?"":" w"}"></span>
      <span>${esc(t.warmready)}: ${n}/${total} · ${hhmm(new Date(at))}</span>
      <button class="toolbtn" onclick="warmCards(true)" aria-label="${esc(t.warmagain)}">⬇ ${ok?"":esc(t.warmagain)}</button></div>`;
}

// --- Навигация по произвольному адресу ----------------------------------------
// Руководителю — доехать до адреса должника, которого нет в его портфеле;
// владельцу — проверить навигатор на любой точке. Адрес разбирается и ищется
// ОФЛАЙН-справочником на сервере (/api/geocode): наружу ничего не уходит, потому
// что публичные геокодеры на сервере-витрине запрещены (адреса должников — ПД).
function askAddress(){
  if($("freenavbox")) { const q=$("freenavq"); if(q) q.focus(); return; }
  const t=L();
  $("plist").insertAdjacentHTML("beforebegin", `
    <div class="pcard" id="freenavbox" style="display:block;margin-bottom:10px">
      <input class="search" id="freenavq" style="width:100%;margin-bottom:8px"
             placeholder="${esc(t.freenavph)}" onkeydown="if(event.key==='Enter')freeNavGo()">
      <div style="display:flex;gap:8px">
        <button class="btn acc" style="flex:1" onclick="freeNavGo()">${ic("nav")}<span>${esc(t.go)}</span></button>
        <button class="btn line" style="flex:0 0 52px" onclick="closeFreeNav()">✕</button>
      </div>
      <div class="muted" id="freenavhint" style="margin-top:8px"></div>
    </div>`);
  const el=$("freenavq"); if(el) el.focus();
}
function closeFreeNav(){ const b=$("freenavbox"); if(b) b.remove(); }
async function freeNavGo(){
  const t=L(), el=$("freenavq"), h=$("freenavhint");
  const q=((el&&el.value)||"").trim();
  if(!q) return;
  if(h) h.textContent="…";
  let j=null;
  try{ j=await api("/api/geocode?q="+enc(q)); }catch(e){ j=null; }
  if(!j||!j.ok){ if(h) h.textContent=t.freenavfail; return; }
  // Справочник честно сообщает достигнутую точность. Ниже района ехать по такой
  // точке бессмысленно — предупреждаем, но не запрещаем: это тестовый режим.
  const rough = (j.precision==="district"||j.precision==="region");
  closeFreeNav();
  if(rough) toast(t.freenavrough);
  enterNav({lat:j.lat, lon:j.lon, title:j.pretty||q});
}

// Без аргумента — навигация к текущему должнику (как было). С аргументом
// {lat,lon,title} — к произвольной точке: адресу, которого нет в портфеле.
function enterNav(dest){
  const t=L();
  const d = (dest && dest.lat!=null)
    ? {client:dest.title||"", geo:{lat:dest.lat, lon:dest.lon}, free:true}
    : STATE.cur;
  if(!(d && d.geo && d.geo.lat)){ toast(t.none); return; }
  NAV.free = !!d.free;
  NAV.dest={lat:d.geo.lat, lon:d.geo.lon};
  document.body.classList.add("navon");
  $("navmode").innerHTML = navShellHTML(d,t);
  $("navmode").classList.add("on");
  navShowBanner(t.getloc);
  setTimeout(()=>initNavMap(d),0);
  startNavWatch();
  NAV.bannerTimeout = setTimeout(()=>{ if(!NAV.lastPos) navShowBanner(t.nogeo); }, 8000);
  if(TG && TG.BackButton){ try{ TG.BackButton.offClick(exitNav); TG.BackButton.onClick(exitNav); TG.BackButton.show(); }catch(e){} }
}
function exitNav(){
  document.body.classList.remove("navon");
  $("navmode").classList.remove("on");
  $("navmode").innerHTML = "";
  stopNavWatch();
  if(NAV.refreshTimer){ clearInterval(NAV.refreshTimer); NAV.refreshTimer=null; }
  if(NAV.bannerTimeout){ clearTimeout(NAV.bannerTimeout); NAV.bannerTimeout=null; }
  if(NAV.map){ try{NAV.map.remove();}catch(e){} }
  NAV.map=null; NAV.meMarker=null; NAV.destMarker=null; NAV.routeFetched=false;
  NAV.lastPos=null; NAV.follow=true; NAV.free=false;
  NAV.session=null; NAV.buf=[]; NAV.lastTracked=null;
  if(TG && TG.BackButton){ try{ TG.BackButton.hide(); TG.BackButton.offClick(exitNav); }catch(e){} }
}
function navFinish(){
  exitNav();
  STATE.tab="form";
  renderDetail();
}
function navRecenter(){
  NAV.follow=true;
  const rc=$("navrecenter"); if(rc) rc.classList.remove("hot");
  if(NAV.map && NAV.lastPos){
    try{ NAV.map.easeTo({center:[NAV.lastPos.lon,NAV.lastPos.lat], bearing:NAV.lastHeading||0,
      pitch:55, zoom:Math.max(NAV.map.getZoom(),16), duration:450}); }catch(e){}
  }
}
function navShowBanner(msg){ const b=$("navbanner"); if(!b) return; b.style.display="flex"; b.innerHTML=`${ic("pin")}<span>${esc(msg)}</span>`; }
function navHideBanner(){ const b=$("navbanner"); if(b) b.style.display="none"; }

async function initNavMap(d){
  const el=$("navmap"); if(!el) return;
  if(!(await ensureMapLibs())) return;
  let style=RASTER_STYLE; const vt=STATE.meta&&STATE.meta.vectorTiles;
  if(vt&&window.pmtiles&&window.protomaps_themes_base){ try{ style=vectorStyle(vt); }catch(e){} }
  NAV.map=new maplibregl.Map({container:el, style, center:[d.geo.lon,d.geo.lat], zoom:15,
    pitch:50, attributionControl:false, dragRotate:true});
  let fb=false;
  NAV.map.on("error",()=>{ if(!fb&&style!==RASTER_STYLE){ fb=true; try{NAV.map.setStyle(RASTER_STYLE);}catch(e){} } });
  NAV.map.on("dragstart",()=>{ NAV.follow=false; const rc=$("navrecenter"); if(rc) rc.classList.add("hot"); });
  NAV.destMarker=new maplibregl.Marker({color:"#B0472C"}).setLngLat([d.geo.lon,d.geo.lat]).addTo(NAV.map);
}

// --- Запись трека поездки ------------------------------------------------------
// Копим точки в памяти и отправляем пачками. Что не ушло (в поле сеть рвётся
// постоянно) — переживает закрытие аппы в localStorage и досылается при следующем
// запуске. Сервер идемпотентен по (session_id, ts), поэтому повторы безопасны.
const TRACK_KEY="hb_track_queue", TRACK_FLUSH_N=10, TRACK_FLUSH_MS=30000, TRACK_MIN_M=15;

function trackQueue(){
  let q=[]; try{ q=JSON.parse(localStorage.getItem(TRACK_KEY)||"[]"); }catch(e){ return []; }
  // Пачки, сохранённые прошлой версией, id не имеют. Без него фильтр по bid
  // вычистил бы их все разом — выдаём id на месте.
  let patched=false;
  for(const b of q){ if(b && !b.bid){ b.bid=uuid(); patched=true; } }
  if(patched) trackQueueSet(q);
  return q;
}
function trackQueueSet(q){ try{ localStorage.setItem(TRACK_KEY, JSON.stringify(q.slice(-2000))); }catch(e){} }

function trackPush(me, p){
  if(!NAV.session) return;
  // Стоящий на месте телефон шлёт точку каждую секунду — держим шаг ≥15 м,
  // иначе за час стоянки набегут тысячи одинаковых координат.
  const last=NAV.lastTracked;
  if(last && haversineKm(last, me)*1000 < TRACK_MIN_M) return;
  NAV.lastTracked=me;
  NAV.buf.push({ts:new Date(p.timestamp||Date.now()).toISOString(), lat:me.lat, lon:me.lon,
                acc:(p.coords&&p.coords.accuracy)||null,
                speed:(p.coords&&p.coords.speed)||null, heading:NAV.lastHeading||null});
  if(NAV.buf.length>=TRACK_FLUSH_N) trackFlush();
}

async function trackFlush(){
  if(!NAV.session || !NAV.buf.length) return;
  const batch={bid:uuid(),   // стабильный id пачки: по нему её удаляют из очереди
               session_id:NAV.session, rep:(NAV.free?null:(STATE.cur&&STATE.cur.rep)||null),
               points:NAV.buf.splice(0, NAV.buf.length)};
  try{
    await api("/api/track", {method:"POST", body:JSON.stringify(batch)});
  }catch(e){
    trackQueueSet(trackQueue().concat([batch]));   // не ушло — в очередь на потом
  }
}

// Досыл накопленного. Очередь перечитывается ПЕРЕД каждой правкой и удаляется
// ровно одна пачка по её id: раньше здесь один раз делался снимок, а в конце
// он записывался обратно целиком — и всё, что trackFlush дописал за время
// ожидания сети, молча стиралось вместе с точками текущей поездки.
async function trackDrainQueue(){
  for(const b of trackQueue()){
    try{
      await api("/api/track", {method:"POST", body:JSON.stringify(b)});
      trackQueueSet(trackQueue().filter(x => x.bid !== b.bid));
    }catch(e){ return; }        // сеть пропала — остальное дождётся следующего раза
  }
}

async function startNavWatch(){
  NAV.session=uuid(); NAV.buf=[]; NAV.lastTracked=null;
  trackDrainQueue();                                   // сначала досылаем прошлое
  if(!navigator.geolocation){ navShowBanner(L().nogeo); return; }
  // watchPosition сам покажет системный диалог, но его ответ никто не ждёт и
  // навигация стартует «слепой». Спрашиваем права заранее и по-человечески.
  if(GEO.state!=="granted"){
    const p=await askGeo();
    if(!p){ navShowBanner(geoErrText(GEO.lastErr)); return; }
  }
  NAV.trackTimer=setInterval(trackFlush, TRACK_FLUSH_MS);
  NAV.watchId=navigator.geolocation.watchPosition(onNavPos, onNavPosErr,
    {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
}
function stopNavWatch(){
  if(NAV.watchId!=null && navigator.geolocation){ navigator.geolocation.clearWatch(NAV.watchId); NAV.watchId=null; }
  if(NAV.trackTimer){ clearInterval(NAV.trackTimer); NAV.trackTimer=null; }
  trackFlush();                       // хвост поездки не теряем
}
function onNavPosErr(){ navShowBanner(L().nogeo); }

function onNavPos(p){
  if(NAV.bannerTimeout){ clearTimeout(NAV.bannerTimeout); NAV.bannerTimeout=null; }
  navHideBanner();
  const me={lat:p.coords.latitude, lon:p.coords.longitude};
  const heading=(p.coords.heading!=null && !isNaN(p.coords.heading)) ? p.coords.heading : null;
  const prev=NAV.lastPos; NAV.lastPos=me;
  if(heading!=null) NAV.lastHeading=heading;
  else if(prev) NAV.lastHeading=bearingBetween(prev, me);
  if(NAV.map){
    if(!NAV.meMarker){
      const elx=document.createElement("div"); elx.className="navme"; elx.innerHTML=ICONS.nav;
      NAV.meMarker=new maplibregl.Marker({element:elx, anchor:"center",
        rotationAlignment:"viewport", pitchAlignment:"viewport"}).setLngLat([me.lon,me.lat]).addTo(NAV.map);
    } else NAV.meMarker.setLngLat([me.lon,me.lat]);
    if(NAV.follow){
      try{ NAV.map.easeTo({center:[me.lon,me.lat], bearing:NAV.lastHeading||NAV.map.getBearing(),
        pitch:55, zoom:Math.max(NAV.map.getZoom(),16), duration:600}); }catch(e){}
    }
  }
  trackPush(me, p);
  updateNavStats(me);
  if(!NAV.routeFetched){
    NAV.routeFetched=true;
    fetchNavRoute(me);
    NAV.refreshTimer=setInterval(()=>{ if(NAV.lastPos) fetchNavRoute(NAV.lastPos); }, 25000);
  }
}

function updateNavStats(me){
  if(!NAV.dest) return;
  const km=haversineKm(me, NAV.dest);
  const dd=$("navdist"); if(dd) dd.textContent = km<1 ? Math.round(km*1000)+" м" : km.toFixed(1)+" км";
  const minutes=Math.max(1, Math.round(km/30*60));
  const de=$("naveta"); if(de) de.textContent = "≈ "+minutes+" "+L().mins;
}

async function fetchNavRoute(me){
  try{
    const url = NAV.free
      ? `/api/route_to?lat=${me.lat}&lon=${me.lon}&dlat=${NAV.dest.lat}&dlon=${NAV.dest.lon}`
      : `/api/route?rep=${enc(STATE.cur.rep)}&lat=${me.lat}&lon=${me.lon}`;
    const j=await api(url);
    if(j && j.line) drawNavRoute(j.line);
  }catch(e){
    if(NAV.dest) drawNavRoute([[me.lon,me.lat],[NAV.dest.lon,NAV.dest.lat]]);
  }
}
function drawNavRoute(line){
  if(!NAV.map) return;
  const data={type:"Feature",geometry:{type:"LineString",coordinates:line}};
  const draw=()=>{
    try{
      if(NAV.map.getSource("navroute")){ NAV.map.getSource("navroute").setData(data); return; }
      NAV.map.addSource("navroute",{type:"geojson",data});
      NAV.map.addLayer({id:"navroute-casing",type:"line",source:"navroute",
        layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#ffffff","line-width":9,"line-opacity":.9}});
      NAV.map.addLayer({id:"navroute",type:"line",source:"navroute",
        layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#2F6FED","line-width":5}});
    }catch(e){}
  };
  if(NAV.map.isStyleLoaded()) draw(); else NAV.map.once("load",draw);
}

boot();
</script>
</body>
