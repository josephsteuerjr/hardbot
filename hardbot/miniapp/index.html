<!-- Telegram SDK — локально (same-origin), чтобы приложение поднималось в оффлайне. -->

<!-- Карт-библиотеки (maplibre/pmtiles/protomaps) НЕ грузим в оболочке: для заполнения
     визита карта не нужна, а лишние внешние CDN ломали бы оффлайн-старт. Грузятся лениво
     при открытии карты (ensureMapLibs) и кэшируются service worker'ом. -->
<script>
// Регистрируем service worker (кэш оболочки для оффлайна). Тихо, без влияния на онлайн.
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("/sw.js").catch(function(){}); });
}
</script>
<style>
:root{
  --bg:#FAF9F5; --card:#FFFFFF; --alt:#F5F4ED; --border:#E6E2D9;
  --text:#2B2825; --muted:#6B6660; --accent:#36332E; --accent2:#46423B;
  --success:#5B8A3C; --danger:#B0472C; --navblue:#2F6FED;
  --app-height:100vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{position:fixed;top:0;left:0;right:0;width:100%;height:var(--app-height);margin:0;
  overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;
  font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45}
button,a,input,select,textarea,.pcard{touch-action:manipulation}
  .warnfld{border:1px solid #B0472C;border-radius:10px;padding:10px 12px;color:#B0472C;font-size:13px;line-height:1.35;margin-bottom:10px}
.ico{display:inline-flex;flex:0 0 auto;width:18px;height:18px}
.ico svg{width:100%;height:100%;display:block}
.bar{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-bottom:1px solid var(--border);position:relative;
  flex:0 0 auto;background:var(--bg);z-index:5}
.brand{font-weight:600;letter-spacing:.3px}
/* Индикатор оффлайна / очереди отправки (данные кэшируются, визиты — в очередь). */
.offbar{display:none;align-items:center;gap:8px;padding:7px 14px;font-size:12.5px;
  background:#FBEED9;color:#7A5A1E;border-bottom:1px solid #EBD9B5;
  position:relative;flex:0 0 auto;z-index:4}
.offbar.on{display:flex}
.offbar .d{width:7px;height:7px;border-radius:50%;background:#C9852A;flex:0 0 auto}
.offbar .offact{margin-left:auto;border:1px solid #C9852A;border-radius:14px;
  background:transparent;color:#7A5A1E;padding:3px 9px;font:inherit;white-space:nowrap}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--border);background:var(--card);border-radius:20px;
  padding:4px 10px;font-size:12px;color:var(--muted);font-family:inherit}
.langs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.wrap{flex:1 1 auto;min-height:0;width:100%;padding:12px 14px 96px;max-width:520px;
  margin:0 auto;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;scrollbar-gutter:stable;scroll-padding-bottom:96px}
.muted{color:var(--muted)}
.searchwrap{position:relative;margin-bottom:10px}
.searchwrap .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border);border-radius:10px;
  background:var(--card);font-size:15px;font-family:inherit;margin:0;color:var(--text)}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;
  box-shadow:0 1px 2px rgba(43,40,37,.04);transition:background .1s}
.pcard:active{background:var(--alt)}
.pinfo{flex:1;min-width:0}
.pchev{color:var(--border);flex:0 0 auto}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--border)}
.dot.v{background:var(--success)}
.pname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:12px;color:var(--muted)}
.pamt{margin-left:auto;font-weight:500;white-space:nowrap}
.back{border:none;background:none;color:var(--muted);font-size:14px;padding:0;font-family:inherit;

.h{font-size:18px;font-weight:600;margin:2px 0 2px}
.tabs{display:flex;gap:6px;margin:12px 0;overflow:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:1 0 auto;border:1px solid var(--border);background:var(--card);border-radius:10px;
  padding:9px 10px;font-size:13px;color:var(--text);font-family:inherit;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent);
  box-shadow:0 2px 8px rgba(43,40,37,.18)}
.panel{display:none} .panel.on{display:block;animation:fadein .12s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--alt);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)} .kv .v{text-align:right;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--success);font-weight:500}
.pill.n{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:13px;border:1px solid var(--border);border-radius:11px;background:var(--card);
  color:var(--text);font-size:15px;font-family:inherit;font-weight:500;cursor:pointer}
.btn.acc{background:var(--accent);color:var(--bg);border:none}
.btn.ghost{background:transparent}
.btn.line{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.providers{display:flex;gap:8px;margin-bottom:10px}

.mapwrap{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;

.map{height:220px;background:var(--alt)}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none}
.geobadge{position:absolute;top:10px;left:10px;z-index:4;display:flex;align-items:center;gap:5px;

label.fld{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
select,textarea{width:100%;padding:13px 12px;border:1px solid var(--border);border-radius:11px;

textarea{min-height:64px;resize:vertical}

.fsec{background:var(--card);border:1px solid var(--border);border-radius:14px;

.cdcard{font-size:13px;border-bottom:1px solid var(--alt);padding:8px 0}
.cdcard:last-child{border-bottom:none}

.cdhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}

.center{text-align:center;color:var(--muted);padding:40px 16px}
.opt{display:flex;gap:8px;margin:6px 0 2px}
.opt button{flex:1 1 0;border:1px solid var(--border);background:var(--card);border-radius:10px;

.opt button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.toolbtn{border:1px solid var(--border);background:var(--card);border-radius:20px;

.mk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--alt);font-size:13px}
.mk:last-child{border-bottom:none}
.mkdot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:0 0 auto}

/* --- нижняя навигация (как в нативном приложении) --- */
.bottomnav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:none;

.bottomnav-inner{display:flex;max-width:520px;margin:0 auto}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;font-family:inherit;color:var(--muted);font-size:11px;padding:5px 0;cursor:pointer}
.bottomnav button.on{color:var(--accent);font-weight:600}
.bottomnav button .ico{width:21px;height:21px}

/* --- полноэкранный режим навигации («Поехать») --- */
.navmode{position:absolute;inset:0;background:var(--bg);z-index:100;display:none}
.navmode.on{display:block}
.navmap{position:absolute;inset:0}
.navexit,.navrecenter{position:absolute;z-index:6;border:none;font-family:inherit;cursor:pointer;
  background:rgba(25,22,19,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#fff;border-radius:22px;box-shadow:0 4px 16px rgba(0,0,0,.28)}
.navexit{top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;display:flex;align-items:center;
  gap:6px;padding:9px 16px 9px 11px;font-size:13px;font-weight:500}
.navexit .ico{width:16px;height:16px}
.navrecenter{top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;padding:0}
.navrecenter .ico{width:19px;height:19px}
.navrecenter.hot{background:var(--navblue)}
.navsheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--card);
  border-radius:20px 20px 0 0;padding:10px 18px calc(16px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.navhandle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px}
.navtop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
.navdist{font-size:27px;font-weight:700;line-height:1.1;letter-spacing:-.3px}
.navsub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:54vw}
.naveta{font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;padding-bottom:3px}
.navbanner{display:flex;align-items:center;gap:8px;background:var(--alt);border-radius:10px;
  padding:9px 10px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.navbanner .ico{width:15px;height:15px;flex:0 0 auto;color:var(--danger)}
.navme{width:30px;height:30px;color:var(--navblue);filter:drop-shadow(0 1px 4px rgba(0,0,0,.45))}
.navme svg{width:100%;height:100%;display:block}
</style>

<script>
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
function lockAppViewport(){
  // Telegram отдаёт stableHeight отдельно от текущей высоты клавиатуры/свайпа. Фиксируем
  // оболочку по стабильному viewport: двигается только .wrap, а не всё приложение.
  const h = TG && Number(TG.viewportStableHeight) > 0
    ? Number(TG.viewportStableHeight) : window.innerHeight;
  if(h > 0) document.documentElement.style.setProperty("--app-height", Math.round(h)+"px");
}
if (TG) {
  TG.ready();
  TG.expand();
  // Telegram 7.7+: вертикальный жест больше не тянет весь WebApp вниз/к закрытию.
  try { if(typeof TG.disableVerticalSwipes === "function") TG.disableVerticalSwipes(); } catch(e) {}
  lockAppViewport();
  try { TG.onEvent("viewportChanged", e=>{ if(!e || e.isStateStable) lockAppViewport(); }); } catch(e) {}
} else {
  lockAppViewport();
  // В standalone PWA пересчитываем рамку только при реальном повороте, не при клавиатуре.
  window.addEventListener("orientationchange", ()=>setTimeout(lockAppViewport, 120));
}

  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.4a1 1 0 0 1 1-1h2.1L8.3 5.6a1 1 0 0 1 .85-.5h5.7c.34 0 .66.18.85.5l1.2 1.8H19a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><circle cx="12" cy="13" r="3.2"/></svg>',

  close:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>',
  chevL:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg>',
  chevR:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>',
  plus:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
};
function ic(name){ return `<span class="ico">${ICONS[name]||""}</span>`; }

// --- Локализация интерфейса (ru/uz/tg). Варианты ответов приходят с сервера.

function setMeta(meta){
  const next=meta||{};
  // Пустые справочники НЕ затирают живые. Снимок бутстрапа лежит в IndexedDB, и
  // после выгрузки приложения он может прийти раньше свежего ответа сервера. Если
  // в нём dropdowns пуст, каждое поле формы превращается в <select> с единственным
  // «—»: выглядит рабочим, выбрать нечего, автосохранение честно шлёт пустоту.
  // 04.08.2026 выездник так простоял полтора часа на одной карточке.
  const had=STATE.meta&&STATE.meta.dropdowns&&Object.keys(STATE.meta.dropdowns).length;
  const got=next.dropdowns&&Object.keys(next.dropdowns).length;
  if(had&&!got) next.dropdowns=STATE.meta.dropdowns;
  STATE.meta=next;
  const v=Number(STATE.meta.formProtocolVersion);
  FORM_VERSION=Number.isInteger(v)&&v>0?v:0;
}

// --- Оффлайн-хранилище (IndexedDB) -----------------------------------------
// Снимок портфеля (kv:bootstrap) + полные карточки (cards) + исходящая очередь
// операций (queue). Даёт заполнение визита в поле без сети с досылом при связи.
// Всё обёрнуто в try/catch: если IndexedDB недоступен (приватный режим/запрет) —
// онлайн-путь не страдает, просто нет оффлайна.
const IDB = (()=>{
  let _db=null;
  function open(){
    if(_db) return Promise.resolve(_db);
    return new Promise((resolve,reject)=>{
      let req; try{ req=indexedDB.open("hardbot",1); }catch(e){ return reject(e); }
      req.onupgradeneeded=()=>{ const d=req.result;
        if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
        if(!d.objectStoreNames.contains("cards")) d.createObjectStore("cards");
        if(!d.objectStoreNames.contains("queue")) d.createObjectStore("queue",{keyPath:"op_id"});
      };
      req.onsuccess=()=>{ _db=req.result; resolve(_db); };
      req.onerror=()=>reject(req.error);
    });
  }
  const store=(name,mode)=>open().then(d=>d.transaction(name,mode).objectStore(name));
  const p=(req)=>new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
  // Для очереди одного request.onsuccess недостаточно: транзакция IndexedDB ещё
  // может abort-нуться (quota/закрытие iOS PWA). Запись считается надёжной только
  // после transaction.oncomplete.
  const write=(name,action)=>open().then(d=>new Promise((res,rej)=>{
    let tx;
    try{
      tx=d.transaction(name,"readwrite");
      action(tx.objectStore(name));
    }catch(e){ rej(e); return; }
    tx.oncomplete=()=>res();
    tx.onabort=()=>rej(tx.error||new Error("idb abort"));
    tx.onerror=()=>rej(tx.error||new Error("idb error"));
  }));
  return {
    get:(s,k)=>store(s,"readonly").then(o=>p(o.get(k))),
    put:(s,v,k)=>write(s,o=>{ if(k===undefined) o.put(v); else o.put(v,k); }),
    del:(s,k)=>write(s,o=>o.delete(k)),
    all:(s)=>store(s,"readonly").then(o=>p(o.getAll())),
    count:(s)=>store(s,"readonly").then(o=>p(o.count())),
    clear:(s)=>write(s,o=>o.clear()),
  };
})();

// Стереть локальные данные прежнего пользователя (смена сотрудника на устройстве):
// карточки и исходящую очередь. Снимок (kv) тут же перезапишется свежим bootstrap.
// Смена сотрудника на устройстве: чужие ПД чистим, а РАБОТУ ЧЕЛОВЕКА — нет.
// Раньше отсюда безусловно стиралась вся очередь, включая неотправленные визиты
// и фото; при переключении портфеля руководителем это была прямая потеря работы.
// Плюс не трогался localStorage, и черновик формы с очередью трека прошлого
// выездника продолжали жить под новым именем.
async function clearLocalData(opts){
  const keepQueue = !!(opts && opts.keepQueue);
  const stores = keepQueue ? ["cards"] : ["cards","queue"];
  for(const s of stores){ try{ await IDB.clear(s); }catch(e){} }
  try{
    localStorage.removeItem(TRACK_KEY);
    localStorage.removeItem(WARM_KEY);
    Object.keys(localStorage)
      .filter(k => k.indexOf("draft:") === 0)
      .forEach(k => localStorage.removeItem(k));
  }catch(e){}
}

  try{ return ((await IDB.all("queue"))||[]).length; }catch(e){ return 0; }
}

// uuid для идемпотентного op_id операций очереди (crypto, с запасным вариантом).
function uuid(){
  try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return "op-"+Date.now()+"-"+Math.random().toString(16).slice(2);
}

// Прогрев кэша всех карточек одним запросом (только онлайн, в фоне, не блокирует UI).
// Полные карточки портфеля в оффлайн-кэш. `manual` — запуск кнопкой: тогда процесс
// показываем, при фоновом прогреве после входа — только итог. Раскладка идёт
// порциями с паузой: на слабом телефоне синхронный цикл по сотням карточек
// подвешивал интерфейс ровно в тот момент, когда человек собирается уезжать.
// Просим браузер НЕ вычищать наше хранилище. И iOS, и Android вправе выбросить
// IndexedDB под давлением памяти — а выездник обнаружит это в поле, где сети нет.
// Просить надо один раз и до прогрева кэша; отказ не страшен, просто работаем как есть.
async function askPersistentStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){
      if(await navigator.storage.persisted()) return true;
      return await navigator.storage.persist();
    }
  }catch(e){}
  return false;
}

  try{ j=await api("/api/cards"); }
  catch(e){
    if(manual) warmBar(`<div class="pcard" style="display:block;margin-bottom:10px">
        <div class="muted">⚠️ ${esc(t.warmfail)}</div>
        <button class="btn line" style="margin-top:8px" onclick="warmCards(true)">⬇ ${esc(t.warmagain)}</button>
      </div>`);
    return;
  }
  const reps = (j && j.cards) ? Object.keys(j.cards) : [];
  let done = 0;
  for(const rep of reps){
    try{ await IDB.put("cards", j.cards[rep], rep); done++; }catch(e){}
    if(manual && (done % 10 === 0 || done === reps.length)){
      const el = $("warmtxt");
      if(el) el.textContent = `${t.warmgoing}: ${done}/${reps.length}`;
      await new Promise(r => setTimeout(r, 0));   // отдаём кадр — интерфейс не замирает
    }
  }
  STATE.warmCount = done;
  try{ localStorage.setItem(WARM_KEY, String(Date.now())); }catch(e){}
  warmBar(warmStatusHTML());
}
// Сколько карточек РЕАЛЬНО лежит в оффлайн-кэше. Счётчик прогрева жил только в памяти

                                  String(it.failed||"").indexOf("server-")===0);

// --- Исходящая очередь операций (визит/фото/метка) --------------------------
// Оффлайн операции копятся в IndexedDB (store queue, ключ op_id) и досылаются при
// связи. op_id делает досыл идемпотентным на сервере (см. web.py): повтор не плодит
// дубли визитов/меток/фото и не шлёт повторный пост в группу.
function jsonHeaders(){ const h=authHeaders(); h["Content-Type"]="application/json"; return h; }
async function enqueue(entry){
  try{ await IDB.put("queue", entry); return true; }catch(e){ return false; }
}

const PHOTO_MAX_BYTES=25*1024*1024;
// Пока новый File уже durable в IDB, но ещё ждёт geo, flush не должен отправить
// его с geo:null. После перезапуска Set пуст — аварийная запись всё равно уйдёт.
const PHOTO_PREPARING=new Set();
function photoExt(name,mime){
  const m=String(name||"").match(/\.(?:jpe?g|jpe|jfif|png|gif|webp|heic|heif|avif)$/i);
  if(m) return m[0];
  return ({"image/jpeg":".jpg","image/png":".png","image/gif":".gif",
    "image/webp":".webp","image/heic":".heic","image/heif":".heif",
    "image/avif":".avif"})[String(mime||"").toLowerCase()]||".jpg";
}
// Снимок с телефона — это 3-8 МБ. По мобильной сети Таджикистана он уходит
// 1-2 минуты, и сеть успевает разорвать соединение: 04.08.2026 в логах
// «POST /api/photo 200 120.209» рядом с «ConnectionResetError: Connection lost»
// и 500. Выездник видел, что фото «не сохраняется».
//
// Ужимаем ДО отправки: 1600 px по длинной стороне, JPEG 0.72 — это 200-400 КБ,
// в 10-20 раз меньше. Фото здесь доказательство визита, а не полиграфия.
//
// Координата съёмки НЕ страдает: она едет отдельным заголовком X-Photo-Geo
// (см. photoHeaders и web.py:1078), а не в EXIF, который пережатие стирает.
//
// Любой сбой — отдаём оригинал. Старый webview без createImageBitmap/toBlob
// должен продолжать работать, пусть и медленно: лучше долго, чем никак.
const PHOTO_MAX_SIDE=1600, PHOTO_JPEG_Q=0.72;
async function shrinkPhoto(file){
  try{
    if(!(file instanceof Blob)) return null;
    if(!/^image\/(jpeg|png|heic|heif|webp)/i.test(file.type||"")) return null;
    if(typeof createImageBitmap!=="function") return null;
    const bmp=await createImageBitmap(file);
    const side=Math.max(bmp.width,bmp.height);
    if(!side) return null;
    const k=Math.min(1,PHOTO_MAX_SIDE/side);
    const w=Math.max(1,Math.round(bmp.width*k)), h=Math.max(1,Math.round(bmp.height*k));
    const cv=(typeof OffscreenCanvas==="function")?new OffscreenCanvas(w,h)
             :Object.assign(document.createElement("canvas"),{width:w,height:h});
    const ctx=cv.getContext("2d"); if(!ctx) return null;
    ctx.drawImage(bmp,0,0,w,h);
    try{ bmp.close&&bmp.close(); }catch(e){}
    const blob=cv.convertToBlob?await cv.convertToBlob({type:"image/jpeg",quality:PHOTO_JPEG_Q})
      :await new Promise(res=>cv.toBlob(res,"image/jpeg",PHOTO_JPEG_Q));
    if(!blob||!blob.size) return null;
    // Если «сжатие» вышло больше оригинала (крошечный снимок) — оригинал честнее.
    if(file.size&&blob.size>=file.size) return null;
    return blob;
  }catch(e){ return null; }
}
async function photoBytes(value){
  let bytes=null;
  if(value instanceof ArrayBuffer) bytes=value;
  else if(ArrayBuffer.isView(value))
    bytes=value.buffer.slice(value.byteOffset,value.byteOffset+value.byteLength);
  else if(value instanceof Blob)
    bytes=value.arrayBuffer?await value.arrayBuffer():await new Response(value).arrayBuffer();
  if(!bytes||!bytes.byteLength||bytes.byteLength>PHOTO_MAX_BYTES) throw new Error("photo bytes");
  return bytes;
}
async function queuedPhotoBytes(it){
  if(it.bytes) return photoBytes(it.bytes);
  // Миграция v12: в IndexedDB лежит File/Blob. На iOS такой File после сна PWA
  // терял native path и FormData отправлял заголовок boundary без multipart-body.
  // Материализуем байты и сразу переписываем запись; op_id и ext не меняются.
  const bytes=await photoBytes(it.blob);
  const migrated=Object.assign({},it,{bytes,mime:it.mime||(it.blob&&it.blob.type)||"image/jpeg",
    ext:it.ext||photoExt(it.blob&&it.blob.name,it.blob&&it.blob.type),migrated_raw:1});
  delete migrated.blob;
  try{ await IDB.put("queue",migrated); }catch(e){}  // текущий retry всё равно имеет bytes в памяти
  Object.assign(it,migrated); delete it.blob;
  return bytes;
}
async function markPhotoFailed(it,status){
  it.failed=status||"retake";
  it.failed_at=Date.now();
  try{ await IDB.put("queue",it); }catch(e){}
}
async function firstFailedPhoto(rep,exceptOp){
  try{
    const items=(await IDB.all("queue"))||[];
    return items.filter(it=>it&&it.kind==="photo"&&it.failed&&it.rep===rep&&it.op_id!==exceptOp)
      .sort((a,b)=>(a.failed_at||a.at||0)-(b.failed_at||b.at||0))[0]||null;
  }catch(e){ return null; }
}
async function retireReplacedPhoto(it){
  // Только явная связь, записанная при нажатии «Переснять». Удалять «любой
  // failed того же КД» нельзя: это может скрыть другую реально потерянную съёмку.
  const old=it.replaces_op_id;
  if(old&&old!==it.op_id){
    try{ await IDB.del("queue",old); }catch(e){}
  }
}
function showPhotoCount(rep,photos){
  if(!Number.isFinite(Number(photos))) return;
  if(STATE.cur&&STATE.cur.rep===rep){
    STATE.cur.photos=Number(photos);
    const el=$("phc"); if(el) el.textContent=L().photos+": "+STATE.cur.photos;
  }

let _flushing=false;
async function flushQueue(){
  if(_flushing) return;
  _flushing=true;
  try{
    let items=[]; try{ items=(await IDB.all("queue"))||[]; }catch(e){ items=[]; }
    items.sort((a,b)=>(a.at||0)-(b.at||0));   // порядок как случилось в поле
    for(const it of items){
      if(it.kind==="photo"&&PHOTO_PREPARING.has(it.op_id)) continue;
      // Нечитаемое/отклонённое фото остаётся видимым для пересъёмки, но не держит
      // за собой более поздние визиты, метки и фото.
      if(it.kind==="photo"&&it.failed) continue;
      // Очередь старой оболочки не содержит списка явно затронутых полей.
      // Сервер её не сертифицирует; сохраняем запись для ручного разбора.
      if(it.kind==="save"&&it.failed==="refresh-form") continue;
      // Визит, отклонённый сервером (404/400): держим видимым для ручного разбора,
      // но не даём ему тормозить последующие операции.
      if(it.kind==="save"&&String(it.failed||"").indexOf("server-")===0) continue;
      let ok=false, stop=false;
      try{
        let r;
        if(it.kind==="save"){
          const sbody={rep:it.rep,values:it.values,finish:true,op_id:it.op_id,
            form_version:it.form_version,input_keys:it.input_keys};
          if(it.geo) sbody.geo=it.geo;
          r=await fetch("/api/save",{method:"POST",headers:jsonHeaders(),
            body:JSON.stringify(sbody)});
        }else if(it.kind==="marker"){
          const body={lat:it.lat,lon:it.lon,op_id:it.op_id};
          if(it.rep) body.rep=it.rep; if(it.label) body.label=it.label;
          r=await fetch("/api/marker",{method:"POST",headers:jsonHeaders(),body:JSON.stringify(body)});
        }else if(it.kind==="note_delete"){
          r=await fetch("/api/note_delete",{method:"POST",headers:jsonHeaders(),
            body:JSON.stringify({id:it.id})});
        }else if(it.kind==="note"){
          const body={text:it.text,op_id:it.op_id};
          if(it.rep) body.rep=it.rep;
          r=await fetch("/api/note",{method:"POST",headers:jsonHeaders(),body:JSON.stringify(body)});
        }else if(it.kind==="photo"){
          let bytes;
          try{ bytes=await queuedPhotoBytes(it); }
          catch(e){ await markPhotoFailed(it,"retake"); STATE.online=true; continue; }
          r=await fetch("/api/photo?rep="+enc(it.rep)+"&op="+it.op_id,
            {method:"POST",headers:photoHeaders(it.geo,it.ext),body:bytes});
        }else{ ok=true; }   // неизвестный тип — не держим вечно
        if(r){
          if(r.ok){
            ok=true;
            if(it.kind==="photo"){
              try{ const j=await r.json(); showPhotoCount(it.rep,j.photos); }catch(e){}
              // Успешная пересъёмка закрывает ровно одну старую failed-запись
              // этого КД; текущий op удалится общим путём ниже.
              await retireReplacedPhoto(it);
            }
          }
          else if(r.status===401||r.status===403||r.status>=500) stop=true;  // авторизация/сервер — позже
          else if(it.kind==="save"&&r.status===409){
            it.failed="refresh-form"; it.failed_at=Date.now();
            try{ await IDB.put("queue",it); }catch(e){}
            STATE.online=true; continue;
          }
          else if(it.kind==="photo"){
            // Raw 4xx (в т.ч. 413/422) повтором не вылечится: запись сохраняем
            // как требующую пересъёмки и продолжаем последующие операции.
            await markPhotoFailed(it,String(r.status));
            await retireReplacedPhoto(it);
            STATE.online=true; continue;
          }
          else if(it.kind==="save"){
            // ВИЗИТ НЕ УДАЛЯЕМ. Раньше любой 4xx кроме 409 попадал в общий
            // `else ok=true`, и заполненная в поле форма исчезала БЕЗ СЛЕДА:
            // ни тоста, ни записи. А 404 здесь — штатная ситуация (кейс отдали
            // другому выезднику, договор ушёл из портфеля), то есть терялась
            // именно та работа, которую человек уже сделал.
            it.failed="server-"+r.status; it.failed_at=Date.now();
            try{ await IDB.put("queue",it); }catch(e){}
            STATE.online=true; continue;
          }else ok=true;   // прочая невалидная операция не держит очередь вечно
        }
      }catch(e){ stop=true; }   // сеть недоступна — прекращаем, повтор при следующей связи
      if(ok){ try{ await IDB.del("queue", it.op_id); }catch(e){} }
      if(stop){ STATE.online=false; break; }
      STATE.online=true;
    }
  }finally{ _flushing=false; updateOffBar(); }
}

// Автономное приложение (PWA вне Телеги): вход по ссылке бота. В #link= лежит код
// (фрагмент не попадает в логи сервера — как initData у Телеги); код многоразовый в
// окне активации: одну ссылку открывают в браузере Телеги, потом в Safari/Chrome при
// установке — каждый обмен даёт девайс-токен (скользящие 30 дней, localStorage).
// Установленный ярлык живёт на персональном start_url «/#t=<токен>» (см. ниже).
function appToken(){ try{ return localStorage.getItem('app_token')||''; }catch(e){ return ''; } }
function cleanLinkFromUrl(){ try{ const u=new URL(location.href);
  u.searchParams.delete('link'); u.searchParams.delete('token');
  history.replaceState(null,'',u.pathname+(u.search||'')); }catch(e){} }
// true — токен получен; 'have-token' — код невалиден/сервер недоступен, но на устройстве
// уже есть токен (тихо продолжаем); 'net' — код НЕ обменян и токена нет (оставляем код в
// URL, попробуем при следующем открытии); false — код ДЕЙСТВИТЕЛЬНО мёртв (410) и токена нет.
async function redeemCode(code, fromUrl){
  try{
    const r=await fetch('/api/redeem',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code})});
    if(r.ok){ const j=await r.json();
      if(j&&j.token){ try{ localStorage.setItem('app_token',j.token); }catch(e){} }
      stampTokenUrl();                         // #link=код → #t=токен: ярлык унесёт вход
      return true; }
    if(r.status===410){                        // код мёртв (использован/просрочен/чужой) — жжём
      if(appToken()) stampTokenUrl(); else if(fromUrl) cleanLinkFromUrl();
      return appToken()?'have-token':false; }
    return appToken()?'have-token':'net';       // 5xx/прочее: сервер/прокси недоступен — код НЕ жжём
  }catch(e){ return 'net'; }                     // сети нет — код остаётся, повтор при связи
}
// Преемственность входа для установленного ярлыка: манифест после входа становится
// персональным (start_url «/#t=<токен>»), и iOS-ярлык — у которого хранилище ОТДЕЛЬНОЕ
// от Safari — рождается уже авторизованным: токен приезжает в URL при каждом запуске.
let URLT=null, TRIED_URLT=false;   // кандидат из URL: живой localStorage-токен сразу
                                   // не затираем, но подменяем, если сервер дал 401
function absorbTokenFromUrl(){
  // URL не чистим: #t в адресе — это и есть «преемственность» (см. stampTokenUrl).
  try{ const u=new URL(location.href);
    const tk=u.hash?new URLSearchParams(u.hash.replace(/^#/,'')).get('t'):null;
    if(!tk) return;
    URLT=tk;
    if(!appToken()){ try{ localStorage.setItem('app_token',tk); }catch(e){} }
  }catch(e){}
}
function personalizeManifest(){
  // Вызываем после УСПЕШНОЙ авторизации токеном: установка «На экран Домой» /
  // «Установить приложение» с этой страницы унесёт вход с собой. Внутри Телеги
  // не трогаем (там initData, а ярлык оттуда не ставят).
  const tk=appToken(); if(!tk || (TG&&TG.initData)) return;
  const l=document.querySelector('link[rel="manifest"]');
  if(l) l.href='/manifest.webmanifest?t='+encodeURIComponent(tk);
}
function stampTokenUrl(){
  // Живой токен держим ПРЯМО в адресе страницы (#t=…, фрагмент на сервер не уходит):
  // iOS при «На экран Домой» берёт то ли текущий URL, то ли start_url манифеста —
  // после этой строчки ОБА варианта несут вход с собой, ярлык рождается «с уже
  // подставленным кодом». Плата: токен виден в адресной строке/истории браузера —
  // осознанный выбор владельца в пользу простоты для выездников.
  const tk=appToken(); if(!tk || (TG&&TG.initData)) return;
  try{ const u=new URL(location.href);
    u.searchParams.delete('link'); u.searchParams.delete('token');
    history.replaceState(null,'',u.pathname+(u.search||'')+'#t='+encodeURIComponent(tk));
  }catch(e){}
}
async function redeemFromUrl(){
  absorbTokenFromUrl();
  let code=null;
  try{ const u=new URL(location.href);
    if(u.hash) code=new URLSearchParams(u.hash.replace(/^#/,'')).get('link');
    if(!code) code=u.searchParams.get('link');
  }catch(e){}
  if(code) await redeemCode(code, true);
}
// Новая ссылка открылась в УЖЕ живой вкладке приложения: переход «/» → «/#link=…»
// меняет только фрагмент, страница НЕ перезагружается и boot() сам не стартует.
// Ловим hashchange: обмениваем код и перезапускаем загрузку.
window.addEventListener('hashchange', async()=>{
  let c=null;
  try{ c=new URLSearchParams(location.hash.replace(/^#/,'')).get('link'); }catch(e){}
  if(c && (await redeemCode(c, true))===true) boot();
});
// Экран «нужна ссылка от бота»: истёкший токен или мёртвый код без токена. Самолечение —
// слово «ссылка» боту приносит новую ссылку; кнопка ручного ввода кода закрывает случай,
// когда открыть ссылку в этом же браузере неудобно (iOS вне Chrome и т.п.).
function renderAppAuthGone(expired){
  hideBottomNav(); const t=L();
  // Поле ввода прямо на экране, а не prompt(): на iOS-ярлыке prompt не переживает
  // переключение в Телегу за кодом, да и вставка в него неудобна. font-size 16px —
  // чтобы iOS не зумил страницу при фокусе.
  $("app").innerHTML=`<div class="center">${esc(expired?t.authexpired:t.authneed)}<br><br>
    <input id="codein" placeholder="${esc(t.codeph)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
      style="display:block;width:100%;max-width:280px;margin:0 auto 10px;padding:13px 12px;border:1px solid var(--border);border-radius:11px;font-size:16px"
      onkeydown="if(event.key==='Enter')enterCode()">
    <button class="btn acc" style="max-width:280px;margin:0 auto" onclick="enterCode()">${esc(t.entercode)}</button></div>`;
}
async function enterCode(){
  // Код берём из поля; пустое поле → пробуем буфер обмена (iOS сам спросит
  // разрешение «Вставить») — но только если там похожее на код, чтобы не жечь
  // попытку о случайный мусор. Принимаем и целую вставку сообщения бота, и
  // ссылку, и голый код: вытаскиваем link=CODE где угодно в тексте.
  const el=document.getElementById("codein");
  let raw=el?el.value.trim():'';
  if(!raw && el && navigator.clipboard && navigator.clipboard.readText){
    try{ const cb=(await navigator.clipboard.readText()).trim();
      if(/link=[A-Za-z0-9_-]+/.test(cb)||/^[A-Za-z0-9_-]{16,}$/.test(cb)){ raw=cb; el.value=cb; } }catch(e){}
  }
  if(!raw && !el) raw=(prompt(L().codeprompt)||'').trim();
  if(!raw){ if(el) el.focus(); return; }
  const m=raw.match(/link=([A-Za-z0-9_-]+)/);
  const r=await redeemCode(m?m[1]:raw, false);
  if(r===true){ toast('✓'); boot(); } else toast('✕');
}

function authHeaders(){
  const h = {};
  if (TG && TG.initData) h["X-Init-Data"] = TG.initData;    // внутри Телеги — подпись WebApp
  else { const t = appToken(); if(t) h["X-App-Token"]=t; }  // автономное PWA — токен от бота
  const dev = new URLSearchParams(location.search).get("dev_uid");
  if (dev) h["X-Dev-Uid"] = dev;
  return h;
}
async function api(path, opts){
  opts = opts || {};
  const h = authHeaders(); h["Content-Type"] = "application/json";
  const r = await fetch(path, Object.assign({}, opts, {headers:h}));
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show");
  setTimeout(()=>e.classList.remove("show"),1600); }

let REDEEMED=false;
// Экран «заявка отправлена». Выход из него один — подтверждение владельца, но
// человек должен видеть, что происходит, и уметь выбрать себя заново, если ткнул
// не то ФИО.
function renderPending(employee){
  hideBottomNav();
  const t=L();
  $("app").innerHTML=`<div class="center" style="padding:24px">
      <div style="font-size:40px;margin-bottom:12px">⏳</div>

// Ткнул не то ФИО — даём выбрать заново. Сервер перезапишет НЕодобренную заявку;
// одобренную привязку так не сменить, это только через пульт.
async function restartOnboarding(){
  try{
    const d=await api("/api/bootstrap");
    STATE.onb={...d, employees:(d.employees||[])};
    if(!STATE.onb.employees.length){
      const e=await api("/api/bootstrap"); STATE.onb={...e};
    }
  }catch(err){}
  if(!STATE.onb || !(STATE.onb.employees||[]).length){ toast(L().freenavfail); return; }
  renderOnboarding();
}

async function boot(){
  renderLangs(); hideBottomNav();
  geoProbe();                 // узнаём, дали ли права раньше (не спрашивает, только смотрит)
  tgGeoInit();                // внутри Телеграма — её собственный LocationManager
  if(!REDEEMED){ REDEEMED=true; await redeemFromUrl(); }   // одноразовый код из ссылки бота
  try{
    const d = await api("/api/bootstrap");
    personalizeManifest();   // авторизация удалась → ярлык с этой страницы унесёт вход
    stampTokenUrl();         // …и в самом адресе страницы тоже (iOS берёт любой из двух)
    STATE.lang=d.lang||STATE.lang; renderLangs();
    if(d.needsOnboarding){ STATE.onb=d; renderOnboarding(); return; }
    // Заявка ждёт подтверждения владельца (второе устройство на то же ФИО).
    // Ветки не было вовсе: сервер отдавал pending, фронт валился в «Нет доступа»,
    // и человек не понимал, ждать ему или он сломал приложение.
    if(d.pending){ renderPending(d.employee); return; }
    // Сменился сотрудник на устройстве (перевыпуск на другого человека) — чистим кэш и
    // очередь прошлого, чтобы не смешивать ПД и не долить чужие визиты под новым токеном.
    const prev = await loadBootstrapSnapshot();
    if(prev && prev.employee && d.employee && prev.employee !== d.employee) await clearLocalData();
    setBottomNav("clients");   // три вкладки видны с первого экрана
    setMeta(d.meta); STATE.persons=d.persons; STATE.kind=d.kind||"agent";
    STATE.roles=d.roles||null;   // роль руководителя: список его сотрудников + текущий
    STATE.online=true;
    cacheBootstrap(d);            // снимок портфеля для оффлайна (в фоне, не блокирует UI)
    renderList();
    warmCards();                  // полные карточки всех клиентов в фон-кэш (онлайн)
    flushQueue();                 // досыл накопленного оффлайна (визиты/фото/метки)
  }catch(e){
    const st=+((e&&e.message)||0);
    // Сервер ответил «не пускаю» вне Телеги: токен истёк/отозван либо его ещё нет.
    // Кэш здесь НЕ поднимаем (сервер доступен и отказал) — просим новую ссылку у бота.
    if((st===401||st===403) && !(TG&&TG.initData)){
      // В localStorage мог остаться мёртвый токен, а в start_url ярлыка — живой
      // (переустановили ярлык после простоя): пробуем кандидата из URL один раз.
      if(URLT && URLT!==appToken() && !TRIED_URLT){ TRIED_URLT=true;
        try{ localStorage.setItem('app_token',URLT); }catch(e){}
        return boot(); }
      renderAppAuthGone(!!appToken()); return; }
    // Сети нет — поднимаемся из оффлайн-снимка портфеля, если он есть.
    const snap = await loadBootstrapSnapshot();
    if(snap && snap.persons){
      STATE.lang=snap.lang||STATE.lang; renderLangs();
      setMeta(snap.meta); STATE.persons=snap.persons; STATE.kind=snap.kind||"agent";
      STATE.online=false;
      renderList();
    }else{
      $("app").innerHTML = `<div class="center">Нет доступа.<br><span class="muted">Откройте через бота при интернете хотя бы раз.</span></div>`;
    }
  }
}

// Черновик маршрута дня: сервер берёт топ по скорингу и сворачивает цепочкой
// «ближайший следующий» от живой точки (если дали гео). Тап по строке — карточка.
async function routeDay(){
  const t=L();
  // Нажатие — законный момент спросить права: маршрут от текущей точки без неё
  // строится «от первого кейса», и человек не понимает, почему порядок странный.
  const geo = (GEO.state==="granted") ? await grabGeo(3000) : await askGeo();
  let url="/api/route_day"; if(geo) url+="?lat="+geo.lat+"&lon="+geo.lon;
  let j=null;
  try{ j=await api(url); }catch(e){ toast("✕"); return; }
  const items=(j&&j.order)||[];
  if(!items.length){ toast(t.rdempty); return; }
  $("plist").innerHTML =
    `<div class="muted" style="margin:4px 0 10px">🧭 ${esc(t.routeday)}: ${items.length}`+
    (j.km?` · ≈ ${j.km} км`:"")+`</div>`+
    items.map((p,i)=>`<div class="pcard" onclick="openP('${p.rep}')">
       <span style="flex:0 0 24px;height:24px;border-radius:50%;background:#2F80ED;color:#fff;
         display:flex;align-items:center;justify-content:center;font:600 12px/1 sans-serif">${i+1}</span>
       <div class="pinfo"><div class="pname">${esc(p.client)}</div>
         <div class="psub">${p.km!=null?("→ "+p.km+" км · "):""}${totalStr(p)}</div></div>
       <span class="pchev">${ic("chevR")}</span>
     </div>`).join("");
}
function drawList(items){
  const t=L();
  $("plist").innerHTML = items.map(p=>{
    const dotStyle = (!p.visited && p.score!=null) ? ` style="background:${priColor(p.score)}"` : "";
    return `<div class="pcard" onclick="openP('${p.rep}')">
       <span class="dot ${p.visited?'v':'n'}"${dotStyle}></span>
       <div class="pinfo"><div class="pname">${esc(p.client)}</div>
         <div class="psub">${p.n>1?(p.n+" "+t.kd+" · "):""}${totalStr(p)}</div></div>
       <span class="pchev">${ic("chevR")}</span>
     </div>`;
  }).join("");
}
function filterList(){
  const q=$("q").value.toLowerCase();
  drawList(STATE.persons.filter(p=>p.client.toLowerCase().includes(q)));
}

async function openP(rep){
  let d=null;
  try{ d=await api("/api/person?rep="+enc(rep));
    if(d){ STATE.online=true; IDB.put("cards",d,rep).catch(()=>{}); } }   // освежить кэш карточки
  catch(e){ d=await loadCard(rep); if(d) STATE.online=false; }            // нет сети → из кэша
  if(!d){ toast(STATE.online===false?"нет данных оффлайн":"✕"); return; }
  // Старые IndexedDB-карточки могли содержать form-prefill из master. До
  // доказанного snapshot он не является пользовательским вводом и очищается;
  // отдельный localStorage-черновик восстановится поверх пустой формы ниже.
  if(!d.visited){
    (d.form||[]).forEach(f=>{ f.current=""; });
    d.visit_comment=""; d.call_comment=""; d.tips="";
    IDB.put("cards",d,rep).catch(()=>{});
  }
  STATE.cur=d; STATE.tab="visit";
  FORM_TOUCHED.clear();
  // ПОВТОРНОЕ открытие уже закрытого визита: считаем тронутым всё, что человек
  // видит заполненным. Иначе второе сохранение («утром Нет контакта, вечером
  // Оплачен», «поправил опечатку») отправляет только заново набранное поле, а
  // снимок визита перезаписывается им целиком — и контакт, кто на адресе,
  // местонахождение, цель, договорённость и комментарий обнуляются молча.
  // Провенанс не страдает: у завершённого визита форма префиллится ИСКЛЮЧИТЕЛЬНО
  // из доказанного снимка (мастер её не префиллит, см. очистку выше), поэтому
  // отправляем ровно то, что уже было подтверждено нами же.
  if(d.visited){
    (d.form||[]).forEach(f=>{ if(f.current) FORM_TOUCHED.add(f.key); });
    if(d.visit_comment) FORM_TOUCHED.add("visit_comment");
    if(d.tips) FORM_TOUCHED.add("tips");
  }
  draftDirty=false; clearTimeout(draftTimer);   // новый клиент — сбросить состояние сессии черновика
  renderDetail();
}

// --- Карта (MapLibre GL). Базовый слой — растровый OSM; пин — наш.
// Самохостинг вектора (Protomaps PMTiles) подключается заменой RASTER_STYLE.
// Ленивая загрузка карт-библиотек: в оболочке их нет (чтобы оффлайн-старт не зависел от
// внешних CDN). Грузим при первом открытии карты; при отсутствии сети просто вернём false
// и карта не отрисуется (для заполнения визита это не нужно).
let _mapLibs=null;
function ensureMapLibs(){
  if(window.maplibregl && window.pmtiles && window.protomaps_themes_base) return Promise.resolve(true);
  if(_mapLibs) return _mapLibs;
  const CDN="https://cdn.jsdelivr.net/npm/";
  const addCss=(href)=>{ const l=document.createElement("link"); l.rel="stylesheet"; l.href=href; document.head.appendChild(l); };
  const addJs=(src)=>new Promise((res)=>{ const s=document.createElement("script"); s.src=src; s.onload=()=>res(true); s.onerror=()=>res(false); document.head.appendChild(s); });
  _mapLibs=(async()=>{
    addCss(CDN+"maplibre-gl@4.7.1/dist/maplibre-gl.min.css");
    if(!await addJs(CDN+"maplibre-gl@4.7.1/dist/maplibre-gl.min.js")){ _mapLibs=null; return false; }
    await addJs(CDN+"pmtiles@3.2.1/dist/pmtiles.js");
    await addJs(CDN+"protomaps-themes-base@4.4.0/dist/protomaps-themes-base.js");
    return !!window.maplibregl;
  })();
  return _mapLibs;
}
let MAP=null, PROTO_REG=false;
const RASTER_STYLE={version:8,sources:{osm:{type:"raster",
  tiles:["https://a.tile.openstreetmap.org/{z}/{x}/{y}.png","https://b.tile.openstreetmap.org/{z}/{x}/{y}.png"],
  tileSize:256,maxzoom:19,attribution:"© OpenStreetMap"}},
  layers:[{id:"osm",type:"raster",source:"osm"}]};
function removeMap(){ if(MAP){ try{MAP.remove();}catch(e){} MAP=null; } }
// Наш вектор-тайлсет (Protomaps PMTiles), если подложен на сервере; иначе растр.
function vectorStyle(url){
  if(!PROTO_REG){ maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile); PROTO_REG=true; }
  const ptb=window.protomaps_themes_base;
  const layers = ptb.layers ? ptb.layers("protomaps","light","ru") : ptb.default("protomaps","light");
  return {version:8,
    glyphs:"https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
    sprite:"https://protomaps.github.io/basemaps-assets/sprites/v4/light",
    sources:{protomaps:{type:"vector",url:"pmtiles://"+location.origin+url,attribution:"© OpenStreetMap"}},
    layers};
}
function geoHint(d,t){
  const g=d.geo&&d.geo.lat; if(!g) return t.none;
  return d.geo.src==="geonames"?t.approx:(d.geo.src==="manual"?t.manualpt:t.exact);
}
async function initMap(){
  const el=$("map"); if(!el) return;
  if(!(await ensureMapLibs())) return;   // нет сети/CDN — карту не рисуем (для визита не нужна)
  const d=STATE.cur; if(!d) return;
  const g=d.geo&&d.geo.lat;
  const lat=g?d.geo.lat:41.311, lon=g?d.geo.lon:69.240;
  removeMap();
  let style=RASTER_STYLE;
  const vt=STATE.meta&&STATE.meta.vectorTiles;
  if(vt&&window.pmtiles&&window.protomaps_themes_base){ try{ style=vectorStyle(vt); }catch(e){} }

// --- Карта всех моих клиентов: цвет точки = приоритет выезда, тап → карточка ---
function priColor(s){
  if(s==null) return "#9b9b9b";
  if(s>=92) return "#B0472C";   // ехать первым
  if(s>=82) return "#C9852A";   // высокий
  if(s>=70) return "#6E8F3F";   // средний
  return "#9bb08a";             // ниже
}
// Маршрут дня: едем по городам (где суммарно «жирнее»), внутри города — по приоритету.
// Так нет зигзагов между городами Сугда (они далеко друг от друга).
function routeOrder(pts){
  const sc=p=>(p.score==null?-1:p.score), byCity={};
  pts.forEach(p=>{ const c=p.city||"—"; (byCity[c]=byCity[c]||[]).push(p); });
  const cities=Object.keys(byCity).sort((a,b)=>
    byCity[b].reduce((s,p)=>s+sc(p),0)-byCity[a].reduce((s,p)=>s+sc(p),0));
  const out=[];
  cities.forEach(c=>byCity[c].sort((a,b)=>sc(b)-sc(a)).forEach(p=>out.push(p)));
  return out;
}

// Гео снимается В МОМЕНТ съёмки (не отправки): фактическая точка вручения
// досудебки. Уходит ЗАГОЛОВКОМ (не в URL — query оседает в access-логах),
// одинаково для онлайн-пути и оффлайн-очереди. ts — реальное время гео-фикса
// (не момент вызова): кэшированная точка не выдаётся за точку съёмки.
function photoHeaders(geo,ext){
  const h=authHeaders();
  h["Content-Type"]="application/octet-stream";
  h["X-Photo-Raw"]="1";
  h["X-Photo-Ext"]=ext||".jpg";
  if(geo) h["X-Photo-Geo"]=geo.lat+","+geo.lon+","+(geo.acc||0)+","+(geo.ts||Date.now());
  return h;
}
async function upPhoto(){
  const f=$("photo").files[0]; if(!f) return;
  const rep=STATE.cur.rep, op_id=uuid(), ext=photoExt(f.name,f.type), at=Date.now();
  // Важно для iOS: читаем File СРАЗУ, пока security-scoped файл из picker жив.
  // В сеть и IndexedDB дальше идёт самостоятельный ArrayBuffer, не File/Blob path.
  let bytes, mime=f.type||"image/jpeg", ext2=ext;
  try{
    // Жмём ДО чтения в ArrayBuffer: иначе в память и в IndexedDB ляжет
    // восьмимегабайтный оригинал, который потом всё равно не уедет.
    const small=await shrinkPhoto(f);
    bytes=await photoBytes(small||f);
    if(small){ mime="image/jpeg"; ext2="jpg"; }
  }
  catch(e){ toast(L().photolost); return; }
  try{ $("photo").value=""; }catch(e){}
  // Сначала фиксируем единственную самостоятельную копию и ждём commit IDB.
  // Только после этого допустимы geolocation/fetch: iOS может выгрузить PWA на
  // любом await, а pageshow/следующий запуск безопасно досылает тот же op_id.
  const entry={op_id,kind:"photo",rep,bytes,mime,ext:ext2,geo:null,at};
  let geo=null;
  PHOTO_PREPARING.add(op_id);
  try{
    if(!(await enqueue(entry))){ toast(L().photolost); return; }
    const prior=await firstFailedPhoto(rep,op_id);
    if(prior){
      entry.replaces_op_id=prior.op_id;
      try{ await IDB.put("queue",entry); }catch(e){}  // базовая запись уже committed
    }
    // maximumAge 5с: для пруфа съёмки нужна свежая точка, а не кэш минутной
    // давности от прошлого адреса. Нет разрешения/сигнала — фото без точки.
    geo=await grabGeo(4000,5000);
    entry.geo=geo;
    try{ await IDB.put("queue",entry); }catch(e){}  // без geo фото всё равно сохранено
  }finally{
    PHOTO_PREPARING.delete(op_id);
  }
  try{
    const r=await fetch("/api/photo?rep="+enc(rep)+"&op="+op_id,
      {method:"POST",headers:photoHeaders(geo,ext2),body:bytes});
    if(r.ok){
      const j=await r.json(); STATE.online=true;
      showPhotoCount(rep,j.photos);
      await retireReplacedPhoto(entry);
      try{ await IDB.del("queue",op_id); }catch(e){}
      toast(L().saved); updateOffBar(); return;
    }
    if(r.status!==401&&r.status!==403&&r.status<500){
      await markPhotoFailed(entry,String(r.status));
      await retireReplacedPhoto(entry);
      STATE.online=true;
      toast(L().photolost); updateOffBar(); return;
    }
    throw new Error(r.status);
  }catch(e){
    // Нет сети/временная серверная ошибка: committed-запись уже в очереди.
    // Счётчик покажем оптимистично, тот же op_id досылается при связи.
    STATE.online=false; STATE.cur.photos=(STATE.cur.photos||0)+1;
    const el=$("phc"); if(el) el.textContent=L().photos+": "+STATE.cur.photos+" ("+L().queuedn+")";
    toast(L().savedoff); updateOffBar();
  }
}
// --- Геопозиция --------------------------------------------------------------
// ПОЧЕМУ ЗДЕСЬ ОТДЕЛЬНЫЙ ЗАПРОС ПРАВ. Раньше приложение не просило разрешение
// никогда и нигде: точку дёргали неявно, изнутри сохранения визита и отправки
// фото, и с таймаутом 3–4 секунды. За это время человек физически не успевает
// прочитать системный диалог «Разрешить доступ к геопозиции?» и нажать
// «Разрешить»: таймер срабатывает первым, промис закрывается, ответ выбрасывать
// уже некому. iOS второй раз диалог не показывает — и прав нет никогда, а значок
// геолокации не загорается. На андроиде, где права однажды дали, всё работало,
// поэтому баг и дожил. Отсюда правила ниже.
const GEO={state:"unknown",   // unknown | granted | denied | unavailable
           last:null, lastErr:0,
           // Удалось ли ВООБЩЕ спросить систему о состоянии прав. В телеграмном
           // webview на айфоне и в старом Safari `navigator.permissions` нет, и
           // тогда «unknown» означает «не знаем», а не «прав нет».
           probed:false};

function geoErrText(code){
  const t=L();
  if(code===1) return t.geodenied;
  if(code===2) return t.geonosignal;
  if(code===3) return t.geoslow;
  return t.nogeo;
}

// Телеграм на айфоне не всегда пробрасывает navigator.geolocation в свой webview:
// у неё для этого собственный LocationManager (Bot API 8.0+). Если он есть —
// работаем через него, иначе остаётся обычный браузерный путь.
let TGLOC=null;
function tgGeoInit(){
  try{
    if(TG && TG.LocationManager && TG.LocationManager.init){
      TG.LocationManager.init(()=>{ TGLOC=TG.LocationManager; });
    }
  }catch(e){}
}

function tgGetLocation(){
  return new Promise(res=>{
    if(!TGLOC || !TGLOC.getLocation) return res(null);
    try{
      TGLOC.getLocation(d=>{
        if(d && typeof d.latitude==="number"){
          GEO.state="granted";
          GEO.last={lat:d.latitude, lon:d.longitude,
                    acc:Math.round(d.horizontal_accuracy||0), ts:Date.now()};
          return res(GEO.last);
        }
        res(null);
      });
    }catch(e){ res(null); }
  });
}

// Явный запрос прав. Вызывается ТОЛЬКО по нажатию и БЕЗ таймаута: сколько
// человеку нужно на диалог — столько и ждём. Возвращает точку или null.
async function askGeo(){
  const viaTg = await tgGetLocation();
  if(viaTg) return viaTg;
  return askGeoBrowser();
}

function askGeoBrowser(){
  return new Promise(res=>{
    if(!navigator.geolocation){ GEO.state="unavailable"; return res(null); }
    navigator.geolocation.getCurrentPosition(
      p=>{ GEO.state="granted"; GEO.lastErr=0;
           GEO.last={lat:p.coords.latitude, lon:p.coords.longitude,
                     acc:Math.round(p.coords.accuracy||0), ts:p.timestamp||0};
           res(GEO.last); },
      e=>{ GEO.lastErr=(e&&e.code)||0;
           GEO.state=(GEO.lastErr===1)?"denied":"unknown";
           res(null); },
      {enableHighAccuracy:true, maximumAge:0});   // timeout НЕ задаём намеренно
  });
}

// Фоновый снимок точки: для гео-контроля визита и пруфа фото. Не блокирует
// сохранение — нет разрешения или сигнала, сохраняем без точки.
// Короткий таймаут допустим ТОЛЬКО когда права уже подтверждены: иначе он снова
// обгонит системный диалог. Пока прав нет — не дёргаем систему вхолостую.
async function grabGeo(ms,maxAge){
  // У телеграмного LocationManager НЕТ ни таймаута, ни фолбэка: если попап прав
  // закрыли или свернули приложение, колбэк не приходит НИКОГДА. А «Сохранить
  // выезд» ставит SAVING=true и гасит кнопку ДО этого await — значит блокировка
  // не снималась бы до перезапуска, и визит не ушёл бы ни на сервер, ни в очередь.
  // Приложение открывают в Телеграме, так что это основная ветка, а не редкая.
  if(TGLOC){
    const p = await Promise.race([
      tgGetLocation(),
      new Promise(r=>setTimeout(()=>r(null), ms)),
    ]);
    if(p) return p;
  }
  return grabGeoBrowser(ms,maxAge);
}

function grabGeoBrowser(ms,maxAge){
  return new Promise(res=>{
    if(!navigator.geolocation){ GEO.state="unavailable"; return res(null); }
    if(GEO.state==="denied") return res(null);
    // Права подтверждены — берём точку. Состояние НЕ выяснено, потому что спросить
    // систему нечем (телеграмный webview на айфоне, старый Safari) — тоже пробуем:
    // там права вполне могли быть выданы раньше, и молчаливый отказ отнял бы точку
    // у тех, у кого всё работало. А вот когда система ЯВНО сказала «ещё не
    // спрашивали», тихий запрос бессмыслен: он лишь сожжёт единственный показ
    // диалога на четырёхсекундном таймауте. Там работает кнопка.
    if(GEO.state!=="granted" && GEO.probed) return res(null);
    let done=false;
    const fin=v=>{ if(!done){ done=true; clearTimeout(t); res(v); } };
    const t=setTimeout(()=>fin(null), ms);
    navigator.geolocation.getCurrentPosition(
      p=>{ GEO.state="granted";   // получилось — значит права есть, плашку убрать
           GEO.last={lat:p.coords.latitude, lon:p.coords.longitude,
                     acc:Math.round(p.coords.accuracy||0), ts:p.timestamp||0};
           fin(GEO.last); },
      e=>{ GEO.lastErr=(e&&e.code)||0;
           if(GEO.lastErr===1) GEO.state="denied";
           fin(null); },
      {enableHighAccuracy:true, timeout:ms,
       maximumAge:(maxAge==null?60000:maxAge)});
  });
}

// Плашка «Включить геопозицию» на списке клиентов. Показывается, пока права не
// подтверждены: без явного нажатия система прав не даст, а молча падать —
// ровно та ошибка, из-за которой гео не работало вообще.
function geoStatusHTML(){
  const t=L();
  if(GEO.state==="granted") return "";
  if(GEO.state==="unavailable") return "";
  const msg = GEO.lastErr ? `<div class="muted" style="margin-top:6px">${esc(geoErrText(GEO.lastErr))}</div>` : "";
  return `<div class="pcard" id="geocard" style="display:block;margin-bottom:10px">
      <div class="muted">📍 ${esc(t.geowhy)}</div>${msg}
      <button class="btn line" style="margin-top:8px" onclick="geoEnable()">${esc(t.geoon)}</button>
    </div>`;
}

function geoBanner(){ const el=$("geobar"); if(el) el.innerHTML=geoStatusHTML(); }

async function geoEnable(){
  const t=L(), card=$("geocard");
  if(card) card.innerHTML=`<div class="muted">📍 ${esc(t.geowait)}</div>`;
  const p=await askGeo();
  if(p){ toast("✅ "+t.geook); }
  else if(GEO.lastErr) toast(geoErrText(GEO.lastErr));
  geoBanner();
}

// Состояние прав на старте. permissions.query есть не везде (старый iOS Safari
// его не знает) — там остаёмся в "unknown" и показываем кнопку.
async function geoProbe(){
  try{
    if(navigator.permissions && navigator.permissions.query){
      const st=await navigator.permissions.query({name:"geolocation"});
      GEO.probed=true;
      if(st.state==="granted") GEO.state="granted";
      else if(st.state==="denied") GEO.state="denied";
      if(st.addEventListener) st.addEventListener("change",()=>{
        GEO.state=(st.state==="granted")?"granted":(st.state==="denied"?"denied":"unknown");
        try{ geoBanner(); }catch(e){}
      });
    }
  }catch(e){}
}

// Голосовой комментарий: диктовка → /api/voice (Whisper на сервере) → текст в поле.
// Выездники часто плохо пишут по-русски; голосом быстрее и полнее.
let REC=null,VOICE_WAIT=false;
async function toggleVoice(){
  const t=L(), btn=$("micbtn");
  if(VOICE_WAIT) return;
  if(REC){ try{REC.stop();}catch(e){} return; }
  if(!(navigator.mediaDevices&&window.MediaRecorder)){ toast(t.voicefail); return; }
  let stream=null;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast(t.voicefail); return; }
  const chunks=[];
  REC=new MediaRecorder(stream);
  REC.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  REC.onstop=async()=>{
    stream.getTracks().forEach(x=>x.stop());
    REC=null;
    if(btn) btn.innerHTML="🎤 <span>"+esc(t.voice)+"</span>";
    const blob=new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||"audio/webm"});
    if(blob.size<800) return;   // случайный тап — тишину не шлём
    VOICE_WAIT=true;
    toast(t.voicewait);
    const fd=new FormData(); fd.append("voice",blob,"voice.webm");
    const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),70000);
    // КАКАЯ карточка была открыта, когда говорили. Распознавание идёт до минуты,
    // и за это время выездник успевает уйти к следующему должнику. Раньше текст
    // вставлялся в ту карточку, что открыта в момент ОТВЕТА, и автосохранение
    // уносило его на сервер под чужим КД: и мусор в чужой строке реестра, и
    // смешение персональных данных двух людей. Заметить это нельзя — человек уже
    // смотрит следующий адрес.
    const rep0 = STATE.cur ? STATE.cur.rep : null;
    try{
      const r=await fetch("/api/voice?rep="+enc(rep0||""),
                          {method:"POST",headers:authHeaders(),body:fd,signal:ctl.signal});
      if(r.status===429||r.status===503){ toast(t.voiceunavail); return; }
      if(!r.ok) throw 0;
      const j=await r.json();
      if(!(j&&j.text)){ toast(t.voicefail); return; }
      const sameCase = STATE.cur && STATE.cur.rep===rep0;
      const ta=$("f_visit_comment");
      if(sameCase && ta){
        ta.value=(ta.value?ta.value.trim()+" ":"")+j.text;
        ta.dispatchEvent(new Event("input",{bubbles:true}));   // черновик подхватит
        toast("✓");
      }else if(rep0){
        // Ушли из карточки, пока говорили. Текст не теряем — дописываем в её
        // черновик и честно говорим, к кому он лёг.
        appendToDraft(rep0, j.text);
        toast(t.voiceother);
      }else toast(t.voicefail);
    }catch(e){ toast(e&&e.name==="AbortError"?t.voiceunavail:t.voicefail); }
    finally{ clearTimeout(timer); VOICE_WAIT=false; }
  };
  REC.start();
  if(btn) btn.innerHTML="⏹ <span>"+esc(t.voicestop)+"</span>";
  setTimeout(()=>{ if(REC){ try{REC.stop();}catch(e){} } }, 60000);   // предохранитель
}

// Кнопка гасится на всё время отправки: grabGeo ждёт точку до 4 секунд, и за эту паузу
// палец успевает нажать ещё раз. Каждое нажатие — новый op_id, то есть отдельный выезд и
// отдельная отбивка руководителю (в проде так набралось 34 записи по одному договору).
let SAVING=false;
async function saveVisit(){
  if(SAVING) return;
  if(!FORM_VERSION){
    toast("Подключитесь к сети и обновите форму");
    return;
  }
  const values=readForm(), input_keys=[...FORM_TOUCHED];
  if(!values.call_status || !FORM_TOUCHED.has("call_status")){
    toast(L().resultreq);
    return;
  }
  SAVING=true;
  const btn=$("savebtn"); if(btn) btn.disabled=true;
  try{
    const rep=STATE.cur.rep, op_id=uuid();
    const geo=await grabGeo(4000,5000);   // свежая точка, не с прошлого адреса
    const body={rep,values,finish:true,op_id,
      form_version:FORM_VERSION,input_keys};
    if(geo) body.geo=geo;
    try{
      const j=await api("/api/save",{method:"POST",body:JSON.stringify(body)});
      STATE.online=true; STATE.cur=j.person; IDB.put("cards",j.person,rep).catch(()=>{});
      finishSavedUI(rep, L().saved);
    }catch(e){
      // Нет сети — кладём выезд в очередь, помечаем визит локально; уйдёт при связи.
      await enqueue({op_id, kind:"save", rep, values, input_keys,
        form_version:FORM_VERSION, geo, at:Date.now()});
      STATE.online=false; applyVisitLocally(rep, values);
      finishSavedUI(rep, L().savedoff);
    }
  } finally {
    SAVING=false;
    const b=$("savebtn"); if(b) b.disabled=false;
  }
}

// --- Автосохранение черновика формы (устойчивость к обрыву связи) ------------
// localStorage — источник истины: черновик переживает закрытие вкладки/обрыв сети.
// Раз в 20 сек тихо шлём его на сервер (POST /api/save finish:false — визит НЕ
// помечается завершённым, уведомления в группу не уходят, см. web.py _save).
// Полная очистка черновика — только после явного «Сохранить выезд» (finish:true).
let draftTimer=null, syncTimer=null, draftDirty=false;

function currentUid(){
  try{ if(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user) return TG.initDataUnsafe.user.id; }catch(e){}
  return new URLSearchParams(location.search).get("dev_uid") || "anon";
}
function draftKey(rep){ return "draft:"+currentUid()+":"+rep; }

// В payload попадают только явно затронутые пользователем контролы. Это отделяет
// локальный черновик от старого master-prefill в кэшированной карточке.
function fieldKey(el){
  if(!el) return "";
  if(el.dataset&&el.dataset.k) return el.dataset.k;
  if(el.id==="f_visit_comment") return "visit_comment";
  if(el.id==="f_tips") return "tips";
  return "";
}
function readForm(){
  const values={};
  document.querySelectorAll("#panel select[data-k]").forEach(s=>{
    if(FORM_TOUCHED.has(s.dataset.k)&&s.value) values[s.dataset.k]=s.value;
  });
  const cc=$("f_visit_comment");
  if(FORM_TOUCHED.has("visit_comment")&&cc&&cc.value.trim())
    values.visit_comment=cc.value.trim();
  const tp=$("f_tips");
  if(FORM_TOUCHED.has("tips")&&tp&&tp.value.trim()) values.tips=tp.value.trim();
  return values;
}
function formVisible(){ return !!(STATE.cur && STATE.tab==="form" && $("f_visit_comment")); }

function loadDraft(rep){ try{ const s=localStorage.getItem(draftKey(rep)); return s?JSON.parse(s):null; }catch(e){ return null; } }
function clearDraft(rep){ try{ localStorage.removeItem(draftKey(rep)); }catch(e){} }
function saveDraft(){
  if(!formVisible()) return;   // не читать DOM другой вкладки — иначе затрём черновик пустотой
  const v=readForm(), key=draftKey(STATE.cur.rep);
  try{
    if(Object.keys(v).length) localStorage.setItem(
      key, JSON.stringify({v, keys:[...FORM_TOUCHED], at:Date.now()}));
    else localStorage.removeItem(key);
  }catch(e){}
}
function flushDraft(){ clearTimeout(draftTimer); saveDraft(); }   // немедленно, перед уходом с формы

// Дописать текст в черновик ЧУЖОЙ (не открытой сейчас) карточки. Нужен ровно
// одному сценарию: голос ушёл на распознавание, а выездник за эту минуту перешёл
// к следующему должнику. Терять надиктованное нельзя, вставлять в открытую
// карточку — тем более: это чужие персональные данные.
function appendToDraft(rep, text){
  if(!rep || !text) return;
  let d=loadDraft(rep) || {v:{}, keys:[], at:Date.now()};
  const prev=(d.v && d.v.visit_comment) ? String(d.v.visit_comment).trim() : "";
  d.v=d.v||{}; d.v.visit_comment = prev ? (prev+" "+text) : text;
  d.keys=[...new Set([...(d.keys||[]), "visit_comment"])];
  d.at=Date.now();
  try{ localStorage.setItem(draftKey(rep), JSON.stringify(d)); }catch(e){}
}

function onFormChange(event){
  const key=fieldKey(event&&event.target);
  if(key) FORM_TOUCHED.add(key);
  draftDirty=true;
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{ saveDraft(); markDraftBadge(true); }, 500);
}
function markDraftBadge(dirty){
  const e=$("draftstat"); if(!e) return; const t=L();
  e.style.display="flex";
  e.innerHTML=`<span class="d" style="background:${dirty?'var(--danger)':'var(--success)'}"></span>`+
    `<span class="muted">${dirty?t.draftwait:t.draftsent}</span>`;
}

// Восстановление черновика поверх серверных значений при открытии формы.
function restoreDraftIntoForm(){
  if(!STATE.cur) return;
  const d=loadDraft(STATE.cur.rep); if(!d||!d.v) return;
  const draftKeys=new Set(
    Array.isArray(d.keys) ? d.keys : Object.keys(d.v)
  );
  let applied=false;
  Object.entries(d.v).forEach(([k,val])=>{
    if(!draftKeys.has(k)) return;
    let el=null;
    // call_comment — легаси-черновики, сохранённые старой оболочкой в localStorage
    if(k==="visit_comment"||k==="call_comment") el=$("f_visit_comment");
    else if(k==="tips") el=$("f_tips");
    else el=document.querySelector('#panel select[data-k="'+k+'"]');
    if(el){
      FORM_TOUCHED.add(k==="call_comment"?"visit_comment":k);
      if(el.value!==val){ el.value=val; applied=true; }
    }
  });
  if(applied||FORM_TOUCHED.size){ draftDirty=true; markDraftBadge(true); }
}
function setupFormDraft(){
  const p=$("panel"); if(!p) return;
  restoreDraftIntoForm();
  p.querySelectorAll('select[data-k], #f_visit_comment, #f_tips').forEach(el=>{
    el.addEventListener(el.tagName==="SELECT"?"change":"input", onFormChange);
  });
  startAutoSync();
}

function startAutoSync(){ stopAutoSync(); syncTimer=setInterval(()=>{ if(draftDirty) pushDraft(); }, 20000); }
function stopAutoSync(){ if(syncTimer){ clearInterval(syncTimer); syncTimer=null; } }
async function pushDraft(){
  if(!STATE.cur) return;
  const d=loadDraft(STATE.cur.rep), values=(d&&d.v)||{};
  const input_keys=(d&&Array.isArray(d.keys))?d.keys:Object.keys(values);
  if(!Object.keys(values).length){ draftDirty=false; return; }
  try{
    await api("/api/save",{method:"POST",body:JSON.stringify({
      rep:STATE.cur.rep,values,finish:false,
      form_version:FORM_VERSION,input_keys})});
    draftDirty=false; markDraftBadge(false);   // localStorage НЕ чистим — кэш до явного finish:true
  }catch(e){}   // сеть/ошибка — черновик остаётся, повтор на следующем интервале
}

// Уход со страницы/сворачивание приложения — досрочно сохранить (и попробовать отправить).
// В мобильном WebView не гарантировано, поэтому это лишь подстраховка; истина — localStorage.
window.addEventListener("beforeunload", flushDraft);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ flushDraft(); pushDraft(); } });

// Тихое фоновое обновление портфеля. iOS-ярлык неделями живёт без перезагрузки
// страницы (процесс замораживается/размораживается), boot() не перезапускается —
// без этого свежий разброс «не появлялся» (выглядело как кэш; данные /api service
// worker НЕ кэширует, виновата вечно спящая вкладка). Обновляем STATE и оффлайн-
// снимок; список перерисовываем ТОЛЬКО если он сейчас на экране — открытую
// карточку/форму не дёргаем, черновики целы.
let LAST_REFRESH=0;
async function refreshData(){
  if(Date.now()-LAST_REFRESH<60000) return;      // не чаще раза в минуту
  try{
    const d=await api("/api/bootstrap");
    LAST_REFRESH=Date.now();
    if(d.needsOnboarding) return;                // экраны входа фоном не дёргаем
    const prev=await loadBootstrapSnapshot();
    if(prev && prev.employee && d.employee && prev.employee!==d.employee) await clearLocalData();
    const sig=ps=>JSON.stringify((ps||[]).map(p=>[p.rep,p.visited,p.n]));
    const changed=sig(STATE.persons)!==sig(d.persons);
    setMeta(d.meta); STATE.persons=d.persons; STATE.kind=d.kind||"agent";
    STATE.roles=d.roles||null;   // роль руководителя: список его сотрудников + текущий
    STATE.online=true; cacheBootstrap(d); updateOffBar();
    if(changed){
      warmCards();                               // и полные карточки новых клиентов
      const q=$("q");                            // поиск есть только на экране списка
      if(!STATE.cur && q){ const qs=q.value; renderList();
        if(qs){ $("q").value=qs; filterList(); } }
    }
  }catch(e){}                                    // оффлайн/отказ — молча, до следующего раза
}
setInterval(refreshData, 10*60*1000);            // раз в 10 минут при открытом приложении

// Появилась связь — досылаем накопленную очередь; пропала — переключаем индикатор.
// Плюс досыл и обновление данных при возвращении к приложению (события online в
// мобильном WebView не всегда надёжны, visibilitychange/pageshow — подстраховка).
window.addEventListener("online", ()=>{ STATE.online=true; updateOffBar(); flushQueue(); refreshData(); });
window.addEventListener("offline", ()=>{ STATE.online=false; updateOffBar(); });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ flushQueue(); refreshData(); } });
window.addEventListener("pageshow", e=>{ if(e.persisted){ flushQueue(); refreshData(); } });

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// --- Геометки: захват точки (геолокация телефона) + сохранение ---
// Метка ставится по нажатию, значит можно и нужно спрашивать права здесь же —
// БЕЗ таймаута. Прежние 10 секунд тоже обгоняли системный диалог на холодном
// устройстве, и человек проваливался в ручной ввод координат, хотя всего лишь
// не успел нажать «Разрешить».
function getLoc(){
  return new Promise((resolve,reject)=>{
    const manual=()=>{ const s=prompt("lat, lon"); if(s&&s.includes(",")){
      const [a,b]=s.split(",").map(x=>parseFloat(x.trim())); if(!isNaN(a)&&!isNaN(b)) return resolve({lat:a,lon:b}); }
      reject(new Error("denied")); };
    askGeo().then(p=>{ if(p) resolve({lat:p.lat,lon:p.lon}); else manual(); })
            .catch(()=>manual());
  });
}
async function setMarkCase(){
  const t=L(); toast(t.getloc);
  let loc; try{ loc=await getLoc(); }catch(e){ alert(t.nogeo); return; }   // сбой геолокации ≠ сбой сети
  const rep=STATE.cur.rep, op_id=uuid();
  try{
    const j=await api("/api/marker",{method:"POST",body:JSON.stringify({rep,lat:loc.lat,lon:loc.lon,op_id})});
    STATE.online=true; if(j.person){ STATE.cur=j.person; IDB.put("cards",j.person,rep).catch(()=>{}); }
    if(TG&&TG.HapticFeedback) TG.HapticFeedback.notificationOccurred("success");
    toast(t.marksaved); drawPanel();
  }catch(e){
    await enqueue({op_id, kind:"marker", rep, lat:loc.lat, lon:loc.lon, at:Date.now()});
    STATE.online=false;
    if(STATE.cur && STATE.cur.rep===rep){ STATE.cur.geo={lat:loc.lat,lon:loc.lon,src:"manual"}; IDB.put("cards",STATE.cur,rep).catch(()=>{}); }
    if(TG&&TG.HapticFeedback) TG.HapticFeedback.notificationOccurred("success");
    toast(t.marksaved+" ("+t.queuedn+")"); drawPanel(); updateOffBar();
  }
}
// --- Навигатор: карта + поиск по справочнику ---------------------------------
// Занимает вкладку, где раньше был список меток. Метки никуда не делись: их
// по-прежнему ставят с карточки кейса и кнопкой ниже, а на этой карте они видны
// точками — списком строк они были нужны меньше, чем сама карта.
let NAVPICK=null;
// К какому кейсу привязать заметку, если её пишут не из карточки.
let NOTE_REP=null;

// Тап по окошку карты в карточке — открыть полноценную карту на этом должнике.
// Раньше окошко было картинкой: посмотреть в деталях было нельзя, только уехать
// в полноэкранное ведение, а это уже «поехали», а не «покажи».
function openCaseOnMap(){
  const d=STATE.cur;
  if(d && d.geo && d.geo.lat!=null){
    renderNav({lat:d.geo.lat, lon:d.geo.lon, title:d.client||L().none});
  }else{
    renderNav();
  }
}

async function renderNav(focus){
  flushDraft(); stopAutoSync(); stopMeWatch();
  removeMap(); STATE.cur=null; NAVPICK=null;
  const t=L();
  $("app").innerHTML=`
    <input class="search" id="navq" style="width:100%;margin-bottom:8px"
           placeholder="${esc(t.navph)}" autocomplete="off"
           oninput="navSuggest()" onkeydown="if(event.key==='Enter')navGoTyped()">

// Подсказки: сервер ищет по тому же офлайн-справочнику, наружу ничего не уходит.
// Дебаунс, чтобы не дёргать сервер на каждую букву в дороге по слабой связи.
let NAVSUGT=null;
function navSuggest(){
  clearTimeout(NAVSUGT);
  NAVSUGT=setTimeout(navSuggestGo, 250);
}
async function navSuggestGo(){
  const el=$("navq"), box=$("navsug");
  if(!el||!box) return;
  const q=(el.value||"").trim();

         <span class="mkdot"></span><div>${esc(it.label)}</div></div>`).join("")+
    `</div>`;
  box._items=items;
}

function navPick(i){

function navShowPick(){

  el.innerHTML=`<div class="pcard" style="display:block;margin-bottom:8px">
      <div>${esc(NAVPICK.title)}</div>
      <div class="muted" style="font-size:11px">${(+NAVPICK.lat).toFixed(5)}, ${(+NAVPICK.lon).toFixed(5)}</div>
      <button class="btn acc" style="margin-top:8px" onclick="navDrive()">${ic("nav")}<span>${esc(L().navgo)}</span></button>

// Ввод без выбора подсказки: обычный геокодинг, он же понимает «широта, долгота».
async function navGoTyped(){

    NAVPINEL=new maplibregl.Marker({element:d}).setLngLat([p.lon,p.lat]).addTo(MAP);
  }catch(e){}

// ВНИМАНИЕ: имя initNavTabMap, а не initNavMap — последнее уже занято
// полноэкранным режимом ведения (объявление ниже по файлу перекрыло бы это).
let MEPIN=null, MEWATCH=null;
async function initNavTabMap(focus){
  const el=$("navtabmap"); if(!el) return;
  if(!(await ensureMapLibs())) return;
  removeMap();
  let style=RASTER_STYLE; const vt=STATE.meta&&STATE.meta.vectorTiles;
  if(vt&&window.pmtiles&&window.protomaps_themes_base){ try{ style=vectorStyle(vt);}catch(e){} }
  // «Небольшая область рядом» — если точка известна. Права уже могли дать раньше;
  // если нет, не дёргаем систему молча: покажется общий вид, а кнопка запроса
  // прав живёт на списке клиентов.
  const pts=(STATE.persons||[]).filter(p=>p.lat!=null&&p.lon!=null);
  let center=[69.6,40.2], zoom=8;
  const me = (GEO.state!=="denied") ? (GEO.last || await grabGeo(4000)) : null;
  if(focus && focus.lat!=null){ center=[focus.lon,focus.lat]; zoom=15; }
  else if(me){ center=[me.lon,me.lat]; zoom=14; }
  else if(pts.length){ center=[pts[0].lon,pts[0].lat]; zoom=11; }
  MAP=new maplibregl.Map({container:el,style,center,zoom,attributionControl:false,dragRotate:false});
  let fb=false;
  MAP.on("error",()=>{ if(!fb&&style!==RASTER_STYLE){fb=true;try{MAP.setStyle(RASTER_STYLE);}catch(e){}} });
  MAP.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");

  // Мои клиенты — цвет точки по приоритету, номер по порядку объезда. Раньше это
  // была отдельная вкладка «Карта»; смысла держать две карты нет.
  const route=routeOrder(pts);
  route.forEach((p,i)=>{
    const d=document.createElement("div");
    d.style.cssText=`width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font:600 11px/1 system-ui;color:#fff;border:2px solid #fff;
      box-shadow:0 1px 4px rgba(0,0,0,.35);background:${priColor(p.score)}`;
    d.textContent=String(i+1);
    d.onclick=(ev)=>{ ev.stopPropagation(); openP(p.rep); };
    try{ new maplibregl.Marker({element:d}).setLngLat([p.lon,p.lat]).addTo(MAP); }catch(e){}
  });

  drawMePin(me);
  startMeWatch();                      // точка «где я» должна ехать вместе с тобой

  // Ранее поставленные метки — точками на этой же карте.
  try{
    const j=await api("/api/markers");
    (j.markers||[]).forEach(m=>{
      const d=document.createElement("div");
      d.style.cssText="width:10px;height:10px;border-radius:50%;background:#D08C34;border:2px solid #fff";
      const mk=new maplibregl.Marker({element:d}).setLngLat([+m.lon,+m.lat]).addTo(MAP);
      try{ mk.setPopup(new maplibregl.Popup({offset:10})
             .setText(m.label||(m.rep?("КД "+m.rep):L().standalone))); }catch(e){}
    });
  }catch(e){}

  if(focus && focus.lat!=null){ NAVPICK=focus; navShowPick(); navDropPin(focus); }

  // Тап по карте — тоже цель: удобнее, чем набирать адрес на ходу.
  MAP.on("click", ev=>{
    NAVPICK={lat:ev.lngLat.lat, lon:ev.lngLat.lng,
             title:ev.lngLat.lat.toFixed(5)+", "+ev.lngLat.lng.toFixed(5)};
    navShowPick(); navDropPin(NAVPICK);
  });
}

function drawMePin(me){
  if(!me || !MAP) return;
  try{
    if(MEPIN){ MEPIN.setLngLat([me.lon,me.lat]); return; }
    const d=document.createElement("div");
    d.style.cssText="width:16px;height:16px;border-radius:50%;background:#2F7D5B;"+
      "border:3px solid #fff;box-shadow:0 0 0 4px rgba(47,125,91,.25)";
    d.title=L().mehere;
    MEPIN=new maplibregl.Marker({element:d}).setLngLat([me.lon,me.lat]).addTo(MAP);
  }catch(e){}
}

// Живая точка «где я сейчас». Без неё карта отвечает на вопрос «где должники»,
// но не на «где я относительно них» — а в поле нужен именно второй.
function startMeWatch(){
  stopMeWatch();
  if(!navigator.geolocation) return;
  if(GEO.state==="denied") return;
  if(GEO.state!=="granted" && GEO.probed) return;   // см. grabGeoBrowser
  try{
    MEWATCH=navigator.geolocation.watchPosition(
      p=>{ GEO.last={lat:p.coords.latitude, lon:p.coords.longitude,
                     acc:Math.round(p.coords.accuracy||0), ts:p.timestamp||0};
           drawMePin(GEO.last); },
      ()=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  }catch(e){}
}
function stopMeWatch(){
  if(MEWATCH!=null && navigator.geolocation){
    try{ navigator.geolocation.clearWatch(MEWATCH); }catch(e){}
  }
  MEWATCH=null; MEPIN=null;
}

// --- Полноэкранная навигация: «Поехать» переводит миниапп в режим навигатора. ---
// Живая геопозиция (watchPosition) + камера «по курсу» (track-up, как в обычных
// навигаторах) + линия маршрута (свой OSRM, если поднят, иначе честная прямая) +
// нижняя плашка с расстоянием/ETA. Внешние приложения (Я/Google/2ГИС) остаются
// для настоящей голосовой turn-by-turn навигации — это сознательное решение
// (см. AGENTS.md), а не недоделка: здесь — живой превью-навигатор + быстрый переход.

           meMarker:null, destMarker:null, routeFetched:false, refreshTimer:null,

function bearingBetween(a,b){
  const toRad=x=>x*Math.PI/180, toDeg=x=>x*180/Math.PI;
  const dLon=toRad(b.lon-a.lon);
  const y=Math.sin(dLon)*Math.cos(toRad(b.lat));
  const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(dLon);
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function haversineKm(a,b){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

  const t = L();

      <select class="search" style="width:100%" onchange="actAs(this.value)">${opts}</select>
