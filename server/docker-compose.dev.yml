# Локальный дев-контур для работы на РЕАЛЬНЫХ данных (ПД не уезжают на VPS).
# Поднимает ТОЛЬКО веб-сервис (миниапп + админ-API + движок приоритета) —
# без поллинга бота: токен занят боевым на VPS, а для карты/пульта бот не нужен.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#   пульт   → http://127.0.0.1:8080  (Admin-ключ только из локального env)
#   миниапп → http://127.0.0.1:8080/?dev_uid=1001   (дев-обход, без Телеги)
#
# Реальная БД лежит в ./data_dev (хост, локально). В образ НЕ попадает (.dockerignore).
services:
  web:
    build: .
    image: hardbot-web:dev
    command: python web.py
    environment:
      APP_DEV: "1"            # разрешить дев-обход миниаппа (?dev_uid=)
      APP_DATA: /data
      MINIAPP_PORT: "8080"
      ADMIN_API_KEY: "${ADMIN_API_KEY:?set ADMIN_API_KEY in local environment}"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8080:8080"    # только localhost — наружу ничего не торчит
    volumes:
      - ./data_dev:/data         # реальная БД переживает пересборку, остаётся на хосте
    restart: unless-stopped
