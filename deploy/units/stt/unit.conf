# Свойства единицы. Читается автоматически из deploy/_lib.sh.
#
# В UNIT_SERVICES только «stt»: контейнер stt-token одноразовый — он создаёт
# токен и завершается, ждать от него healthy бессмысленно. Compose поднимает
# его сам, потому что служба объявлена зависимой от его успешного завершения.

UNIT_NAME=stt
UNIT_TITLE="распознавание речи (голосовые комментарии)"

UNIT_SERVICES="stt"

UNIT_NEEDS_NET=0        # наружу не слушает, общая сеть не нужна
UNIT_NEEDS_STT_VOL=1    # том hard-stt-run — сокет и токен

# Сколько ждать готовности службы. Прежние 900 секунд были рассчитаны на
# скачивание модели с huggingface.co; модель теперь едет в образе и грузится с
# диска за считаные секунды (замер: 2 с). Четыре минуты — с большим запасом на
# медленный диск и на прогрев healthcheck (start-period в stt/Dockerfile — 180 с).
#
# Длинное ожидание не безобидно: сломанная служба молчала бы все 15 минут,
# прежде чем признаться, и инженер всё это время считал бы, что «идёт загрузка».
# Кто осознанно включил STT_ALLOW_DOWNLOAD=1 — верните сюда 900.
UNIT_WAIT_SECONDS=240
