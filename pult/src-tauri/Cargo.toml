[package]
name = "pult"
version = "0.4.0"
edition = "2021"
description = "Контур · Выезды — десктоп-пульт аналитика (Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
