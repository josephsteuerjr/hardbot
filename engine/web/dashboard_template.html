<!doctype html>
<!-- ИСТОЧНИК ИСТИНЫ дашборда. Правьте ТОЛЬКО этот файл.
     dashboard.html генерируется отсюда командой `python engine/build_demo.py`
     (подстановка данных в /*__DATA__*/). Руками dashboard.html НЕ редактировать — затрётся. -->
<html lang="ru" data-theme="kontur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Контур · Движок выездов</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<style>
  :root,[data-theme=kontur]{--bg:#FAF9F5;--panel:#FAF9F5;--panel2:#FFFFFF;--line:#E6E2D9;--txt:#2B2825;--mut:#6B6660;--faint:#9A938A;--acc:#36332E;--acc-h:#46423B;--acc-text:#FFFFFF;--red:#B0472C;--serif:Georgia,'Times New Roman',serif;--sheet:64px;--safe:env(safe-area-inset-bottom,0px)}
  [data-theme=grafit]{--bg:#0d1117;--panel:#161b22;--panel2:#1c232c;--line:#2b333d;--txt:#e6edf3;--mut:#8b949e;--faint:#6b7480;--acc:#39c5cf;--acc-h:#5bd0d8;--acc-text:#04232a;--red:#f85149}
  [data-theme=sumrak]{--bg:#241f1a;--panel:#2A2520;--panel2:#332E27;--line:#433c33;--txt:#EDE6DA;--mut:#B5AB9B;--faint:#8a8175;--acc:#E0A06A;--acc-h:#E9B481;--acc-text:#2B2620;--red:#C56B4A}
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;font-family:'Segoe UI',Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%}
  #map{position:fixed;inset:0;z-index:0;background:var(--bg)}
  #side{position:fixed;z-index:10;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:761px){ #side{top:0;left:0;bottom:0;width:360px} #map{left:360px} .handle{display:none} #side .scroll{padding:14px 16px} }
  @media(max-width:760px){
    #side{left:0;right:0;bottom:0;max-height:80vh;border-right:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(calc(100% - var(--sheet) - var(--safe)));transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.22)}
    #side.open{transform:translateY(0)} #side .scroll{padding:4px 14px calc(20px + var(--safe))} .legend{display:none}
  }
  header{padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
  .handle{height:4px;width:40px;border-radius:3px;background:var(--line);margin:0 auto 9px}
  .brandrow{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .brand{font-weight:700;font-size:16px;font-family:var(--serif)} .brand b{color:var(--red);font-weight:700}
  .chev{color:var(--mut);font-size:13px} .sub{color:var(--faint);font-size:11px;margin-top:2px}
  .ctl{display:flex;gap:8px 10px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .seg2{display:flex;gap:3px} .seg2 button{padding:6px 9px;font-size:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:7px;cursor:pointer;min-width:32px;min-height:32px}
  .seg2 button.on{background:var(--acc);color:var(--acc-text);border-color:var(--acc);font-weight:600}
  .clab{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;align-self:center}
  #side .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card .k{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  .card .v{font-size:19px;font-weight:700;margin-top:3px;font-family:var(--serif)} .card .v small{font-size:11px;color:var(--mut);font-weight:500;font-family:'Segoe UI',sans-serif}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin:16px 0 8px}
  .sld{margin:11px 0} .sld label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .sld label b{color:var(--acc)} input[type=range]{width:100%;height:26px;accent-color:var(--acc)}
  .seg{display:flex;gap:6px;margin-bottom:6px}
  .seg button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:10px;border-radius:9px;font-size:13px;cursor:pointer;min-height:44px}
  .seg button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-text);font-weight:600}
  .btn{width:100%;background:var(--acc);border:none;color:var(--acc-text);font-weight:700;padding:13px;border-radius:10px;cursor:pointer;font-size:14px;margin-top:8px;min-height:48px}
  .btn:hover{background:var(--acc-h)} .btn.alt{background:var(--panel2);color:var(--txt);border:1px solid var(--line)} .btn:active{transform:translateY(1px)}
  .row{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:var(--panel2);cursor:pointer;min-height:46px}
  .row:active{border-color:var(--acc)} .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .row .nm{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sc{font-size:14px;font-weight:700;font-family:var(--serif)} .row .meta{font-size:11px;color:var(--mut);font-weight:400}
  .legend{position:absolute;left:12px;bottom:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.10)}
  .legend .g{display:flex;align-items:center;gap:6px;margin:3px 0}
  #rinfo{position:absolute;z-index:6;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:12px;min-width:210px;max-width:280px;box-shadow:0 4px 16px rgba(0,0,0,.14)}
  @media(min-width:761px){ #rinfo{right:12px;top:12px} } @media(max-width:760px){ #rinfo{left:10px;right:10px;top:10px;min-width:0} }
  #rinfo .big{font-size:18px;font-weight:700;color:var(--txt);font-family:var(--serif)} #rinfo .note{color:var(--faint);font-size:10.5px;margin-top:3px;line-height:1.35}
  .maplibregl-popup-content{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;font-size:12.5px;padding:11px 13px;box-shadow:0 4px 16px rgba(0,0,0,.16)}
  .maplibregl-popup-content b{color:var(--acc)} .maplibregl-popup-tip{border-top-color:var(--panel2)!important;border-bottom-color:var(--panel2)!important}
  .maplibregl-ctrl-group button{width:34px;height:34px}
  .foot{color:var(--faint);font-size:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:10px;line-height:1.5}
</style>
</head>
<body>
<div id="map"></div>
<div id="rinfo" style="display:none"></div>
<aside id="side">
  <header>
    <div class="handle"></div>
    <div class="brandrow" id="brandrow">
      <div><div class="brand">Контур · <b>Движок выездов</b></div><div class="sub" id="sub" data-i18n="sub">аналитический пульт</div></div>
      <div class="chev" id="chev">▲</div>
    </div>
    <div class="ctl">
      <div class="seg2" id="themes"><button data-theme="kontur" title="Контур">☀</button><button data-theme="sumrak" title="Сумерки">◑</button><button data-theme="grafit" title="Графит">☾</button></div>
      <div class="seg2" id="langs"><button data-lang="ru">RU</button><button data-lang="uz">UZ</button><button data-lang="tg">TJ</button></div>
      <div class="seg2" id="bmaps"><button data-bmap="raster" data-i18n="map_r">Растр</button><button data-bmap="vector" data-i18n="map_v">Вектор</button></div>
    </div>
  </header>
  <div class="scroll">
    <div class="cards" id="cards"></div>
    <h3 data-i18n="aud">Аудитория</h3>
    <div class="seg" id="aud"><button data-a="courier" class="on" data-i18n="courier">Курьер (ТДж)</button><button data-a="agent" data-i18n="agent">Выездник</button></div>
    <h3 data-i18n="weights">Веса: куда выгоднее ехать</h3>
    <div class="sld"><label><span data-i18n="w_debt">Долг</span> <b id="wd_v">50</b></label><input id="wd" type="range" min="0" max="100" value="50"></div>
    <div class="sld"><label><span data-i18n="w_near">Близость</span> <b id="wc_v">30</b></label><input id="wc" type="range" min="0" max="100" value="30"></div>
    <div class="sld"><label><span data-i18n="w_fresh">Свежесть</span> <b id="wf_v">20</b></label><input id="wf" type="range" min="0" max="100" value="20"></div>
    <div class="ctl" style="margin:10px 0 0"><span class="clab" data-i18n="brig_lbl">Бригада</span><div class="seg2" id="brig"><button data-agents="1" class="on">1</button><button data-agents="2">2</button><button data-agents="3">3</button></div></div>
    <button class="btn" id="route_btn" data-i18n="build">Построить маршрут дня</button>
    <button class="btn alt" id="clear_btn" data-i18n="clear">Сбросить маршрут</button>
    <h3 data-i18n="top">Топ кейсов</h3>
    <div id="list"></div>
    <div class="foot" id="foot" data-i18n="foot"></div>
  </div>
</aside>
<div class="legend" id="legend"></div>
<script>
const DATA = /*__DATA__*/;
const fmt = n => (n||0).toLocaleString('ru-RU');
const $ = id => document.getElementById(id);
let AUD = DATA.audience, AGENTS = 1;
let CUR = localStorage.getItem('kontur_theme')||'kontur';
let LNG = localStorage.getItem('kontur_lang')||'ru';
let BMAP = localStorage.getItem('kontur_bmap')||'vector';
const ORIGIN = location.origin;

const THEMES={
  kontur:{map:'light_all',bg:'#FAF9F5',route:'#36332E',stroke:'#FFFFFF',prio:['#9A938A','#C9852A','#5B8A3C'],drop:'#B0472C',vk:'light'},
  sumrak:{map:'dark_all',bg:'#241f1a',route:'#E0A06A',stroke:'#241f1a',prio:['#9b8f7e','#D6A24E','#8FAE6B'],drop:'#C56B4A',vk:'dark'},
  grafit:{map:'dark_all',bg:'#0d1117',route:'#39c5cf',stroke:'#0d1117',prio:['#6e7681','#d29922','#3fb950'],drop:'#f85149',vk:'dark'},
};
const VMAP={light:{earth:'#f4f2ea',landuse:'#e9ece2',water:'#bcd6e6',road:'#d6d1c4',bld:'#e2ddd1',place:'#5b5650'},
  dark:{earth:'#15110c',landuse:'#1b1712',water:'#16222c',road:'#2c2720',bld:'#221d17',place:'#9a9082'}};
const L={
  sub:{ru:'аналитический пульт',uz:'tahliliy panel',tg:'пулти таҳлилӣ'},
  aud:{ru:'Аудитория',uz:'Auditoriya',tg:'Гурӯҳ'},
  courier:{ru:'Курьер (ТДж)',uz:'Kuryer (TJ)',tg:'Пайк (ТҶ)'}, agent:{ru:'Выездник',uz:'Chiquvchi',tg:'Сафаркунанда'},
  weights:{ru:'Веса: куда выгоднее ехать',uz:'Vaznlar: qayerga borish foydali',tg:'Вазнҳо: куҷо рафтан фоиданок'},
  w_debt:{ru:'Долг',uz:'Qarz',tg:'Қарз'}, w_near:{ru:'Близость',uz:'Yaqinlik',tg:'Наздикӣ'}, w_fresh:{ru:'Свежесть',uz:'Yangilik',tg:'Тозагӣ'},
  brig_lbl:{ru:'Бригада',uz:'Brigada',tg:'Бригада'},
  build:{ru:'🚗 Построить маршрут',uz:'🚗 Marshrut tuzish',tg:'🚗 Масир сохтан'}, building:{ru:'⏳ Строю…',uz:'⏳ Tuzilmoqda…',tg:'⏳ Сохта истодаам…'},
  clear:{ru:'Сбросить',uz:'Tozalash',tg:'Тоза кардан'}, top:{ru:'Топ кейсов',uz:'Top keyslar',tg:'Кейсҳои беҳтар'},
  c_work:{ru:'В работе',uz:'Ishda',tg:'Дар кор'}, c_of:{ru:'из',uz:'dan',tg:'аз'}, c_debt:{ru:'Долг активный',uz:'Faol qarz',tg:'Қарзи фаъол'},
  c_scout:{ru:'Разведка',uz:'Razvedka',tg:'Иктишоф'}, c_scout_s:{ru:'нет данных',uz:'maʼlumotsiz',tg:'бе маълумот'},
  c_press:{ru:'Дожим',uz:'Bosim',tg:'Фишор'}, c_press_s:{ru:'есть исход',uz:'natija bor',tg:'натиҷа ҳаст'},
  r_title:{ru:'Маршрут дня',uz:'Kun marshruti',tg:'Масири рӯз'}, r_pts:{ru:'точек',uz:'nuqta',tg:'нуқта'},
  r_drive:{ru:'в пути',uz:'yoʻlda',tg:'дар роҳ'}, r_note:{ru:'чистая езда + запас · без времени на адресах',uz:'faqat yoʻl + zaxira · manzil vaqtisiz',tg:'танҳо роҳ + захира · бе вақти суроға'},
  r_debt:{ru:'Долг по маршруту',uz:'Marshrut qarzi',tg:'Қарзи масир'},
  br_title:{ru:'Бригада',uz:'Brigada',tg:'Бригада'}, br_agents:{ru:'выездника(ов)',uz:'chiquvchi',tg:'сафаркунанда'}, br_parallel:{ru:'параллельно',uz:'parallel',tg:'параллел'}, br_a:{ru:'В',uz:'C',tg:'С'},
  lg_title:{ru:'Приоритет выезда',uz:'Chiqish ustuvorligi',tg:'Афзалияти сафар'},
  lg_hi:{ru:'высокий',uz:'yuqori',tg:'баланд'}, lg_mid:{ru:'средний',uz:'oʻrta',tg:'миёна'}, lg_lo:{ru:'низкий',uz:'past',tg:'паст'},
  lg_drop:{ru:'снят (killer)',uz:'olib tashlandi',tg:'хориҷ'}, lg_size:{ru:'размер ∝ долг',uz:'oʻlcham ∝ qarz',tg:'андоза ∝ қарз'},
  map_r:{ru:'Растр',uz:'Rastr',tg:'Растр'}, map_v:{ru:'Вектор',uz:'Vektor',tg:'Вектор'},
  m_разведка:{ru:'разведка',uz:'razvedka',tg:'иктишоф'}, m_дожим:{ru:'дожим',uz:'bosim',tg:'фишор'},
  pop_debt:{ru:'Долг',uz:'Qarz',tg:'Қарз'}, pop_score:{ru:'Скор',uz:'Ball',tg:'Балл'}, km:{ru:'км',uz:'km',tg:'км'}, min:{ru:'мин',uz:'daq',tg:'дақ'},
  foot:{ru:'Геокод → скоринг → объезд по дорогам (OSRM). Синтетика, ПД не покидают контур.',uz:'Geokod → skoring → yoʻl marshruti (OSRM). Sintetika, shaxsiy maʼlumot chiqmaydi.',tg:'Геокод → скоринг → масир бо роҳҳо (OSRM). Синтетикӣ, маълумоти шахсӣ намебарояд.'},
};
const t=(k)=>{const d=L[k]||{};return d[LNG]||d.ru||k;};
const tmode=(m)=>t('m_'+m)||m;
function tilesFor(name){const m=THEMES[name].map;return ['a','b','c'].map(s=>`https://${s}.basemaps.cartocdn.com/${m}/{z}/{x}/{y}.png`);}

function nW(){ let d=+wd.value,c=+wc.value,f=+wf.value; const s=(d+c+f)||1; wd_v.textContent=d; wc_v.textContent=c; wf_v.textContent=f; return {d:d/s,c:c/s,f:f/s}; }
function scoreOf(p,w){ if(p.dropped) return 0; return Math.max(0,Math.min(130,100*(w.d*p.debt_s+w.c*p.cluster_s+w.f*p.fresh_s)+p.adj)); }
function colorFor(p,sc){ const T=THEMES[CUR]; if(p.dropped) return T.drop; return T.prio[ sc>=75?2: sc>=45?1:0 ]; }
function features(w){ return DATA.points.map(p=>{const sc=scoreOf(p,w);return {type:'Feature',geometry:{type:'Point',coordinates:[p.lon,p.lat]},properties:{...p,score:Math.round(sc*10)/10,color:colorFor(p,sc),r:Math.max(4,Math.min(20,Math.sqrt(p.debt)/170))}};}); }

if(window.pmtiles){ try{ maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile); }catch(_e){} }
let map=null, lastRoute=null;
try{
  map = new maplibregl.Map({container:'map',center:[69.9,40.0],zoom:6.6,attributionControl:true,cooperativeGestures:false,dragRotate:false,
    style:{version:8,glyphs:'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',
      sources:{base:{type:'raster',tiles:tilesFor(CUR),tileSize:256,attribution:'© OpenStreetMap © CARTO'}},
      layers:[{id:'bg',type:'background',paint:{'background-color':THEMES[CUR].bg}},{id:'base',type:'raster',source:'base',paint:{'raster-opacity':1}}]}});
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-left');
  map.touchZoomRotate.disableRotation();
}catch(e){ console.warn('map init failed',e); }

function addVector(){
  if(!map||map.getSource('pm'))return;
  try{ map.addSource('pm',{type:'vector',url:'pmtiles://'+ORIGIN+'/tiles/basemap.pmtiles',attribution:'© OpenStreetMap, Protomaps'}); }catch(e){ return; }
  const c=VMAP[THEMES[CUR].vk], vis=BMAP==='vector'?'visible':'none';
  const L4=[['v-earth','fill','earth',{'fill-color':c.earth}],['v-landuse','fill','landuse',{'fill-color':c.landuse}],
    ['v-water','fill','water',{'fill-color':c.water}],['v-roads','line','roads',{'line-color':c.road,'line-width':['interpolate',['linear'],['zoom'],6,0.4,12,1.4]}],
    ['v-bld','fill','buildings',{'fill-color':c.bld,'fill-opacity':0.6}]];
  L4.forEach(d=>{ if(!map.getLayer(d[0])) map.addLayer({id:d[0],type:d[1],source:'pm','source-layer':d[2],paint:d[3],layout:{visibility:vis}},'pts'); });
  if(!map.getLayer('v-places')) map.addLayer({id:'v-places',type:'symbol',source:'pm','source-layer':'places',layout:{'text-field':['coalesce',['get','name:ru'],['get','name']],'text-size':11,'text-font':['Noto Sans Regular'],visibility:vis},paint:{'text-color':c.place,'text-halo-color':THEMES[CUR].bg,'text-halo-width':1.2}},'pts');
}
function vLayers(){return ['v-earth','v-landuse','v-water','v-roads','v-bld','v-places'];}
function updateVectorColors(){ if(!map||!map.getSource('pm'))return; const c=VMAP[THEMES[CUR].vk];
  const set=(id,pr,v)=>{if(map.getLayer(id))map.setPaintProperty(id,pr,v);};
  set('v-earth','fill-color',c.earth); set('v-landuse','fill-color',c.landuse); set('v-water','fill-color',c.water);
  set('v-roads','line-color',c.road); set('v-bld','fill-color',c.bld); set('v-places','text-color',c.place);
  set('v-places','text-halo-color',THEMES[CUR].bg);
}
function setBasemap(kind){
  BMAP=kind; localStorage.setItem('kontur_bmap',kind);
  bmaps.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.bmap===kind));
  if(!map)return; addVector(); const vis=kind==='vector';
  if(map.getLayer('base')) map.setLayoutProperty('base','visibility',vis?'none':'visible');
  vLayers().forEach(id=>{ if(map.getLayer(id)) map.setLayoutProperty(id,'visibility',vis?'visible':'none'); });
}

if(map) map.on('load',()=>{
  const w=nW();
  map.addSource('pts',{type:'geojson',data:{type:'FeatureCollection',features:features(w)}});
  map.addLayer({id:'pts',type:'circle',source:'pts',paint:{'circle-radius':['get','r'],'circle-color':['get','color'],'circle-opacity':0.9,'circle-stroke-width':1.4,'circle-stroke-color':THEMES[CUR].stroke}});
  map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'route-line',type:'line',source:'route',filter:['==','$type','LineString'],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['case',['has','color'],['get','color'],THEMES[CUR].route],'line-width':4,'line-opacity':0.85}});
  map.addLayer({id:'route-stop',type:'circle',source:'route',filter:['==','$type','Point'],paint:{'circle-radius':13,'circle-color':['case',['has','color'],['get','color'],THEMES[CUR].route],'circle-stroke-width':2,'circle-stroke-color':'#FFFFFF'}});
  map.addLayer({id:'route-num',type:'symbol',source:'route',filter:['==','$type','Point'],layout:{'text-field':['get','n'],'text-size':12,'text-font':['Noto Sans Bold','Open Sans Bold']},paint:{'text-color':'#FFFFFF','text-halo-color':'rgba(0,0,0,.45)','text-halo-width':1.3}});
  map.on('click','pts',e=>popup(e.features[0].properties));
  map.on('mouseenter','pts',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','pts',()=>map.getCanvas().style.cursor='');
  setBasemap(BMAP); refresh(); drawRoute(DATA.route);
});
function popup(p){ if(!map)return; new maplibregl.Popup({maxWidth:'260px'}).setLngLat([p.lon,p.lat]).setHTML(
  `<b>${p.client}</b><br>${p.city} · ${p.partner}<br>${t('pop_debt')}: <b>${fmt(p.debt)} ₽</b><br>${t('pop_score')}: <b>${Math.round(scoreOf(p,nW()))}</b> · ${tmode(p.mode)}<br><span style="color:var(--faint)">${p.reason}</span>`).addTo(map); }

function refresh(){
  const w=nW();
  if(map&&map.getSource) map.getSource('pts')?.setData({type:'FeatureCollection',features:features(w)});
  const a=DATA.analytics;
  cards.innerHTML=[[t('c_work'),fmt(a.people-a.dropped),t('c_of')+' '+fmt(a.people)],[t('c_debt'),fmt(Math.round(a.debt_active/1000))+'к','₽'],
    [t('c_scout'),fmt(a.mode_split['разведка']||0),t('c_scout_s')],[t('c_press'),fmt(a.mode_split['дожим']||0),t('c_press_s')]]
    .map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]} <small>${c[2]}</small></div></div>`).join('');
  const ranked=DATA.points.filter(p=>!p.dropped).map(p=>({...p,sc:scoreOf(p,w)})).sort((x,y)=>y.sc-x.sc).slice(0,14);
  list.innerHTML=ranked.map(p=>`<div class="row" data-rep="${p.rep}"><span class="dot" style="background:${colorFor(p,p.sc)}"></span><span class="nm">${p.client}<div class="meta">${p.city} · ${fmt(p.debt)} ₽ · ${tmode(p.mode)}</div></span><span class="sc">${Math.round(p.sc)}</span></div>`).join('');
  list.querySelectorAll('.row').forEach(r=>r.onclick=()=>{const p=DATA.points.find(x=>x.rep===r.dataset.rep);if(map)map.flyTo({center:[p.lon,p.lat],zoom:12});popup(p);if(window.innerWidth<=760){side.classList.remove('open');setChev();}});
}
function renderLegend(){const T=THEMES[CUR];legend.innerHTML=`<div style="font-weight:600;margin-bottom:5px">${t('lg_title')}</div>
  <div class="g"><span class="dot" style="background:${T.prio[2]}"></span> ${t('lg_hi')}</div><div class="g"><span class="dot" style="background:${T.prio[1]}"></span> ${t('lg_mid')}</div>
  <div class="g"><span class="dot" style="background:${T.prio[0]}"></span> ${t('lg_lo')}</div><div class="g"><span class="dot" style="background:${T.drop}"></span> ${t('lg_drop')}</div>
  <div class="g" style="margin-top:4px;color:var(--faint)">${t('lg_size')}</div>`;}

async function buildDay(){
  route_btn.textContent=t('building'); const w=nW();
  try{
    if(AGENTS>1){ const q=new URLSearchParams({agents:AGENTS,audience:AUD,wd:wd.value,wc:wc.value,wf:wf.value,limit:'18'});
      const r=await fetch('api/plan?'+q.toString()); if(!r.ok)throw 0; drawPlan(await r.json());
    } else { const q=new URLSearchParams({audience:AUD,wd:wd.value,wc:wc.value,wf:wf.value,limit:'10'});
      const r=await fetch('api/route?'+q.toString()); if(!r.ok)throw 0; drawRoute(await r.json()); }
  }catch(e){ buildDayLocal(w); }
  route_btn.textContent=t('build');
}
function hav(a,b){const R=6371,r=x=>x*Math.PI/180,dp=r(b[1]-a[1]),dl=r(b[0]-a[0]);const h=Math.sin(dp/2)**2+Math.cos(r(a[1]))*Math.cos(r(b[1]))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function buildDayLocal(w){
  const city=DATA.analytics.route_city;
  let cand=DATA.points.filter(p=>!p.dropped&&p.city===city).map(p=>({...p,sc:scoreOf(p,w)})).sort((x,y)=>y.sc-x.sc).slice(0,10);
  if(cand.length<2){drawRoute(null);return;}
  let pts=cand.map(p=>[p.lon,p.lat]),used=new Set([0]),order=[0];
  while(order.length<pts.length){let last=pts[order[order.length-1]],best=-1,bd=1e9;pts.forEach((q,i)=>{if(!used.has(i)){const d=hav(last,q);if(d<bd){bd=d;best=i;}}});used.add(best);order.push(best);}
  let km=0;for(let i=0;i<order.length-1;i++)km+=hav(pts[order[i]],pts[order[i+1]]);
  const min=Math.round(km/30*60*1.15),debt=cand.reduce((s,p)=>s+p.debt,0);
  drawRoute({stops_xy:order.map(i=>pts[i]),line:order.map(i=>pts[i]),km:Math.round(km*10)/10,minutes:min,debt_sum:debt,matrix_src:'haversine',city});
}
function drawRoute(rt){
  if(!map)return; lastRoute={single:rt};
  if(!rt||!rt.line||!rt.line.length){map.getSource('route')?.setData({type:'FeatureCollection',features:[]});rinfo.style.display='none';return;}
  const stops=rt.stops_xy&&rt.stops_xy.length?rt.stops_xy:rt.line;
  const feats=[{type:'Feature',geometry:{type:'LineString',coordinates:rt.line},properties:{}}];
  stops.forEach((c,i)=>feats.push({type:'Feature',geometry:{type:'Point',coordinates:c},properties:{n:String(i+1)}}));
  map.getSource('route').setData({type:'FeatureCollection',features:feats});
  rinfo.style.display='block';
  rinfo.innerHTML=`<div style="color:var(--faint);font-size:10px;text-transform:uppercase">${t('r_title')} · ${rt.city||DATA.analytics.route_city}</div>
    <div class="big">${stops.length} ${t('r_pts')} · ${rt.km} ${t('km')}</div><div>${t('r_drive')} ≈ <b>${rt.minutes} ${t('min')}</b></div>
    <div class="note">${t('r_note')}</div><div style="margin-top:4px">${t('r_debt')}: <b>${fmt(rt.debt_sum)} ₽</b></div>`;
  const b=new maplibregl.LngLatBounds();rt.line.forEach(c=>b.extend(c));map.fitBounds(b,{padding:{top:90,bottom:window.innerWidth<=760?90:60,left:60,right:60},maxZoom:13});
}
function drawPlan(plan){
  if(!map)return; lastRoute={plan:plan}; const ag=plan.agents||[];
  if(!ag.length){drawRoute(null);return;}
  const feats=[];
  ag.forEach(a=>{ feats.push({type:'Feature',geometry:{type:'LineString',coordinates:a.line},properties:{color:a.color}});
    (a.stops_xy||[]).forEach((c,i)=>feats.push({type:'Feature',geometry:{type:'Point',coordinates:c},properties:{n:String(i+1),color:a.color}})); });
  map.getSource('route').setData({type:'FeatureCollection',features:feats});
  rinfo.style.display='block';
  const rows=ag.map(a=>`<div style="display:flex;align-items:center;gap:6px;margin-top:3px"><span style="width:10px;height:10px;border-radius:50%;background:${a.color};display:inline-block;flex:none"></span>${t('br_a')}${a.id}: ${a.count} ${t('r_pts')} · ${a.km} ${t('km')} · ${a.minutes} ${t('min')}</div>`).join('');
  rinfo.innerHTML=`<div style="color:var(--faint);font-size:10px;text-transform:uppercase">${t('br_title')} · ${plan.city}</div>
    <div class="big">${plan.n} ${t('br_agents')} · ${plan.km} ${t('km')}</div><div>${t('br_parallel')} ≈ <b>${plan.minutes} ${t('min')}</b></div>
    <div class="note">${t('r_note')}</div><div style="margin-top:4px">${t('r_debt')}: <b>${fmt(plan.debt_sum)} ₽</b></div>
    <div style="margin-top:6px;border-top:1px solid var(--line);padding-top:5px">${rows}</div>`;
  const b=new maplibregl.LngLatBounds();ag.forEach(a=>a.line.forEach(c=>b.extend(c)));if(!b.isEmpty())map.fitBounds(b,{padding:{top:90,bottom:window.innerWidth<=760?90:60,left:60,right:60},maxZoom:13});
}

function applyTheme(name){
  CUR=name; localStorage.setItem('kontur_theme',name); document.documentElement.dataset.theme=name;
  themes.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.theme===name));
  const T=THEMES[name];
  if(map&&map.getSource('base')){ map.getSource('base').setTiles(tilesFor(name)); map.setPaintProperty('bg','background-color',T.bg);
    if(map.getLayer('pts'))map.setPaintProperty('pts','circle-stroke-color',T.stroke);
    if(map.getLayer('route-line'))map.setPaintProperty('route-line','line-color',['case',['has','color'],['get','color'],T.route]);
    if(map.getLayer('route-stop'))map.setPaintProperty('route-stop','circle-color',['case',['has','color'],['get','color'],T.route]);
    updateVectorColors();
  }
  refresh(); renderLegend();
}
function applyLang(lang){
  LNG=lang; localStorage.setItem('kontur_lang',lang);
  langs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  refresh(); renderLegend();
  if(lastRoute&&lastRoute.plan)drawPlan(lastRoute.plan); else if(lastRoute&&lastRoute.single)drawRoute(lastRoute.single);
}

['wd','wc','wf'].forEach(id=>$(id).oninput=refresh);
route_btn.onclick=buildDay; clear_btn.onclick=()=>{drawRoute(null);};
document.querySelectorAll('#aud button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#aud button').forEach(x=>x.classList.remove('on'));b.classList.add('on');AUD=b.dataset.a;});
brig.querySelectorAll('button').forEach(b=>b.onclick=ev=>{ev.stopPropagation();brig.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');AGENTS=+b.dataset.agents;});
themes.querySelectorAll('button').forEach(b=>b.onclick=ev=>{ev.stopPropagation();applyTheme(b.dataset.theme);});
langs.querySelectorAll('button').forEach(b=>b.onclick=ev=>{ev.stopPropagation();applyLang(b.dataset.lang);});
bmaps.querySelectorAll('button').forEach(b=>b.onclick=ev=>{ev.stopPropagation();setBasemap(b.dataset.bmap);});
function setChev(){chev.textContent=side.classList.contains('open')?'▼':'▲';}
brandrow.onclick=()=>{ if(window.innerWidth<=760){ side.classList.toggle('open'); setChev(); } };
{const h=location.hash;if(/grafit/.test(h))CUR='grafit';else if(/sumrak/.test(h))CUR='sumrak';if(/lang=uz/.test(h))LNG='uz';else if(/lang=tg/.test(h))LNG='tg';if(/vector/.test(h))BMAP='vector';if(/ag=2/.test(h))AGENTS=2;else if(/ag=3/.test(h))AGENTS=3;}
bmaps.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.bmap===BMAP));
brig.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.agents===AGENTS));
sub.textContent=`${t('sub')} · ${DATA.generated_at}`;
applyTheme(CUR); applyLang(LNG); setChev();
if(/open/.test(location.hash)){ side.classList.add('open'); setChev(); }
if(/plan/.test(location.hash)){ if(AGENTS<2)AGENTS=2; setTimeout(buildDay,1200); }
</script>
