<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'"><meta name="color-scheme" content="light"><title>CRM СНГ</title><link rel="stylesheet" href="app.css"></head>
<body><aside id="rail"><div class="brand">Взыскание</div><nav id="navigation" aria-label="Разделы"></nav><footer><div id="identity"></div><div id="version"></div></footer></aside><main>

  <div id="crm-update" hidden>

    <button id="crm-update-install" hidden>ПЕРЕЗАГРУЗИТЬ ПРИЛОЖЕНИЕ</button>
    <button id="crm-update-dismiss" aria-label="Закрыть состояние обновления" hidden>×</button>
  </div>
</header>
<div id="notice" role="status"></div><section id="view"></section></main><dialog id="dialog"></dialog><script src="app.js"></script></body></html>
