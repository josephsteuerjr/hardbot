<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5">
<title>Маршрут</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="https://cdn.jsdelivr.net/npm/protomaps-themes-base@4.4.0/dist/protomaps-themes-base.js"></script>
<style>
:root{
  --bg:#FAF9F5; --card:#FFFFFF; --alt:#F5F4ED; --border:#E6E2D9;
  --text:#2B2825; --muted:#6B6660; --accent:#36332E; --accent2:#46423B;
  --success:#5B8A3C; --danger:#B0472C; --navblue:#2F6FED;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45}
body.navon{overflow:hidden}
.ico{display:inline-flex;flex:0 0 auto;width:18px;height:18px}
.ico svg{width:100%;height:100%;display:block}
.bar{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font-weight:600;letter-spacing:.3px}
/* Индикатор оффлайна / очереди отправки (данные кэшируются, визиты — в очередь). */
.offbar{display:none;align-items:center;gap:8px;padding:7px 14px;font-size:12.5px;
  background:#FBEED9;color:#7A5A1E;border-bottom:1px solid #EBD9B5;position:sticky;top:49px;z-index:4}
.offbar.on{display:flex}
.offbar .d{width:7px;height:7px;border-radius:50%;background:#C9852A;flex:0 0 auto}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--border);background:var(--card);border-radius:20px;
  padding:4px 10px;font-size:12px;color:var(--muted);font-family:inherit}
.langs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.wrap{padding:12px 14px 96px;max-width:520px;margin:0 auto}
.muted{color:var(--muted)}
.searchwrap{position:relative;margin-bottom:10px}
.searchwrap .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border);border-radius:10px;
  background:var(--card);font-size:15px;font-family:inherit;margin:0;color:var(--text)}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;
  box-shadow:0 1px 2px rgba(43,40,37,.04);transition:transform .1s}
.pcard:active{transform:scale(.98)}
.pinfo{flex:1;min-width:0}
.pchev{color:var(--border);flex:0 0 auto}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--border)}
.dot.v{background:var(--success)}
.pname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:12px;color:var(--muted)}
.pamt{margin-left:auto;font-weight:500;white-space:nowrap}
.back{border:none;background:none;color:var(--muted);font-size:14px;padding:0;font-family:inherit;
  margin-bottom:8px;display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.h{font-size:18px;font-weight:600;margin:2px 0 2px}
.tabs{display:flex;gap:6px;margin:12px 0;overflow:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:1 0 auto;border:1px solid var(--border);background:var(--card);border-radius:10px;
  padding:9px 10px;font-size:13px;color:var(--text);font-family:inherit;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent);
  box-shadow:0 2px 8px rgba(43,40,37,.18)}
.panel{display:none} .panel.on{display:block;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--alt);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)} .kv .v{text-align:right;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--success);font-weight:500}
.pill.n{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:13px;border:1px solid var(--border);border-radius:11px;background:var(--card);
  color:var(--text);font-size:15px;font-family:inherit;font-weight:500;cursor:pointer}
.btn.acc{background:var(--accent);color:var(--bg);border:none}
.btn.ghost{background:transparent}
.btn.line{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.providers{display:flex;gap:8px;margin-bottom:10px}
.providers a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:1px solid var(--border);border-radius:12px;padding:8px 4px;font-size:11px;
  color:var(--text);text-decoration:none;background:var(--alt)}
.providers a .ico{width:18px;height:18px;color:var(--muted)}
.mapwrap{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;
  background:var(--card);position:relative}
.map{height:220px;background:var(--alt)}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none}
.geobadge{position:absolute;top:10px;left:10px;z-index:4;display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:16px;padding:5px 10px 5px 8px;
  font-size:11px;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.geobadge .ico{width:13px;height:13px}
.fab{position:absolute;right:10px;bottom:10px;z-index:4;display:flex;align-items:center;gap:7px;
  background:var(--accent);color:#fff;border:none;border-radius:24px;padding:11px 18px 11px 13px;
  font-size:14px;font-weight:600;font-family:inherit;box-shadow:0 4px 14px rgba(43,40,37,.32);cursor:pointer}
.fab .ico{width:18px;height:18px}
label.fld{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
select,textarea{width:100%;padding:13px 12px;border:1px solid var(--border);border-radius:11px;
  background:var(--card);font-size:15px;font-family:inherit;color:var(--text)}
textarea{min-height:64px;resize:vertical}
/* --- Форма визита: секции-карточки, крупные тач-таргеты (заполнение на телефоне в поле) --- */
.fsec{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:6px 14px 14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(43,40,37,.04)}
.fsec-h{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);margin:12px 0 2px}
.fsec.key{border-color:var(--accent);box-shadow:0 2px 10px rgba(43,40,37,.10)}
.fsec.key .fsec-h{color:var(--accent)}
.fsec select{min-height:50px}
.btn.acc.big{padding:16px;font-size:16px;font-weight:600;border-radius:14px;
  box-shadow:0 4px 14px rgba(43,40,37,.22)}
.draftrow{display:flex;align-items:center;gap:7px;font-size:12.5px;margin:2px 2px 0}
.draftrow .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.cdcard{font-size:13px;border-bottom:1px solid var(--alt);padding:8px 0}
.cdcard:last-child{border-bottom:none}
.cdcard .t{font-weight:500;margin-bottom:2px}
.cdhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.cdhead .t{margin-bottom:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdsum{font-weight:600;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--accent);
  color:var(--bg);padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.center{text-align:center;color:var(--muted);padding:40px 16px}
.opt{display:flex;gap:8px;margin:6px 0 2px}
.opt button{flex:1 1 0;border:1px solid var(--border);background:var(--card);border-radius:10px;
  padding:10px;font-size:14px;font-family:inherit;color:var(--text)}
.opt button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.toolbtn{border:1px solid var(--border);background:var(--card);border-radius:20px;
  padding:5px 12px;font-size:12px;color:var(--muted);font-family:inherit}
.mk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--alt);font-size:13px}
.mk:last-child{border-bottom:none}
.mkdot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:0 0 auto}

/* --- нижняя навигация (как в нативном приложении) --- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;
  background:rgba(250,249,245,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--border);padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px))}
.bottomnav-inner{display:flex;max-width:520px;margin:0 auto}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;font-family:inherit;color:var(--muted);font-size:11px;padding:5px 0;cursor:pointer}
.bottomnav button.on{color:var(--accent);font-weight:600}
.bottomnav button .ico{width:21px;height:21px}

/* --- полноэкранный режим навигации («Поехать») --- */
.navmode{position:fixed;inset:0;background:var(--bg);z-index:100;display:none}
.navmode.on{display:block}
.navmap{position:absolute;inset:0}
.navexit,.navrecenter{position:absolute;z-index:6;border:none;font-family:inherit;cursor:pointer;
  background:rgba(25,22,19,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#fff;border-radius:22px;box-shadow:0 4px 16px rgba(0,0,0,.28)}
.navexit{top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;display:flex;align-items:center;
  gap:6px;padding:9px 16px 9px 11px;font-size:13px;font-weight:500}
.navexit .ico{width:16px;height:16px}
.navrecenter{top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;padding:0}
.navrecenter .ico{width:19px;height:19px}
.navrecenter.hot{background:var(--navblue)}
.navsheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--card);
  border-radius:20px 20px 0 0;padding:10px 18px calc(16px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.navhandle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px}
.navtop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
.navdist{font-size:27px;font-weight:700;line-height:1.1;letter-spacing:-.3px}
.navsub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:54vw}
.naveta{font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;padding-bottom:3px}
.navbanner{display:flex;align-items:center;gap:8px;background:var(--alt);border-radius:10px;
  padding:9px 10px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.navbanner .ico{width:15px;height:15px;flex:0 0 auto;color:var(--danger)}
.navme{width:30px;height:30px;color:var(--navblue);filter:drop-shadow(0 1px 4px rgba(0,0,0,.45))}
.navme svg{width:100%;height:100%;display:block}
</style>
</head>

<div class="bottomnav" id="bottomnav"><div class="bottomnav-inner" id="bottomnavInner"></div></div>
<div class="navmode" id="navmode"></div>
<div class="toast" id="toast"></div>

// --- Оффлайн-хранилище (IndexedDB) -----------------------------------------
// Снимок портфеля (kv:bootstrap) + полные карточки (cards) + исходящая очередь
// операций (queue). Даёт заполнение визита в поле без сети с досылом при связи.
// Всё обёрнуто в try/catch: если IndexedDB недоступен (приватный режим/запрет) —
// онлайн-путь не страдает, просто нет оффлайна.
const IDB = (()=>{
  let _db=null;
  function open(){
    if(_db) return Promise.resolve(_db);
    return new Promise((resolve,reject)=>{
      let req; try{ req=indexedDB.open("hardbot",1); }catch(e){ return reject(e); }
      req.onupgradeneeded=()=>{ const d=req.result;
        if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
        if(!d.objectStoreNames.contains("cards")) d.createObjectStore("cards");
        if(!d.objectStoreNames.contains("queue")) d.createObjectStore("queue",{keyPath:"op_id"});
      };
      req.onsuccess=()=>{ _db=req.result; resolve(_db); };
      req.onerror=()=>reject(req.error);
    });
  }
  const store=(name,mode)=>open().then(d=>d.transaction(name,mode).objectStore(name));
  const p=(req)=>new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
  return {
    get:(s,k)=>store(s,"readonly").then(o=>p(o.get(k))),
    put:(s,v,k)=>store(s,"readwrite").then(o=>p(k===undefined?o.put(v):o.put(v,k))),
    del:(s,k)=>store(s,"readwrite").then(o=>p(o.delete(k))),
    all:(s)=>store(s,"readonly").then(o=>p(o.getAll())),
  };
})();

// uuid для идемпотентного op_id операций очереди (crypto, с запасным вариантом).
function uuid(){
  try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return "op-"+Date.now()+"-"+Math.random().toString(16).slice(2);
}
function hhmm(dt){ return String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0"); }

}

// Индикатор оффлайна / очереди. Обновляется на каждом основном экране (setBottomNav).
async function updateOffBar(){
  const e=$("offbar"); if(!e) return;
  let qn=0; try{ qn=((await IDB.all("queue"))||[]).length; }catch(_){}
  const off = STATE.online===false;
  if(!off && !qn){ e.className="offbar"; e.innerHTML=""; return; }
  let msg;
  if(off){ const snap=await loadBootstrapSnapshot();
    const at=snap&&snap.at?new Date(snap.at):null;
    msg="Оффлайн"+(at?" · данные на "+hhmm(at):""); }
  else msg="Отправляю…";
  if(qn) msg+=" · "+qn+" ждут отправки";
  e.className="offbar on";
  e.innerHTML=`<span class="d"></span><span>${esc(msg)}</span>`;
}

function authHeaders(){
  const h = {};
  if (TG && TG.initData) h["X-Init-Data"] = TG.initData;
  const dev = new URLSearchParams(location.search).get("dev_uid");
  if (dev) h["X-Dev-Uid"] = dev;
  return h;
}
async function api(path, opts){
  opts = opts || {};
  const h = authHeaders(); h["Content-Type"] = "application/json";
  const r = await fetch(path, Object.assign({}, opts, {headers:h}));
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function boot(){
  renderLangs(); hideBottomNav();
  try{
    const d = await api("/api/bootstrap");
    STATE.lang=d.lang||STATE.lang; renderLangs();
    if(d.needsOnboarding){ STATE.onb=d; renderOnboarding(); return; }
    STATE.meta=d.meta; STATE.persons=d.persons; STATE.kind=d.kind||"agent";
    STATE.online=true;
    cacheBootstrap(d);            // снимок портфеля для оффлайна (в фоне, не блокирует UI)
    renderList();
    warmCards();                  // полные карточки всех клиентов в фон-кэш (онлайн)
  }catch(e){
    // Нет сети / нет доступа — поднимаемся из оффлайн-снимка портфеля, если он есть.
    const snap = await loadBootstrapSnapshot();
    if(snap && snap.persons){
      STATE.lang=snap.lang||STATE.lang; renderLangs();
      STATE.meta=snap.meta; STATE.persons=snap.persons; STATE.kind=snap.kind||"agent";
      STATE.online=false;
      renderList();
    }else{
      $("app").innerHTML = `<div class="center">Нет доступа.<br><span class="muted">Откройте через бота при интернете хотя бы раз.</span></div>`;
    }
  }
}

// --- Карта (MapLibre GL). Базовый слой — растровый OSM; пин — наш.
// Самохостинг вектора (Protomaps PMTiles) подключается заменой RASTER_STYLE.
let MAP=null, PROTO_REG=false;
const RASTER_STYLE={version:8,sources:{osm:{type:"raster",
  tiles:["https://a.tile.openstreetmap.org/{z}/{x}/{y}.png","https://b.tile.openstreetmap.org/{z}/{x}/{y}.png"],
  tileSize:256,maxzoom:19,attribution:"© OpenStreetMap"}},
  layers:[{id:"osm",type:"raster",source:"osm"}]};
function removeMap(){ if(MAP){ try{MAP.remove();}catch(e){} MAP=null; } }
// Наш вектор-тайлсет (Protomaps PMTiles), если подложен на сервере; иначе растр.
function vectorStyle(url){
  if(!PROTO_REG){ maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile); PROTO_REG=true; }
  const ptb=window.protomaps_themes_base;
  const layers = ptb.layers ? ptb.layers("protomaps","light","ru") : ptb.default("protomaps","light");
  return {version:8,
    glyphs:"https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
    sprite:"https://protomaps.github.io/basemaps-assets/sprites/v4/light",
    sources:{protomaps:{type:"vector",url:"pmtiles://"+location.origin+url,attribution:"© OpenStreetMap"}},
    layers};
}
function geoHint(d,t){
  const g=d.geo&&d.geo.lat; if(!g) return t.none;
  return d.geo.src==="geonames"?t.approx:(d.geo.src==="manual"?t.manualpt:t.exact);
}
function initMap(){
  const el=$("map"); if(!el||!window.maplibregl) return;
  const d=STATE.cur, g=d.geo&&d.geo.lat;
  const lat=g?d.geo.lat:41.311, lon=g?d.geo.lon:69.240;
  removeMap();
  let style=RASTER_STYLE;
  const vt=STATE.meta&&STATE.meta.vectorTiles;
  if(vt&&window.pmtiles&&window.protomaps_themes_base){ try{ style=vectorStyle(vt); }catch(e){} }
  MAP=new maplibregl.Map({container:el,style,center:[lon,lat],zoom:g?15:9,
    attributionControl:false,dragRotate:false});
  let fellBack=false;
  MAP.on("error",()=>{ if(!fellBack&&style!==RASTER_STYLE){ fellBack=true; try{MAP.setStyle(RASTER_STYLE);}catch(e){} } });
  MAP.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
  if(g) new maplibregl.Marker({color:"#B0472C"}).setLngLat([lon,lat]).addTo(MAP);
}

// --- Карта всех моих клиентов: цвет точки = приоритет выезда, тап → карточка ---
function priColor(s){
  if(s==null) return "#9b9b9b";
  if(s>=92) return "#B0472C";   // ехать первым
  if(s>=82) return "#C9852A";   // высокий
  if(s>=70) return "#6E8F3F";   // средний
  return "#9bb08a";             // ниже
}
// Маршрут дня: едем по городам (где суммарно «жирнее»), внутри города — по приоритету.
// Так нет зигзагов между городами Сугда (они далеко друг от друга).
function routeOrder(pts){
  const sc=p=>(p.score==null?-1:p.score), byCity={};
  pts.forEach(p=>{ const c=p.city||"—"; (byCity[c]=byCity[c]||[]).push(p); });
  const cities=Object.keys(byCity).sort((a,b)=>
    byCity[b].reduce((s,p)=>s+sc(p),0)-byCity[a].reduce((s,p)=>s+sc(p),0));
  const out=[];
  cities.forEach(c=>byCity[c].sort((a,b)=>sc(b)-sc(a)).forEach(p=>out.push(p)));
  return out;
}
function renderMap(){
  flushDraft(); stopAutoSync();
  STATE.cur=null; removeMap();
  const t=L();
  const pts=STATE.persons.filter(p=>p.lat!=null&&p.lon!=null);
  $("app").innerHTML=`<div class="muted" style="margin-bottom:8px">${t.onmap}: ${pts.length}/${STATE.persons.length}</div>
     <div id="map" style="height:calc(100vh - 230px);min-height:320px;border-radius:14px;overflow:hidden"></div>`;
  setTimeout(()=>initClientsMap(pts),0);
  setBottomNav("map");
}
function initClientsMap(pts){
  const el=$("map"); if(!el||!window.maplibregl) return;
  removeMap();
  let style=RASTER_STYLE; const vt=STATE.meta&&STATE.meta.vectorTiles;
  if(vt&&window.pmtiles&&window.protomaps_themes_base){ try{ style=vectorStyle(vt);}catch(e){} }
  const c=pts.length?[pts[0].lon,pts[0].lat]:[69.6,40.2];
  MAP=new maplibregl.Map({container:el,style,center:c,zoom:8,attributionControl:false,dragRotate:false});
  let fb=false;
  MAP.on("error",()=>{ if(!fb&&style!==RASTER_STYLE){fb=true;try{MAP.setStyle(RASTER_STYLE);}catch(e){}} });
  MAP.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
  const route=routeOrder(pts);
  const b=new maplibregl.LngLatBounds();
  route.forEach((p,i)=>{
    const m=document.createElement("div");
    m.style.cssText="width:24px;height:24px;border-radius:50%;border:2px solid #fff;cursor:pointer;"+
      "box-shadow:0 0 0 1px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;"+
      "font:600 11px/1 system-ui,sans-serif;color:#fff;background:"+priColor(p.score);
    m.textContent=(i+1);
    m.title=p.client+(p.score!=null?(" · "+p.score):"");
    m.onclick=()=>openP(p.rep);
    new maplibregl.Marker({element:m,anchor:"center"}).setLngLat([p.lon,p.lat]).addTo(MAP);
    b.extend([p.lon,p.lat]);
  });
  if(route.length>1){
    const line={type:"Feature",geometry:{type:"LineString",coordinates:route.map(p=>[p.lon,p.lat])}};
    MAP.on("load",()=>{ try{
      MAP.addSource("route",{type:"geojson",data:line});
      MAP.addLayer({id:"route",type:"line",source:"route",
        layout:{"line-cap":"round","line-join":"round"},
        paint:{"line-color":"#36332E","line-width":2,"line-dasharray":[2,1.6],"line-opacity":0.55}});
    }catch(e){} });
  }
  if(route.length){ try{ MAP.fitBounds(b,{padding:54,maxZoom:13}); }catch(e){} }
}

// Долг человека одним числом существует, только если валюта одна: портфель ЗК — в сумах,
// Делимобиль — в рублях. Смешанному человеку показываем обе суммы, а не их сумму.
function totalStr(d){

// Разбивка приходит с сервера готовой: подписи локализованы (было — ключи БД,
// «camera_fine»), суммы — числа, состав статей зависит от контрагента

// пошлина), нулевые статьи отфильтрованы. См. hardbot/debt.py.
function panelDebt(d,t){
  const cds = d.contracts.map(c=>`
    <div class="cdcard">
      <div class="cdhead">
        <span class="t">${esc(c.partner||"—")} · ${esc(c.contract_id)}</span>

      </div>
      ${c.debt.map(a=>
        `<div class="kv"><span class="k">${esc(a.title)}</span><span class="v">${money(a.value,c.unit)}</span></div>`
      ).join("") || `<div class="muted" style="font-size:12.5px;padding:5px 0">${t.nosplit}</div>`}
    </div>`).join("");
  const pr = d.promise.filter(r=>r.value&&r.value!=="—").map(r=>
    `<div class="kv"><span class="k">${esc(r.title)}</span><span class="v">${esc(String(r.value))}</span></div>`).join("");
  return `<div class="box"><div class="muted" style="margin-bottom:6px">${t.total}: <b>${totalStr(d)}</b></div>${cds}</div>
    ${pr?`<div class="box"><div class="muted" style="margin-bottom:4px">${t.promise}</div>${pr}</div>`:""}`;
}
// Одно поле-выпадашка. Контрол остаётся <select> (мобильный нативный пикер удобен для
// длинных вариантов), автосохранение и восстановление работают по data-k без изменений.
function formField(f){
  const opts=(STATE.meta.dropdowns[f.key]||[]).map(o=>
    `<option value="${esc(o.value)}" ${o.value===f.current?"selected":""}>${esc(o.label)}</option>`).join("");
  return `<label class="fld">${esc(f.title)}</label>
    <select data-k="${f.key}"><option value="">—</option>${opts}</select>`;
}
function panelForm(d,t){
  const byKey={}; d.form.forEach(f=>{ byKey[f.key]=f; });
  const grp=keys=>keys.map(k=>byKey[k]?formField(byKey[k]):"").join("");
  const known=new Set(["call_status","contact_with","who_at_address","client_location","purpose_rf","agreed_payment"]);
  const rest=d.form.filter(f=>!known.has(f.key)).map(formField).join("");   // на случай новых полей с сервера
  const sec=(cls,head,inner)=>inner?`<div class="fsec ${cls}"><div class="fsec-h">${head}</div>${inner}</div>`:"";
  return `
    ${sec("key",t.secResult,grp(["call_status"]))}
    ${sec("",t.secContact,grp(["contact_with","who_at_address"]))}
    ${sec("",t.secClient,grp(["client_location","purpose_rf"]))}
    ${sec("",t.secAgree,grp(["agreed_payment"])+rest)}
    <div class="fsec"><div class="fsec-h">${t.comment}</div>
      <label class="fld">${t.comment}</label><textarea id="f_call_comment">${esc(d.call_comment||"")}</textarea>
      <label class="fld">${t.tips}</label><textarea id="f_tips">${esc(d.tips||"")}</textarea>
    </div>
    <div class="fsec"><div class="fsec-h">${t.photos}</div>
      <label class="btn line" style="cursor:pointer;margin-top:8px">${ic("camera")}<span>${t.addphoto}</span>
        <input type="file" accept="image/*" capture="environment" id="photo" style="display:none" onchange="upPhoto()">
      </label>
      <div class="muted" id="phc" style="font-size:12px;margin-top:6px">${t.photos}: ${d.photos||0}</div>
    </div>
    <div id="draftstat" class="draftrow" style="display:none"></div>
    <button class="btn acc big" style="margin-top:12px" onclick="saveVisit()">${ic("check")}<span>${t.save}</span></button>`;
}

// --- Ссылки на внешнюю навигацию (последняя миля — родное приложение телефона). ---
// Внутри Telegram Mini App работают только https-ссылки (свои схемы вроде yandexnavi://
// не открываются), поэтому везде — обычные https deep-link'и.
function driveLinks(d){
  const a=d.address?enc(d.address):"";
  const g=d.geo&&d.geo.lat;
  return {
    yandex: g?`https://yandex.ru/maps/?pt=${d.geo.lon},${d.geo.lat}&z=17&l=map`:`https://yandex.ru/maps/?text=${a}`,
    google: g?`https://www.google.com/maps/search/?api=1&query=${d.geo.lat},${d.geo.lon}`:`https://www.google.com/maps/search/?api=1&query=${a}`,
    twogis: `https://2gis.ru/search/${a}`,
  };
}
function providerChips(d){
  const l=driveLinks(d);
  return `<div class="providers">
    <a href="${l.yandex}" target="_blank" onclick="openExt(event,'${l.yandex}')">${ic("map")}<span>Я.Карты</span></a>
    <a href="${l.google}" target="_blank" onclick="openExt(event,'${l.google}')">${ic("map")}<span>Google</span></a>
    <a href="${l.twogis}" target="_blank" onclick="openExt(event,'${l.twogis}')">${ic("map")}<span>2ГИС</span></a>
  </div>`;
}
function openExt(e,url){ if(TG&&TG.openLink){ e.preventDefault(); TG.openLink(url); } }
function call(){ if(STATE.cur.phone) location.href="tel:"+STATE.cur.phone.replace(/[^+\d]/g,""); }

async function upPhoto(){
  const f=$("photo").files[0]; if(!f) return;
  const fd=new FormData(); fd.append("photo",f);
  try{
    const r=await fetch("/api/photo?rep="+enc(STATE.cur.rep),{method:"POST",headers:authHeaders(),body:fd});
    const j=await r.json(); STATE.cur.photos=j.photos; $("phc").textContent=L().photos+": "+j.photos; toast(L().saved);
  }catch(e){ toast("✕"); }
}
async function saveVisit(){
  const values=readForm();
  const rep=STATE.cur.rep;
  try{
    const j=await api("/api/save",{method:"POST",body:JSON.stringify({rep,values,finish:true})});
    STATE.cur=j.person; clearDraft(rep); draftDirty=false; stopAutoSync(); toast(L().saved);
    if(TG&&TG.HapticFeedback) TG.HapticFeedback.notificationOccurred("success");
    STATE.tab="visit"; renderDetail();
    const p=STATE.persons.find(x=>x.rep===rep); if(p) p.visited=true;
  }catch(e){ toast("✕"); }
}

// --- Автосохранение черновика формы (устойчивость к обрыву связи) ------------
// localStorage — источник истины: черновик переживает закрытие вкладки/обрыв сети.
// Раз в 20 сек тихо шлём его на сервер (POST /api/save finish:false — визит НЕ
// помечается завершённым, уведомления в группу не уходят, см. web.py _save).
// Полная очистка черновика — только после явного «Сохранить выезд» (finish:true).
let draftTimer=null, syncTimer=null, draftDirty=false;

function currentUid(){
  try{ if(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user) return TG.initDataUnsafe.user.id; }catch(e){}
  return new URLSearchParams(location.search).get("dev_uid") || "anon";
}
function draftKey(rep){ return "draft:"+currentUid()+":"+rep; }

// Значения формы из DOM — общая точка для черновика и явного «Сохранить выезд».
function readForm(){
  const values={};
  document.querySelectorAll("#panel select[data-k]").forEach(s=>{ if(s.value) values[s.dataset.k]=s.value; });
  const cc=$("f_call_comment"); if(cc&&cc.value.trim()) values.call_comment=cc.value.trim();
  const tp=$("f_tips"); if(tp&&tp.value.trim()) values.tips=tp.value.trim();
  return values;
}
function formVisible(){ return !!(STATE.cur && STATE.tab==="form" && $("f_call_comment")); }

function loadDraft(rep){ try{ const s=localStorage.getItem(draftKey(rep)); return s?JSON.parse(s):null; }catch(e){ return null; } }
function clearDraft(rep){ try{ localStorage.removeItem(draftKey(rep)); }catch(e){} }
function saveDraft(){
  if(!formVisible()) return;   // не читать DOM другой вкладки — иначе затрём черновик пустотой
  const v=readForm(), key=draftKey(STATE.cur.rep);
  try{
    if(Object.keys(v).length) localStorage.setItem(key, JSON.stringify({v, at:Date.now()}));
    else localStorage.removeItem(key);
  }catch(e){}
}
function flushDraft(){ clearTimeout(draftTimer); saveDraft(); }   // немедленно, перед уходом с формы

function onFormChange(){
  draftDirty=true;
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{ saveDraft(); markDraftBadge(true); }, 500);
}
function markDraftBadge(dirty){
  const e=$("draftstat"); if(!e) return; const t=L();
  e.style.display="flex";
  e.innerHTML=`<span class="d" style="background:${dirty?'var(--danger)':'var(--success)'}"></span>`+
    `<span class="muted">${dirty?t.draftwait:t.draftsent}</span>`;
}

// Восстановление черновика поверх серверных значений при открытии формы.
function restoreDraftIntoForm(){
  if(!STATE.cur) return;
  const d=loadDraft(STATE.cur.rep); if(!d||!d.v) return;
  let applied=false;
  Object.entries(d.v).forEach(([k,val])=>{
    let el=null;
    if(k==="call_comment") el=$("f_call_comment");
    else if(k==="tips") el=$("f_tips");
    else el=document.querySelector('#panel select[data-k="'+k+'"]');
    if(el && el.value!==val){ el.value=val; applied=true; }   // отличается от сервера → есть несинхр. правка
  });
  if(applied){ draftDirty=true; markDraftBadge(true); }
}
function setupFormDraft(){
  const p=$("panel"); if(!p) return;
  restoreDraftIntoForm();
  p.querySelectorAll('select[data-k], #f_call_comment, #f_tips').forEach(el=>{
    el.addEventListener(el.tagName==="SELECT"?"change":"input", onFormChange);
  });
  startAutoSync();
}

function startAutoSync(){ stopAutoSync(); syncTimer=setInterval(()=>{ if(draftDirty) pushDraft(); }, 20000); }
function stopAutoSync(){ if(syncTimer){ clearInterval(syncTimer); syncTimer=null; } }
async function pushDraft(){
  if(!STATE.cur) return;
  const d=loadDraft(STATE.cur.rep), values=(d&&d.v)||{};
  if(!Object.keys(values).length){ draftDirty=false; return; }
  try{
    await api("/api/save",{method:"POST",body:JSON.stringify({rep:STATE.cur.rep,values,finish:false})});
    draftDirty=false; markDraftBadge(false);   // localStorage НЕ чистим — кэш до явного finish:true
  }catch(e){}   // сеть/ошибка — черновик остаётся, повтор на следующем интервале
}

// Уход со страницы/сворачивание приложения — досрочно сохранить (и попробовать отправить).
// В мобильном WebView не гарантировано, поэтому это лишь подстраховка; истина — localStorage.
window.addEventListener("beforeunload", flushDraft);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ flushDraft(); pushDraft(); } });

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// --- Геометки: захват точки (геолокация телефона) + сохранение ---
function getLoc(){
  return new Promise((resolve,reject)=>{
    const manual=()=>{ const s=prompt("lat, lon"); if(s&&s.includes(",")){
      const [a,b]=s.split(",").map(x=>parseFloat(x.trim())); if(!isNaN(a)&&!isNaN(b)) return resolve({lat:a,lon:b}); }
      reject(new Error("denied")); };
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude}),
        ()=>manual(), {enableHighAccuracy:true,timeout:10000});
    } else manual();
  });
}
async function setMarkCase(){
  const t=L(); toast(t.getloc);
  try{
    const loc=await getLoc();
    const j=await api("/api/marker",{method:"POST",body:JSON.stringify({rep:STATE.cur.rep,lat:loc.lat,lon:loc.lon})});
    if(j.person) STATE.cur=j.person;
    if(TG&&TG.HapticFeedback) TG.HapticFeedback.notificationOccurred("success");
    toast(t.marksaved); drawPanel();
  }catch(e){ alert(t.nogeo); }
}
async function renderMarkers(){
  flushDraft(); stopAutoSync();
  removeMap(); STATE.cur=null; const t=L();
  let j={markers:[]}; try{ j=await api("/api/markers"); }catch(e){}
  const list=j.markers.length ? j.markers.map(m=>
    `<div class="mk"><span class="mkdot"></span><div>
       <div>${esc(m.label||(m.rep?("КД "+m.rep):t.standalone))}</div>
       <div class="muted" style="font-size:11px">${(+m.lat).toFixed(5)}, ${(+m.lon).toFixed(5)} · ${String(m.at||"").replace("T"," ")}</div>
     </div></div>`).join("") : `<div class="center">${t.nomarks}</div>`;
  $("app").innerHTML=`
    <div class="h">${t.marks}</div>
    <button class="btn acc" style="margin:8px 0 14px" onclick="newMarker()">${ic("plus")}<span>${t.newmark}</span></button>
    <div>${list}</div>`;
  setBottomNav("marks");
}
async function newMarker(){
  const t=L(); const label=(prompt(t.mlabel)||"").trim();
  toast(t.getloc);
  try{
    const loc=await getLoc();
    await api("/api/marker",{method:"POST",body:JSON.stringify({lat:loc.lat,lon:loc.lon,label})});
    toast(t.marksaved); renderMarkers();
  }catch(e){ alert(t.nogeo); }
}

// --- Полноэкранная навигация: «Поехать» переводит миниапп в режим навигатора. ---
// Живая геопозиция (watchPosition) + камера «по курсу» (track-up, как в обычных
// навигаторах) + линия маршрута (свой OSRM, если поднят, иначе честная прямая) +
// нижняя плашка с расстоянием/ETA. Внешние приложения (Я/Google/2ГИС) остаются
// для настоящей голосовой turn-by-turn навигации — это сознательное решение
// (см. AGENTS.md), а не недоделка: здесь — живой превью-навигатор + быстрый переход.
let NAV = {map:null, watchId:null, follow:true, lastPos:null, lastHeading:0,
           meMarker:null, destMarker:null, routeFetched:false, refreshTimer:null,
           dest:null, bannerTimeout:null};

function bearingBetween(a,b){
  const toRad=x=>x*Math.PI/180, toDeg=x=>x*180/Math.PI;
  const dLon=toRad(b.lon-a.lon);
  const y=Math.sin(dLon)*Math.cos(toRad(b.lat));
  const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(dLon);
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function haversineKm(a,b){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function navShellHTML(d,t){
  return `
    <div class="navmap" id="navmap"></div>
    <button class="navexit" onclick="exitNav()">${ic("close")}<span>${esc(t.exit)}</span></button>
    <button class="navrecenter" id="navrecenter" onclick="navRecenter()">${ic("target")}</button>
    <div class="navsheet">
      <div class="navhandle"></div>
      <div class="navtop">
        <div><div class="navdist" id="navdist">—</div><div class="navsub">${esc(d.client)}</div></div>
        <div class="naveta" id="naveta"></div>
      </div>
      <div class="navbanner" id="navbanner" style="display:none"></div>
      ${providerChips(d)}
      <button class="btn acc" onclick="navFinish()">${ic("check")}<span>${esc(t.finishvisit)}</span></button>
    </div>`;
}

function enterNav(){
  const d=STATE.cur, t=L();
  if(!(d && d.geo && d.geo.lat)){ toast(t.none); return; }
  NAV.dest={lat:d.geo.lat, lon:d.geo.lon};
  document.body.classList.add("navon");
  $("navmode").innerHTML = navShellHTML(d,t);
  $("navmode").classList.add("on");
  navShowBanner(t.getloc);
  setTimeout(()=>initNavMap(d),0);
  startNavWatch();
  NAV.bannerTimeout = setTimeout(()=>{ if(!NAV.lastPos) navShowBanner(t.nogeo); }, 8000);
  if(TG && TG.BackButton){ try{ TG.BackButton.offClick(exitNav); TG.BackButton.onClick(exitNav); TG.BackButton.show(); }catch(e){} }
}
function exitNav(){
  document.body.classList.remove("navon");
  $("navmode").classList.remove("on");
  $("navmode").innerHTML = "";
  stopNavWatch();
  if(NAV.refreshTimer){ clearInterval(NAV.refreshTimer); NAV.refreshTimer=null; }
  if(NAV.bannerTimeout){ clearTimeout(NAV.bannerTimeout); NAV.bannerTimeout=null; }
  if(NAV.map){ try{NAV.map.remove();}catch(e){} }
  NAV.map=null; NAV.meMarker=null; NAV.destMarker=null; NAV.routeFetched=false;
  NAV.lastPos=null; NAV.follow=true;
  if(TG && TG.BackButton){ try{ TG.BackButton.hide(); TG.BackButton.offClick(exitNav); }catch(e){} }
}
function navFinish(){
  exitNav();
  STATE.tab="form";
  renderDetail();
}
function navRecenter(){
  NAV.follow=true;
  const rc=$("navrecenter"); if(rc) rc.classList.remove("hot");
  if(NAV.map && NAV.lastPos){
    try{ NAV.map.easeTo({center:[NAV.lastPos.lon,NAV.lastPos.lat], bearing:NAV.lastHeading||0,
      pitch:55, zoom:Math.max(NAV.map.getZoom(),16), duration:450}); }catch(e){}
  }
}
function navShowBanner(msg){ const b=$("navbanner"); if(!b) return; b.style.display="flex"; b.innerHTML=`${ic("pin")}<span>${esc(msg)}</span>`; }
function navHideBanner(){ const b=$("navbanner"); if(b) b.style.display="none"; }

function initNavMap(d){
  const el=$("navmap"); if(!el||!window.maplibregl) return;
  let style=RASTER_STYLE; const vt=STATE.meta&&STATE.meta.vectorTiles;
  if(vt&&window.pmtiles&&window.protomaps_themes_base){ try{ style=vectorStyle(vt); }catch(e){} }
  NAV.map=new maplibregl.Map({container:el, style, center:[d.geo.lon,d.geo.lat], zoom:15,
    pitch:50, attributionControl:false, dragRotate:true});
  let fb=false;
  NAV.map.on("error",()=>{ if(!fb&&style!==RASTER_STYLE){ fb=true; try{NAV.map.setStyle(RASTER_STYLE);}catch(e){} } });
  NAV.map.on("dragstart",()=>{ NAV.follow=false; const rc=$("navrecenter"); if(rc) rc.classList.add("hot"); });
  NAV.destMarker=new maplibregl.Marker({color:"#B0472C"}).setLngLat([d.geo.lon,d.geo.lat]).addTo(NAV.map);
}

function startNavWatch(){
  if(!navigator.geolocation){ navShowBanner(L().nogeo); return; }
  NAV.watchId=navigator.geolocation.watchPosition(onNavPos, onNavPosErr,
    {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
}
function stopNavWatch(){ if(NAV.watchId!=null && navigator.geolocation){ navigator.geolocation.clearWatch(NAV.watchId); NAV.watchId=null; } }
function onNavPosErr(){ navShowBanner(L().nogeo); }

function onNavPos(p){
  if(NAV.bannerTimeout){ clearTimeout(NAV.bannerTimeout); NAV.bannerTimeout=null; }
  navHideBanner();
  const me={lat:p.coords.latitude, lon:p.coords.longitude};
  const heading=(p.coords.heading!=null && !isNaN(p.coords.heading)) ? p.coords.heading : null;
  const prev=NAV.lastPos; NAV.lastPos=me;
  if(heading!=null) NAV.lastHeading=heading;
  else if(prev) NAV.lastHeading=bearingBetween(prev, me);
  if(NAV.map){
    if(!NAV.meMarker){
      const elx=document.createElement("div"); elx.className="navme"; elx.innerHTML=ICONS.nav;
      NAV.meMarker=new maplibregl.Marker({element:elx, anchor:"center",
        rotationAlignment:"viewport", pitchAlignment:"viewport"}).setLngLat([me.lon,me.lat]).addTo(NAV.map);
    } else NAV.meMarker.setLngLat([me.lon,me.lat]);
    if(NAV.follow){
      try{ NAV.map.easeTo({center:[me.lon,me.lat], bearing:NAV.lastHeading||NAV.map.getBearing(),
        pitch:55, zoom:Math.max(NAV.map.getZoom(),16), duration:600}); }catch(e){}
    }
  }
  updateNavStats(me);
  if(!NAV.routeFetched){
    NAV.routeFetched=true;
    fetchNavRoute(me);
    NAV.refreshTimer=setInterval(()=>{ if(NAV.lastPos) fetchNavRoute(NAV.lastPos); }, 25000);
  }
}

function updateNavStats(me){
  if(!NAV.dest) return;
  const km=haversineKm(me, NAV.dest);
  const dd=$("navdist"); if(dd) dd.textContent = km<1 ? Math.round(km*1000)+" м" : km.toFixed(1)+" км";
  const minutes=Math.max(1, Math.round(km/30*60));
  const de=$("naveta"); if(de) de.textContent = "≈ "+minutes+" "+L().mins;
}

async function fetchNavRoute(me){
  try{
    const j=await api(`/api/route?rep=${enc(STATE.cur.rep)}&lat=${me.lat}&lon=${me.lon}`);
    if(j && j.line) drawNavRoute(j.line);
  }catch(e){
    if(NAV.dest) drawNavRoute([[me.lon,me.lat],[NAV.dest.lon,NAV.dest.lat]]);
  }
}
function drawNavRoute(line){
  if(!NAV.map) return;
  const data={type:"Feature",geometry:{type:"LineString",coordinates:line}};
  const draw=()=>{
    try{
      if(NAV.map.getSource("navroute")){ NAV.map.getSource("navroute").setData(data); return; }
      NAV.map.addSource("navroute",{type:"geojson",data});
      NAV.map.addLayer({id:"navroute-casing",type:"line",source:"navroute",
        layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#ffffff","line-width":9,"line-opacity":.9}});
      NAV.map.addLayer({id:"navroute",type:"line",source:"navroute",
        layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#2F6FED","line-width":5}});
    }catch(e){}
  };
  if(NAV.map.isStyleLoaded()) draw(); else NAV.map.once("load",draw);
}

boot();
</script>
