# Свойства единицы. Читается автоматически из deploy/_lib.sh.
#
# Состав здесь не фиксированный: сколько стран включено профилями, столько
# маршрутизаторов и должно работать. Оптимизатор порядка (vroom) работает
# всегда — графов он не требует.

UNIT_NAME=gps
UNIT_TITLE="маршруты по дорогам (OSRM по странам + оптимизатор порядка)"

UNIT_SERVICES="vroom"
for _country in $(env_get COMPOSE_PROFILES | tr ',' ' '); do
  case "$_country" in
    uz|tj|ru) UNIT_SERVICES="$UNIT_SERVICES osrm-$_country" ;;
  esac
done
unset _country

UNIT_NEEDS_NET=1        # сеть hard-net — по ней ядро ходит к маршрутизаторам
UNIT_NEEDS_STT_VOL=0    # к речи отношения не имеет

# Граф читается с диска лениво: контейнер поднимается за секунды, но первый
# запрос по «холодному» участку платит почти секунду. Это не поломка.
UNIT_WAIT_SECONDS=120
