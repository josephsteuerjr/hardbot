# Конфигурация оптимизатора порядка объезда (VROOM).
# Тот же набор параметров, что отработал на боевой машине.
#
# routingServers здесь указан для полноты: ядро считает матрицу времён само
# по графу нужной страны и передаёт её готовой, поэтому собственным
# маршрутизатором VROOM не пользуется. Если графа таджикистана нет — ничего
# не сломается, обращений к нему не будет.
#
# ТРИ КЛЮЧА, БЕЗ КОТОРЫХ КОНТЕЙНЕР НЕ СТАРТУЕТ ВООБЩЕ (проверено на образе
# v1.13.0 — он читает этот файл целиком и не подставляет никаких умолчаний):
#   baseurl  — src/config.js делает baseurl.substr(-1); без ключа это
#              «TypeError: Cannot read property 'substr' of undefined»;
#   logsize  — размер файла журнала до ротации; без него ротатор падает с
#              «Don't know how to handle options.size»;
#   logdir   — путь журнала ОТНОСИТЕЛЬНО ./src, а не абсолютный. Здесь он к
#              тому же ни на что не влияет: образ задаёт VROOM_LOG=/conf, и эта
#              переменная старше конфига. Значение '/..' — как в образцовом
#              конфиге образа: журнал ляжет в этот же каталог (access.log).
# Абсолютный '/var/log/vroom' был вдвойне мимо: такого каталога в образе нет.
cliArgs:
  geometry: false
  planmode: false
  threads: 2
  explore: 5
  limit: '1mb'
  logdir: '/..'
  logsize: '100M'
  baseurl: '/'
  maxlocations: 1000
  maxvehicles: 200
  override: true
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 300000
routingServers:
  osrm:
    car:
      host: 'osrm-tj'
      port: '5000'
