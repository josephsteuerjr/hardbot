[package]
name = "pult"
version = "0.7.0"
edition = "2021"
description = "Контур · Выезды — десктоп-пульт аналитика (Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
calamine = { version = "0.35.0", features = ["dates"] }
rfd = "0.17.2"
rust_xlsxwriter = "0.96.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
