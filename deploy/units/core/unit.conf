# Свойства единицы. Читается автоматически из deploy/_lib.sh — благодаря этому
# скрипты (install/update/doctor) одинаковы во всех трёх единицах, а разница
# между ними описана здесь.
#
# UNIT_SERVICES — сервисы, которые ДОЛЖНЫ работать после установки: их ждут по
# healthcheck и их состояние показывает диагностика. Служебные и одноразовые
# контейнеры сюда не входят: их поднимает сам compose по зависимостям.

UNIT_NAME=core
UNIT_TITLE="ядро: приложение, база, мини-приложение, фотографии"

UNIT_SERVICES="app"
# Встроенный HTTPS — отдельный сервис того же compose-проекта.
case ",$(env_get COMPOSE_PROFILES)," in
  *,proxy,*) UNIT_SERVICES="$UNIT_SERVICES caddy" ;;
esac

# Что нужно этой единице из общего (создаётся при установке, см. _lib.sh):
UNIT_NEEDS_NET=1        # сеть hard-net — ходить к маршрутизаторам единицы gps
UNIT_NEEDS_STT_VOL=1    # том hard-stt-run — сокет и токен единицы речи

# Приложение поднимается за десятки секунд; 3 минуты — потолок с запасом.
UNIT_WAIT_SECONDS=180
