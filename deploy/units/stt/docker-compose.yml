# ЕДИНИЦА «STT» — распознавание речи (faster-whisper на процессоре).
# Ставится в любой момент: до ядра, после ядра, или никогда. Ядро без неё
# работает, сотрудники просто вводят текст руками.
#
# КАК ОНА СВЯЗАНА С ЯДРОМ. Только через общий том hard-stt-run: в нём лежат
# Unix-сокет и файл токена. Сетевого порта у службы нет вообще — ни наружу,
# ни внутрь. Это самый узкий канал из возможных, и он же самый простой:
# соединять нечего, том подключается сам.
#
# ПРО ТОКЕН. Служба принимает запросы только с Bearer-токеном и требует, чтобы
# файл токена был обычным файлом и не читался всеми (иначе не стартует).
# Токен создаёт одноразовый контейнер stt-token — ВНУТРИ тома, а не на диске
# хоста. Это и есть решение старой ловушки: bind-mount несуществующего файла
# docker молча превращал в КАТАЛОГ, и служба падала на проверке «обычный файл».
# Внутри тома такого не бывает, и порядок установки единиц перестаёт что-либо
# значить: ядро перечитывает токен на каждом запросе, поэтому оно подхватит
# появившуюся речь само, без перезапуска.
#
# СМЕНИТЬ ТОКЕН: docker run --rm -v hard-stt-run:/run/stt hard-stt rm /run/stt/stt.token
# и ./update.sh — новый создастся сам, ядро подхватит его на следующем запросе.

name: hard-stt

services:
  # Одноразовый контейнер: создаёт токен, если его ещё нет, и завершается.
  # Берёт тот же образ, что и служба, — лишних образов и скачиваний нет.
  stt-token:
    build: ../../../stt
    image: hard-stt
    restart: "no"
    command:
      - python
      - -c
      - |
        import os, secrets, stat
        path = "/run/stt/stt.token"
        try:
            info = os.lstat(path)
            good = stat.S_ISREG(info.st_mode) and 32 <= info.st_size <= 4096
        except OSError:
            good = False
        if good:
            os.chmod(path, 0o640)
            print("токен службы речи уже есть")
        else:
            tmp = path + ".new"
            fd = os.open(tmp, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o640)
            os.write(fd, secrets.token_hex(32).encode())
            os.close(fd)
            os.replace(tmp, path)
            print("токен службы речи создан")
    volumes:
      - stt-run:/run/stt

  stt:
    build: ../../../stt
    image: hard-stt
    # container_name НЕ ЗАДАЁМ: жёсткое имя не даёт поднять рядом второй
    # экземпляр, а COMPOSE_PROJECT_NAME на него не влияет.
    restart: unless-stopped
    depends_on:
      stt-token:
        condition: service_completed_successfully
    environment:
      # Умолчание — ИМЯ ЗАПЕЧЁННОЙ модели, и это не мелочь. Модель едет в образе;
      # если здесь оставить другое имя, служба сначала не найдёт запрошенную
      # (строка ERROR), потом возьмёт запечённую (строка WARNING) — и так при
      # КАЖДОМ старте. Работать будет, но чужой инженер читает свой первый
      # журнал как поломку и идёт искать её там, где её нет.
      STT_MODEL: ${STT_MODEL:-large-v3-turbo}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_THREADS: ${STT_THREADS:-0}
      # Без этой строки STT_ALLOW_DOWNLOAD из .env до контейнера не доедет, а
      # служба в журнале советует её включить — совет, который некуда применить.
      STT_ALLOW_DOWNLOAD: ${STT_ALLOW_DOWNLOAD:-0}
      STT_RATE_PER_MINUTE: ${STT_RATE_PER_MINUTE:-6}
      STT_BURST: ${STT_BURST:-2}
      STT_SOCKET: /run/stt/stt.sock
      STT_TOKEN_FILE: /run/stt/stt.token
      STT_TEMP_DIR: /tmp/stt
    volumes:
      # Сокет и токен — в общем томе, к которому ядро подключено read-only.
      - stt-run:/run/stt
      # Кэш моделей. Штатной работе он не нужен — модель лежит в образе, и в сеть
      # служба не ходит. Каталог остаётся для одного случая: кто-то осознанно
      # включил STT_ALLOW_DOWNLOAD=1 и качает другую модель — тогда она ляжет
      # сюда и переживёт пересборку образа.
      - ./models:/models
      # Аудио на время распознавания лежит в памяти, не на диске.
      - type: tmpfs
        target: /tmp/stt
        tmpfs:
          size: 67108864
    # Память. Замеры: запечённая large-v3-turbo в int8 держит 0,87 ГБ сразу после
    # загрузки и до 1,24 ГБ на пике разбора записи (таблица в stt/README.md).
    # 2000m — это она с запасом; тесный лимит здесь не убивает контейнер, а
    # замедляет его втрое: модель отображена в память, и ядро вытесняет её.
    # Потолок вообще стоит не ради экономии, а ради соседей: без лимита утечка
    # в одной службе уносит весь сервер, а с лимитом страдает только речь.
    # Модель крупнее — поднимите и это число.
    mem_limit: ${STT_MEM_LIMIT:-2000m}
    # healthcheck задан в stt/Dockerfile: `python server.py --check` через сокет с токеном.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Тот же внешний том, что подключает ядро. Внешний — чтобы `down -v` в любой
  # из единиц не уносил сокет и токен вместе с собой.
  #   docker volume create hard-stt-run
  stt-run:
    external: true
    name: hard-stt-run

# Сеть этой единице не нужна ни наружу, ни внутрь: порта она не слушает, а
# модель едет в образе — в интернет служба не ходит вообще. Собственная сеть
# проекта, которую compose создаёт сам, остаётся пустой формальностью; она
# понадобится единственному случаю — если кто-то осознанно включит
# STT_ALLOW_DOWNLOAD=1 и разрешит службе качать другую модель.
