# ЕДИНИЦА «CORE» — приложение: мини-приложение, административное API, база,
# фотографии, карта. Ставится первой или последней — порядок не важен.
#
# Почему единица отдельная: у неё своя жизнь (обновляется чаще всех), свои
# данные (./data — единственное, что нужно бэкапить) и свой ритм перезапусков.
# Речь и маршруты живут в соседних единицах и подключаются сами, если стоят:
#   • речь  — через общий том hard-stt-run (Unix-сокет, наружу не торчит);
#   • карты — через общую сеть hard-net (адреса в .env, OSRM_URL_*/VROOM_URL).
# Ни того, ни другого может не быть — приложение работает и без них.
#
# Руками этот файл обычно не запускают: ./install.sh делает всё сам.

name: hard-core

services:
  app:
    build: ../../../server
    image: hard-app
    # container_name НЕ ЗАДАЁМ НАМЕРЕННО. Жёсткое имя не позволяет поднять
    # рядом второй экземпляр (тест, миграция) — COMPOSE_PROJECT_NAME на него
    # не влияет. Имя контейнера складывается из имени проекта: hard-core-app-1.
    restart: unless-stopped
    env_file: .env
    environment:
      APP_DATA: /data
      MINIAPP_PORT: "8080"
      # Речь: и сокет, и токен лежат в общем томе. Токен — обычный файл внутри
      # docker-тома, поэтому его нельзя случайно превратить в каталог, как это
      # происходит с bind-mount несуществующего файла.
      STT_SOCKET: /run/stt/stt.sock
      STT_TOKEN_FILE: /run/stt/stt.token
      PYTHONUNBUFFERED: "1"
    ports:
      # Наружу НЕ публикуем: перед сервисом должен стоять прокси с HTTPS.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      # База, фотографии, выгрузки. Единственное, что нужно бэкапить.
      - ./data:/data
      # Общий том единицы речи: сокет и токен, только на чтение.
      # Подключение к Unix-сокету на read-only томе разрешено — ограничение
      # тома касается обычных файлов, а не сокетов (так работает и на бою).
      - stt-run:/run/stt:ro
    networks:
      - hard
    # ЛИМИТ ПАМЯТИ НЕ СТАВИТЬ.
    # В обычной работе сервис занимает ~300 МБ, но при загрузке большого реестра
    # кратковременно берёт заметно больше. С потолком 768 МБ контейнер убивало
    # нехваткой памяти пять раз подряд. Если ограничение всё же требуется
    # политикой — не ниже 2 ГБ.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # --- Профиль proxy: HTTPS «из коробки» --------------------------------------
  # Только если у ИТ нет своего nginx/Traefik. Caddy сам получает и продлевает
  # сертификат Let's Encrypt для DOMAIN; нужны открытые снаружи порты 80 и 443
  # и DNS-запись домена на этот сервер. Включение: COMPOSE_PROFILES=proxy в .env.
  caddy:
    profiles: ["proxy"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Не ${DOMAIN:?…}: compose подставляет переменные ДО отбора профилей, и
      # обязательность ломала бы сборку даже с выключенным proxy. Проверяют скрипты.
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - hard
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Том сокета речи — ВНЕШНИЙ и с фиксированным именем: он общий с единицей
  # речи и не должен умирать вместе с любой из них (`down -v` в одной единице
  # не уносит чужой сокет). Создаётся при установке любой из единиц:
  #   docker volume create hard-stt-run
  stt-run:
    external: true
    name: hard-stt-run
  caddy-data:
  caddy-config:

networks:
  # Общая сеть трёх единиц с фиксированным именем: по ней приложение ходит к
  # маршрутизаторам (osrm-uz, vroom и т. д.) по именам сервисов. Внешняя —
  # чтобы не зависеть от того, какая единица поднялась первой.
  #   docker network create hard-net
  hard:
    external: true
    name: hard-net
