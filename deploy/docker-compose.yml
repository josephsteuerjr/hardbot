# «Выезды» — полный стек для установки ИТ-службой.
#
# Два базовых сервиса: приложение (app) и служба распознавания речи (stt).
# Всё состояние приложения — в ./data, модели речи — в ./models, поэтому
# пересборка образов данные не трогает. Порт приложения публикуется ТОЛЬКО на
# localhost: наружу отдаёт обратный прокси с сертификатом (README, «HTTPS
# обязателен») — либо свой nginx, либо профиль proxy ниже.
#
# Обычно эти файлы не запускают руками: ./install.sh делает всё сам.

name: vyezdy

services:
  app:
    build: ../server
    image: vyezdy-app
    container_name: vyezdy-app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_DATA: /data
      MINIAPP_PORT: "8080"
      # Голос: сокет и токен службы речи внутри контейнера (см. VOICE_BACKEND в .env)
      STT_SOCKET: /run/stt/stt.sock
      STT_TOKEN_FILE: /run/secrets/stt.token
      PYTHONUNBUFFERED: "1"
    ports:
      # Наружу НЕ публикуем: перед сервисом должен стоять прокси с HTTPS.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      # База, фотографии, выгрузки. Единственное, что нужно бэкапить.
      - ./data:/data
      # Сокет службы речи (общий том) и её токен — только на чтение.
      - stt-run:/run/stt:ro
      - ./secrets/stt.token:/run/secrets/stt.token:ro
    # ЛИМИТ ПАМЯТИ НЕ СТАВИТЬ.
    # В обычной работе сервис занимает ~300 МБ, но при загрузке большого реестра
    # кратковременно берёт заметно больше. С потолком 768 МБ контейнер убивало
    # нехваткой памяти пять раз подряд. Если ограничение всё же требуется
    # политикой — не ниже 2 ГБ.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  stt:
    build: ../stt
    image: vyezdy-stt
    container_name: vyezdy-stt
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_MODEL:-small}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_THREADS: ${STT_THREADS:-0}
      STT_RATE_PER_MINUTE: ${STT_RATE_PER_MINUTE:-6}
      STT_BURST: ${STT_BURST:-2}
      STT_SOCKET: /run/stt/stt.sock
      STT_TOKEN_FILE: /run/secrets/stt.token
      STT_TEMP_DIR: /tmp/stt
    volumes:
      # Сокет — в общем томе, к которому приложение подключено read-only.
      - stt-run:/run/stt
      # Кэш моделей: первый старт скачивает выбранную модель сюда (small ≈ 460 МБ).
      - ./models:/models
      - ./secrets/stt.token:/run/secrets/stt.token:ro
      # Аудио на время распознавания лежит в памяти, не на диске.
      - type: tmpfs
        target: /tmp/stt
        tmpfs:
          size: 67108864
    # Память: small ≈ 0,7 ГБ, medium ≈ 1,8 ГБ, large-v3 ≈ 3,5 ГБ. По умолчанию без
    # лимита (0); задать в .env: STT_MEM_LIMIT=1500m — с запасом к таблице.
    mem_limit: ${STT_MEM_LIMIT:-0}
    # healthcheck задан в stt/Dockerfile: `python server.py --check` через сокет с токеном.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Профиль routing: порядок объезда по реальным дорогам -----------------
  # Необязательно. Без него система работает, порядок точек считается упрощённо.
  # Требует подготовленного графа дорог на страну (deploy/geo/README.md) в
  # ./osrm/<страна>/ и ~0,5–1 ГБ памяти на страну. Включение:
  #   COMPOSE_PROFILES=routing в .env, затем OSRM_URL_UZ=http://osrm-uz:5000 и т. д.
  osrm-uz:
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: vyezdy-osrm-uz
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/uzbekistan-latest.osrm
    volumes:
      - ./osrm/uz:/data:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  osrm-tj:
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: vyezdy-osrm-tj
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/tajikistan-latest.osrm
    volumes:
      - ./osrm/tj:/data:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # --- Профиль proxy: HTTPS «из коробки» --------------------------------------
  # Только если у ИТ нет своего nginx/Traefik. Caddy сам получает и продлевает
  # сертификат Let's Encrypt для DOMAIN; нужны открытые снаружи порты 80 и 443
  # и DNS-запись домена на этот сервер. Включение: COMPOSE_PROFILES=proxy в .env.
  caddy:
    profiles: ["proxy"]
    image: caddy:2
    container_name: vyezdy-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Не ${DOMAIN:?…}: compose подставляет переменные ДО отбора профилей, и
      # обязательность ломала бы сборку даже с выключенным proxy. Проверяют скрипты.
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  stt-run:
  caddy-data:
  caddy-config:
