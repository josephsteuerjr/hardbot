// Автономное приложение (PWA вне Телеги): вход по ссылке. Короткая ссылка
// «/i/<код>» обменивается НА СЕРВЕРЕ: человек открыл — и уже внутри, на «/#t=<токен>».
// Старый вид «/#link=<код>» остаётся рабочим (выданные ссылки и бот): код лежит во
// фрагменте, на сервер не уходит, и страница меняет его сама через POST /api/redeem.
// Обменов у ссылки мало (обычно два), поэтому при обмене мы ВСЕГДА шлём свой текущий
// токен: если он жив и наш, сервер вернёт его же и обмен не потратит.
// Установленный ярлык живёт на персональном start_url «/#t=<токен>» (см. ниже).
function appToken(){ try{ return localStorage.getItem('app_token')||''; }catch(e){ return ''; } }
function cleanLinkFromUrl(){ try{ const u=new URL(location.href);
  u.searchParams.delete('link'); u.searchParams.delete('token');
  history.replaceState(null,'',u.pathname+(u.search||'')); }catch(e){} }
// Ярлык на экране («На экран Домой» / установленное приложение) отличается от вкладки
// только здесь, на клиенте: сервер по User-Agent этого не видит. Признак нужен серверу,
// чтобы не дарить лишний обмен тому, кто уже установил ярлык.
function isStandalone(){
  try{
    if(navigator.standalone===true) return true;
    return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }catch(e){ return false; }
}
// true — токен получен; 'have-token' — код невалиден/сервер недоступен, но на устройстве
// уже есть токен (тихо продолжаем); 'net' — код НЕ обменян и токена нет (оставляем код в
// URL, попробуем при следующем открытии); false — код ДЕЙСТВИТЕЛЬНО мёртв (410) и токена нет.
async function redeemCode(code, fromUrl){
  const gen=WIPE_GEN, token=appToken();
  try{
    const r=await fetch('/api/redeem',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code, token:appToken(), standalone:isStandalone()})});
    if(gen!==WIPE_GEN||token!==appToken()) return 'net';
    if(r.ok){ const j=await r.json();
      if(gen!==WIPE_GEN||token!==appToken()) return 'net';
      if(j&&j.token){
        // Сервер вернул ДРУГОЙ токен, а на устройстве уже есть вход: ссылка чужая
        // (или наш вход мёртв). Молча не подменяем — как и «#t=…&fresh=1» (см.
        // absorbTokenFromUrl): новый ждёт ответа человека после загрузки.
        const cur=appToken();
        if(cur && j.token!==cur && !(TG&&TG.initData)) setPendingToken(j.token);
        else{ try{ localStorage.setItem('app_token',j.token); }catch(e){} }
      }
      stampTokenUrl();                         // #link=код → #t=токен: ярлык унесёт вход
      return true; }
    if(r.status===410){                        // код мёртв (использован/просрочен/чужой) — жжём
      if(appToken()) stampTokenUrl(); else if(fromUrl) cleanLinkFromUrl();
      return appToken()?'have-token':false; }
    return appToken()?'have-token':'net';       // 5xx/прочее: сервер/прокси недоступен — код НЕ жжём
  }catch(e){ return 'net'; }                     // сети нет — код остаётся, повтор при связи
}
// Преемственность входа для установленного ярлыка: манифест после входа становится
// персональным (start_url «/#t=<токен>»), и iOS-ярлык — у которого хранилище ОТДЕЛЬНОЕ
// от Safari — рождается уже авторизованным: токен приезжает в URL при каждом запуске.
let URLT=null;                  // кандидат из URL: живой localStorage-токен сразу
const TRIED_TOKENS=new Set();   // не затираем, но подменяем, если сервер дал 401
// Новая ссылка входа, пришедшая при ЖИВОМ входе на устройстве (ревью 25.09.2026,
// #4). Ждёт ответа человека в sessionStorage — переживает перезагрузку вкладки
// (обновление оболочки), но не её закрытие — и в URLT: если старый вход окажется
// мёртвым, boot подменит его молча.
const PENDING_KEY="pending_token";
function pendingToken(){ try{ return sessionStorage.getItem(PENDING_KEY)||''; }catch(e){ return ''; } }
function setPendingToken(tk){ try{ sessionStorage.setItem(PENDING_KEY,tk); }catch(e){} URLT=tk; }
function clearPendingToken(){ try{ sessionStorage.removeItem(PENDING_KEY); }catch(e){} }
function absorbTokenFromUrl(){
  // URL не чистим: #t в адресе — это и есть «преемственность» (см. stampTokenUrl).
  try{ const u=new URL(location.href);
    const q=u.hash?new URLSearchParams(u.hash.replace(/^#/,'')):null;
    const tk=q?q.get('t'):null;
    if(!tk) return;
    // Из этого входа вышли кнопкой «Выйти» (или заменили его новой ссылкой): у
    // ярлыка он вшит в start_url, но обратно молча не возвращается.
    if(tokenIsOut(tk)) return;
    URLT=tk;
    // «fresh=1» ставит сервер на редиректе с «/i/<код>»: токен выдан ПРЯМО СЕЙЧАС
    // тому, кто открыл ссылку. Но адрес «/#t=<свой токен>&fresh=1» собирается и
    // руками, и присылается в мессенджер: раньше он молча подменял вход, и выезды,
    // фото и GPS жертвы уходили в чужой аккаунт (ревью 25.09.2026, #4). Теперь при
    // ЖИВОМ входе новый токен ждёт ответа человека (диалог после загрузки старым
    // входом), а мёртвый вход boot подменит молча. Входа нет — новый и есть вход.
    if(q.get('fresh')==='1'){
      const cur=appToken();
      if(tk===cur) return;
      if(!cur){ try{ localStorage.setItem('app_token',tk); }catch(e){} return; }
      setPendingToken(tk);
      return;
    }
    // Без метки токен в адресе — это start_url ярлыка, вшитый при установке. Он
    // бывает СТАРШЕ того, что на устройстве (внутри ярлыка входили заново), поэтому
    // живой localStorage-токен не трогаем: подмена выкинула бы человека из
    // работающего ярлыка. Мёртвый токен подменит ветка 401 в boot (URLT).
    if(!appToken()){ try{ localStorage.setItem('app_token',tk); }catch(e){} }
  }catch(e){}
}
function personalizeManifest(){
  // Вызываем после УСПЕШНОЙ авторизации токеном: установка «На экран Домой» /
  // «Установить приложение» с этой страницы унесёт вход с собой. Внутри Телеги
  // не трогаем (там initData, а ярлык оттуда не ставят).
  const tk=appToken(); if(!tk || (TG&&TG.initData)) return;
  const l=document.querySelector('link[rel="manifest"]');
  if(localStorage.getItem("account_role")){if(l)l.href='/manifest.webmanifest';return;}
  if(l) l.href='/manifest.webmanifest?t='+encodeURIComponent(tk);
}
function stampTokenUrl(){
  if(localStorage.getItem("account_role")){
    try{const u=new URL(location.href);for(const key of ['t','token','link'])u.searchParams.delete(key);
      history.replaceState(null,'',u.pathname+(u.search||''));}catch(e){}
    return;
  }
  // Живой токен держим ПРЯМО в адресе страницы (#t=…, фрагмент на сервер не уходит):
  // iOS при «На экран Домой» берёт то ли текущий URL, то ли start_url манифеста —
  // после этой строчки ОБА варианта несут вход с собой, ярлык рождается «с уже
  // подставленным кодом». Плата: токен виден в адресной строке/истории браузера —
  // осознанный выбор владельца в пользу простоты для выездников.
  const tk=appToken(); if(!tk || (TG&&TG.initData)) return;
  try{ const u=new URL(location.href);
    u.searchParams.delete('link'); u.searchParams.delete('token');
    history.replaceState(null,'',u.pathname+(u.search||'')+'#t='+encodeURIComponent(tk));
  }catch(e){}
}
// Сервер увёл на «/#link_dead=1»: ссылка исчерпана, просрочена или чужая.
function linkDeadFromUrl(){
  try{ return new URLSearchParams((location.hash||'').replace(/^#/,'')).get('link_dead')==='1'; }
  catch(e){ return false; }
}
function cleanHashFromUrl(){
  try{ const u=new URL(location.href);
    history.replaceState(null,'',u.pathname+(u.search||'')); }catch(e){}
}
async function redeemFromUrl(){
  absorbTokenFromUrl();
  // Мёртвая ссылка — не тупик: чаще всего человек уже внутри и просто ткнул старый QR.
  // Тихо входим своим токеном; отказ («попроси новую ссылку») покажет ветка 401 в boot.
  if(linkDeadFromUrl()){
    if(appToken()){ stampTokenUrl(); return 'have-token'; }
    cleanHashFromUrl(); return false;
  }
  let code=null;
  try{ const u=new URL(location.href);
    if(u.hash) code=new URLSearchParams(u.hash.replace(/^#/,'')).get('link');
    if(!code) code=u.searchParams.get('link');
  }catch(e){}
  if(!code) return null;
  const r=await redeemCode(code, true);
  // Первый вход по ссылке вне Телеги: манифест уже скачан без токена (Safari
  // берёт его при загрузке страницы и при «На экран Домой» не перечитывает).
  // Один раз перезагружаемся с #t=<токен> в адресе — после этого манифест
  // подключается персональным, и ярлык унесёт вход с собой.
  if(r===true && !(TG&&TG.initData) && !window.MANIFEST_PERSONAL){
    stampTokenUrl(); location.reload(); return "reload";
  }
  return r;
}
// Новая ссылка открылась в УЖЕ живой вкладке приложения: переход «/» → «/#link=…»
// меняет только фрагмент, страница НЕ перезагружается и boot() сам не стартует.
// Ловим hashchange: обмениваем код и перезапускаем загрузку.
async function onHashChange(){
  let c=null, t=null;
  try{ const q=new URLSearchParams(location.hash.replace(/^#/,''));
    c=q.get('link'); t=q.get('t'); }catch(e){}
  // «/#t=…» в живой вкладке — это возврат с /i/<код> или вставленная персональная
  // ссылка: токен уже готов, обменивать нечего. Но и такой адрес с чужим токеном
  // присылает кто угодно, с меткой fresh или без: при ЖИВОМ входе молча не
  // переключаемся (ревью #4) — спросит диалог после загрузки старым входом.
  if(!c && t && t!==appToken()){
    if(tokenIsOut(t)) return;
    if(appToken() && !(TG&&TG.initData)) setPendingToken(t);
    else{ try{ localStorage.setItem('app_token',t); }catch(e){} }
    await boot(); return; }
  if(c && (await redeemCode(c, true))===true) await boot();
}
window.addEventListener('hashchange', onHashChange);

// --- Вход по логину и паролю: устройство --------------------------------------
// Устройство представляет себя отпечатком: стабильный uuid (IndexedDB kv →
// device_uuid; «Выйти» стирает kv, поэтому копия живёт в localStorage — ключ
// hb_device_uuid внесён в LS_KEEP) плюс паспорт браузера (модель, экран, tz,
// язык, ядра/память) → sha-256. На старом WebView без crypto.subtle отпечаток
// деградирует до 'sha-unsupported-<uuid>' — сервер такой честно фиксирует.
const DEVICE_UUID_LS="hb_device_uuid";
let _DEVICE_PROFILE=null;
async function deviceUuid(){
  try{ const v=await IDB.get("kv","device_uuid"); if(v) return String(v); }catch(e){}
  try{ const v=localStorage.getItem(DEVICE_UUID_LS);
       if(v){ IDB.put("kv",v,"device_uuid").catch(()=>{}); return v; } }catch(e){}
  const v=uuid();                                   // генерируется РОВНО один раз
  try{ await IDB.put("kv",v,"device_uuid"); }catch(e){}
  try{ localStorage.setItem(DEVICE_UUID_LS,v); }catch(e){}
  return v;
}
function deviceModel(){
  const ua=(navigator&&navigator.userAgent)||"", pf=(navigator&&navigator.platform)||"";
  const ios=ua.match(/OS (\d+)(?:[_ ]\d+)*/);
  if(/iPhone/.test(ua)) return "iPhone · iOS "+(ios?ios[1]:"");
  if(/iPad/.test(ua)) return "iPad · iOS "+(ios?ios[1]:"");
  if(/iPod/.test(ua)) return "iPod · iOS "+(ios?ios[1]:"");
  const and=ua.match(/Android[ /]([\d.]+)/);
  if(and){ const dm=ua.match(/Android[^;)]*;\s*([^;)]+?)\s*(?:Build|\))/);
    return "Android "+(and[1]||"")+(dm&&dm[1]?" · "+dm[1]:""); }
  if(/Windows/.test(ua)) return "Windows ПК";
  if(/Mac OS X/.test(ua)) return "Mac";
  return pf||"Браузер";
}
// {fp, kind, label} — кэшируется в памяти на время жизни страницы.
async function deviceProfile(){
  if(_DEVICE_PROFILE) return _DEVICE_PROFILE;
  const scr=(typeof screen!=="undefined"&&screen)
    ? Math.round(screen.width||0)+"x"+Math.round(screen.height||0) : "0x0";
  const prof={uuid:await deviceUuid(), model:deviceModel(),
    screen:scr+"@"+((window.devicePixelRatio&&+window.devicePixelRatio.toFixed(2))||1),
    tz:"", lang:(navigator&&navigator.language)||"", hw:0, mem:0};
  try{ prof.tz=(window.Intl&&Intl.DateTimeFormat)?(Intl.DateTimeFormat().resolvedOptions().timeZone||""):""; }catch(e){}
  try{ prof.hw=navigator.hardwareConcurrency||0; }catch(e){}
  try{ prof.mem=navigator.deviceMemory||0; }catch(e){}
  let fp="";
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
      const dig=await crypto.subtle.digest("SHA-256",
        new TextEncoder().encode("hard-install-v1:"+prof.uuid));
      fp=Array.from(new Uint8Array(dig),b=>b.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  if(!fp) fp="sha-unsupported-"+(prof.uuid||uuid());
  _DEVICE_PROFILE={fp,
    kind:(/iPhone|iPad|iPod|Android|Mobile/i.test((navigator&&navigator.userAgent)||"")?"phone":"desktop"),
    label:(prof.model+" · "+scr)};                    // «iPhone · iOS 17 · 390x844»
  return _DEVICE_PROFILE;
}
function authErr(msg){ const e=$("loginerr"); if(e){ e.textContent=msg||""; e.style.display=msg?"block":"none"; } }
function authBusy(on){ const b=$("loginbtn"); if(b){ b.disabled=!!on; b.textContent=AUTH_TAB==="register"?(on?"Создаём…":"Создать профиль"):(on?"Вхожу…":"Войти"); } }
async function accountRegister(){
  if(AUTH_BUSY)return;

async function accountLogin(){

  const p=(( $("loginpass")||{}).value)||"";
  if(!u||!p){ authErr("Введите логин и пароль."); return; }
  AUTH_BUSY=true; AUTH_USER=u; authErr(""); authBusy(true);
  try{
    // Вход нового устройства: прежний токен (пусть и мёртвый — этот экран обычно
    // уже после очистки) стираем ЗАРАНЕЕ, чтобы чужой не улетел на сервер и не
    // остался на устройстве рядом с новым входом.
    // A login form may be shown without any active portfolio. If another
    // principal is still active, quarantine its private data before login.
    if(typeof STATE!=="undefined" && STATE.uid && localStorage.getItem("app_token"))
      await wipeDevice({keepQueue:true});
    try{ localStorage.removeItem("app_token"); }catch(e){}
    const dev=await deviceProfile();

                device:{kind:"phone", fp:dev.fp, label:dev.label}};
    const r=await fetch("/api/account/login",{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    let j=null; try{ j=await r.json(); }catch(e){}
    if(r.ok && j && (j.action==="ok"||j.action==="ok_pending") && j.token){
      try{ localStorage.setItem("app_token", j.token); localStorage.setItem("account_role",j.role||"agent"); }catch(e){}
      if(j.username) AUTH_USER=j.username;          // нормализованное имя сервера
      if(j.must_change_password){ renderPasswordChange(); return; }
      stampTokenUrl(); toast("✓"); boot();          // ok_pending покажет renderPending сам
      return;
    }
    // 403 bad/disabled/no_gps и 429 locked приходят с готовым русским текстом.
    authErr((j&&j.error)||("Вход не удался ("+r.status+"). Попробуйте ещё раз."));
  }catch(e){ authErr("Нет связи с сервером — попробуйте ещё раз."); }
  finally{ AUTH_BUSY=false; authBusy(false); }
}

// Сервер отверг вход (401/403) вне Телеграма. Сначала — молчаливая подмена: новая
// ссылка входа, ждущая ответа человека, или токен из адреса (start_url ярлыка,
// переустановленного после простоя). Мёртвый вход терять нечего, а это самый
// частый законный случай: токен отозвали, он истёк, человек переехал на новый
// адрес. Подменять нечем — телефон очищается (handleAuthGone).
async function onAuthRejected(){
  if(appToken()){await purgeProfile("revoked");return;}
  const dead=appToken(); if(dead) TRIED_TOKENS.add(dead);
  const cand=[pendingToken(), URLT].find(x=>x && !TRIED_TOKENS.has(x) && !tokenIsOut(x));
  if(!cand) return handleAuthGone(!!dead);
  // A failed A token cannot establish whether B is a renewal or another
  // person. Stamp A's queue, then clear A's private cache before installing B.
  await wipeDevice({keepQueue:true});
  TRIED_TOKENS.add(cand); closeAsk("swapsheet");
  try{ localStorage.setItem('app_token',cand); }catch(e){}
  // Манифест собран в <head> со старым входом, а Safari его не перечитывает: ярлык
  // «На экран Домой» унёс бы в start_url мёртвый токен. Один раз перезагружаемся —
  // головной скрипт соберёт манифест уже с новым.
  if(appToken()===cand && window.MANIFEST_TOKEN!==cand){ stampTokenUrl(); location.reload(); return; }
  return boot();
}
// Вход отозван или истёк: портфель, карточки, снимок и сам токен с телефона
// стираем — иначе уволенный или нашедший телефон читал бы их в авиарежиме. Очередь
// остаётся: это работа человека, она уйдёт, когда он войдёт по новой ссылке.
// Нет сети или сервер лежит (5xx) — сюда не попадаем: работа из снимка без связи
// штатна.
async function handleAuthGone(expired){
  const exp=(expired===undefined)?!!appToken():!!expired;   // до очистки: был ли вход
  await wipeDevice({keepQueue:false});
  renderLangs();                  // входа нет — нет и «Выйти»
  renderAppAuthGone(exp);
}
// --- Старый адрес: экран выгрузки (оболочка v64, 30.09.2026) -------------------
// Работать здесь нельзя — только отправить то, что застряло в очереди телефона
// после переезда. Досылает штатный flushQueue (те же правила, что в поле: 401 и
// сеть — ждать, отклонённое сервером — держать и показать). Статус — словами.
let DRAIN_BUSY=false, DRAIN_TIMER=null;
async function renderDrain(){
  if(!DRAIN){
    DRAIN={newUrl:""};
    try{ const v=await (await fetch("/version.json",{cache:"no-store"})).json();
         if(v&&v.drain) DRAIN=v.drain; }catch(e){}
  }

async function drainRun(){
  if(DRAIN_BUSY) return;
  DRAIN_BUSY=true; clearTimeout(DRAIN_TIMER);
  let state="done";
  try{
    await drainDraw("sending");
    await flushQueue();
    const left=(await drainItems()).pending.length;
    if(left) state=await drainProbe();
  }finally{ DRAIN_BUSY=false; }
  await drainDraw(state);
  if(state==="net") DRAIN_TIMER=setTimeout(drainRun, 20000);
}
// Почему очередь стоит: пустой запрос сохранения без побочных эффектов.
// 401/403 — нужен вход; ответ по существу (404/400) — вход есть; обрыв — сеть.
async function drainProbe(){
  try{
    const r=await fetch("/api/save",{method:"POST",headers:jsonHeaders(),body:"{}"});
    if(r.status===401||r.status===403) return "auth";
    if(r.status>=500) return "net";
    return "done";
  }catch(e){ return "net"; }
}
async function drainItems(){
  let items=[]; try{ items=(await IDB.all("queue"))||[]; }catch(e){}
  const failed=items.filter(it=>it.failed), pending=items.filter(it=>!it.failed);
  return {items, failed, pending};
}
async function drainName(rep){

function drainDrafts(){
  const reps=[];

  return reps;

async function drainDraw(state){
  const t=L(), {failed, pending}=await drainItems();
  const unowned=failed.filter(it=>it.failed==="server-owner");
  const rejected=failed.filter(it=>it.failed!=="server-owner");
  const n=k=>pending.filter(it=>it.kind===k).length;
  const counts=[[n("save"),t.drainVisits],[n("photo"),t.drainPhotos],[n("marker"),t.drainMarks],
                [n("note")+n("note_delete"),t.drainNotes]].filter(([k])=>k).map(([k,l])=>l+": "+k).join(" · ");
  const status = state==="sending" ? `<div class="sline"><span class="d w"></span><span>${esc(t.drainSending)}</span></div>`
    : state==="net" ? `<div class="sline"><span class="d w"></span><span>${esc(t.drainNet)}</span>
        <button class="toolbtn" onclick="drainRun()">${esc(t.drainRetry)}</button></div>`
    : state==="auth" ? `<div class="sline"><span class="d w"></span><span>${esc(t.drainAuth)}</span></div>
        <input id="codein" class="search" style="margin:8px 0" placeholder="${esc(t.codeph)}" autocomplete="off"

    : `<div class="sline"><span class="d"></span><span>${esc(pending.length?t.drainSending:(unowned.length?t.drainOwner:(rejected.length?t.drainFailed:t.drainDone)))}</span></div>`;
  const left = pending.length ? `<div class="lrow"><div class="pname" style="white-space:normal">${esc(t.drainLeft)} — ${esc(counts)}</div></div>` : "";
  const unownedNames=[]; for(const it of unowned) unownedNames.push(await drainName(it.rep));
  const failedNames=[]; for(const it of rejected) failedNames.push(await drainName(it.rep));
  const drafts=drainDrafts(), draftNames=[]; for(const r of drafts) draftNames.push(await drainName(r));
  const list=(title,names)=>names.length?`<div class="lrow"><div class="pname" style="white-space:normal">${esc(title)} · ${names.length}</div>
      <div class="psub">${names.map(esc).join(" · ")}</div></div>`:"";
  const done=state!=="sending" && !pending.length && !unowned.length;
  const open=(done && DRAIN && DRAIN.newUrl)?`<a class="btn acc" style="margin-top:14px;text-decoration:none"
      href="${esc(DRAIN.newUrl)}/">${esc(t.drainOpen)}</a>`:"";
  $("app").innerHTML=`<div class="dgh"><div class="t">${esc(t.drainTitle)}</div></div>
    <div class="dgsub" style="white-space:normal">${esc(t.drainWhy)}</div>
    ${status}${left}${list(t.drainOwner,unownedNames)}${list(t.drainFailed,failedNames)}${list(t.drainDrafts,draftNames)}${open}`;
}
// Вставленная ссылка входа: старый вход здесь заведомо мёртв (сервер его не
// принял), поэтому токен из ссылки просто становится входом этого адреса.
async function drainLogin(){
  const el=$("codein"); const raw=(el&&el.value||"").trim(); if(!raw){ if(el) el.focus(); return; }
  const m=raw.match(/\/i\/([A-Za-z0-9_-]{8,})/)||raw.match(/link=([A-Za-z0-9_-]+)/);
  const code=m?m[1]:raw;
  try{
    const r=await fetch("/api/redeem",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code, standalone:isStandalone()})});
    const j=r.ok?await r.json():null;
    if(!j||!j.token){ toast(L().drainBadLink); return; }
    try{ localStorage.setItem("app_token", j.token); localStorage.setItem("account_role",j.role||"agent"); }catch(e){}
    drainRun();
  }catch(e){ toast(L().drainNet); }
}
async function enterCode(){
  // Код берём из поля; пустое поле → пробуем буфер обмена (iOS сам спросит
  // разрешение «Вставить») — но только если там похожее на код, чтобы не жечь
  // попытку о случайный мусор. Принимаем и целую вставку сообщения бота, и
  // ссылку, и голый код: вытаскиваем link=CODE где угодно в тексте.
  const el=document.getElementById("codein");
  let raw=el?el.value.trim():'';
  if(!raw && el && navigator.clipboard && navigator.clipboard.readText){
    try{ const cb=(await navigator.clipboard.readText()).trim();
      if(/[#&]t=[A-Za-z0-9_-]{16,}/.test(cb)||/\/i\/[A-Za-z0-9_-]{8,}/.test(cb)
        ||/link=[A-Za-z0-9_-]+/.test(cb)||/^[A-Za-z0-9_-]{8,}$/.test(cb)){ raw=cb; el.value=cb; } }catch(e){}
  }
  if(!raw && !el) raw=(prompt(L().codeprompt)||'').trim();
  if(!raw){ if(el) el.focus(); return; }
  // Вставили ПЕРСОНАЛЬНУЮ ссылку («…/#t=<токен>» из адресной строки Safari) — это
  // готовый вход, обменивать нечего. Ровно так вход переносят в ярлык на iPhone.
  const tk=raw.match(/[#&]t=([A-Za-z0-9_-]{16,})/);
  if(tk){ try{ localStorage.setItem('app_token',tk[1]); }catch(e){}
    stampTokenUrl(); toast('✓'); boot(); return; }
  // Короткая ссылка входа «…/i/<код>», старая «…#link=<код>» или голый код.
  const m=raw.match(/\/i\/([A-Za-z0-9_-]{8,})/)||raw.match(/link=([A-Za-z0-9_-]+)/);
  const r=await redeemCode(m?m[1]:raw, false);
  if(r===true){ toast('✓'); boot(); } else toast('✕');
}

async function swapYes(force){

      // стирает очередь целиком, а новый вход чужие выезды не примет.
      if(navigator.onLine!==false){
        askSheet("swapsheet", `<div class="muted" style="text-align:center;padding:12px 0">${esc(t.sending)}</div>`);
        await flushQueueSettled(30000);
        left=await pendingCount();
      }
      if(left){
        askSheet("swapsheet", `<div style="font-weight:600;margin-bottom:14px">${esc(t.swaplost.replace("{n}",left))}</div>
          <div class="row2"><button class="btn" style="color:var(--danger)" onclick="swapYes(true)">${esc(t.swapyes)}</button>
            <button class="btn acc" onclick="swapNo()">${esc(t.swapno)}</button></div>`);
        return;
      }
    }
    const old=appToken();
    await dropTokenOnServer(old);  // и ярлык с этим входом больше не впустит
    await wipeDevice({keepQueue:false});
    markTokenOut(old);             // прежний вход не вернётся сам из start_url ярлыка
    try{ localStorage.setItem('app_token',tk); }catch(e){}
    stampTokenUrl();
    location.reload();             // манифест и всё прочее — уже с новым входом
  }finally{ SWAP_BUSY=false; }
}

let START_TAB, START_DATE, START_TAB_USED=false;
function authHeaders(){
  const h = {};
  if (TG && TG.initData) h["X-Init-Data"] = TG.initData;    // внутри Телеги — подпись WebApp
  // Password login may happen inside Telegram's WebView as well. An explicit
  // bearer wins at the server; signed initData remains the legacy/no-token path.
  const t=appToken(); if(t) h[(!localStorage.getItem("account_role") || localStorage.getItem("account_role")==="agent")?"X-App-Token":"X-Pult-Token"]=t;
  const dev = new URLSearchParams(location.search).get("dev_uid");
  if (dev) h["X-Dev-Uid"] = dev;
  h["X-Shell-Version"]=String(SHELL_VERSION); h["X-Client-Version"]="3.2.0";
  h["X-Work-Product"]=STATE.mode==="soft"?"soft":"hard";
  if(LOGIN_GPS && Date.now()-LOGIN_GPS.at<90000) h["X-Device-GPS"]=JSON.stringify(LOGIN_GPS.point);
  return h;
}
async function api(path, opts){
  opts = opts || {};
  const generation=WIPE_GEN, credential=cacheCredential();
  const h = authHeaders(); h["Content-Type"] = "application/json";
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),30000);
  try{
    const r = await fetch(path, Object.assign({}, opts, {headers:h,signal:ctl.signal,redirect:"error"}));
    if (!r.ok){let detail;try{detail=await r.json();}catch(e){}const error=new Error(String(r.status));error.detail=detail&&(detail.message||detail.error);throw error;}
    const data=await r.json();
    // A response initiated under A must not mutate B's state or rewarm B's
    // cache after a logout, revoked-token replacement or same-token UID change.
    if(generation!==WIPE_GEN||credential!==cacheCredential()) throw new Error("stale response");
    return data;
  }finally{ clearTimeout(timer); }
}
// Только числовые замеры этапов. Ни имена, ни КД, ни адреса, ни тексты ошибок
// сюда не принимаются — сервер повторно проверяет тот же белый список.
function clientMetric(event, metrics){
  try{
    const h=authHeaders(); h["Content-Type"]="application/json";
    fetch("/api/client-event", {method:"POST",headers:h,keepalive:true,
      body:JSON.stringify({event,metrics:metrics||{}})}).catch(()=>{});
  }catch(e){}
}
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show");
  setTimeout(()=>e.classList.remove("show"),1600); }

// Courier data uses the same verified device identity and durable outbound queue.
async function prepareCourier(online){
  STATE.courier=null;
  const gen=WIPE_GEN,credential=cacheCredential(),uid=STATE.uid;
  const valid=()=>gen===WIPE_GEN&&credential===cacheCredential()&&uid===STATE.uid;
  if(!credential||!uid||!appToken())return;
  const key="crm-courier-context:"+uid;
  if(online){
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
    try{
      const response=await fetch("/api/courier/context",{headers:authHeaders(),signal:controller.signal,redirect:"error"});
      if(!valid())return;
      if(response.status===401||response.status===403||response.status===404){
        await IDB.put("kv",null,key,valid);return;
      }
      if(!response.ok)throw new Error("courier context");
      const value=await response.json();
      if(!valid())return;
      if(value.role!=="courier"||!Array.isArray(value.contracts))throw new Error("courier context");
      const snapshot={...value,_credential:credential,_uid:uid};
      await IDB.put("kv",snapshot,key,valid);
      if(valid())STATE.courier=snapshot;
      return;
    }catch(e){}finally{clearTimeout(timer);}
  }
  const snapshot=await IDB.get("kv",key).catch(()=>null);
  if(valid()&&snapshot&&snapshot._credential===credential&&snapshot._uid===uid&&snapshot.role==="courier")
    STATE.courier=snapshot;
}
async function renderCourier(){
  const gen=WIPE_GEN,credential=cacheCredential(),uid=STATE.uid,snapshot=STATE.courier;
  const valid=()=>gen===WIPE_GEN&&credential===cacheCredential()&&uid===STATE.uid&&STATE.courier===snapshot;
  hideBottomNav();$("app").classList.remove("wide");
  $("app").innerHTML='<div id="courier-form"></div>';
  document.querySelector('.brand').textContent='Курьер';
  try{
    await window.CRMDelivery.mount($("courier-form"),snapshot.contracts,{
      fields:snapshot.fields,
      draft:async function(key,value){
        if(!valid())return {ok:false,text:'Вход изменён. Откройте приложение заново.'};
        const storageKey='crm-courier-draft:'+uid+':'+key;
        if(arguments.length>1)await IDB.put('kv',{value,_credential:credential},storageKey,valid);
        const stored=await IDB.get('kv',storageKey);
        if(!valid())return {ok:false,text:'Вход изменён. Черновик сохранён за прежним сотрудником.'};
        return {ok:true,data:stored&&stored._credential===credential?stored.value:null};
      },
      command:async body=>{
        if(!valid())return {ok:false,text:'Вход изменён. Результат не отправлен.'};
        const contract=snapshot.contracts.find(row=>row.contract_uuid===body.contract_ids[0]);
        const entry={kind:'courier',op_id:body.operation_id,body,rep:contract?.external_id||'',at:Date.now()};
        if(!await enqueue(entry))return {ok:false,text:'Не удалось сохранить на телефоне. Повторите сохранение.'};
        if(!valid()||!queueBelongs(entry))return {ok:false,text:'Вход изменён. Результат остаётся в очереди прежнего сотрудника.'};
        void flushQueue();return {ok:true};
      },
      search:async text=>{
        if(!valid())throw new Error('identity changed');
        if(!navigator.onLine)return snapshot.contracts.filter(row=>JSON.stringify(row).toLocaleLowerCase().includes(text.toLocaleLowerCase()));
        const response=await fetch('/api/courier/contracts?search='+encodeURIComponent(text),{headers:authHeaders(),redirect:'error'});
        if(!response.ok)throw new Error('courier search');
        const data=await response.json();if(!valid())throw new Error('identity changed');
        return data.contracts;
      }
    });
  }catch(e){if(valid())$("app").textContent='Не удалось открыть форму. Перезапустите приложение; очередь сохранена.';}
  updateOffBar();
}

function themeNow(){ try{ const t=localStorage.getItem(THEME_KEY); return (t==="light"||t==="dark")?t:"system"; }catch(e){ return "system"; } }

function cycleTheme(){

async function boot(){
  if(!await enforceRetention())return;
  const bootStarted=performance.now(); let gen=WIPE_GEN;
  checkShellVersion();
  renderLangs(); hideBottomNav();
  geoProbe();                 // узнаём, дали ли права раньше (не спрашивает, только смотрит)
  tgGeoInit();                // внутри Телеграма — её собственный LocationManager
  if(!REDEEMED){ REDEEMED=true;                          // код из ссылки входа
    if((await redeemFromUrl())==="reload") return; }        // страница перезагружается
  // Диплинк из пуша (?tab=digest&d=дата): параметры вычищаются из адреса СРАЗУ
  // — stampTokenUrl сохраняет query, а перезагрузка здесь штатная (обновление
  // оболочки делает location.reload), и человека выбрасывало бы в сводку на
  // дату вчерашнего пуша при каждом обновлении.
  if(START_TAB===undefined){
    START_TAB=null; START_DATE=null;
    try{ const u=new URL(location.href);
      if(u.searchParams.has("tab")||u.searchParams.has("d")){
        START_TAB=u.searchParams.get("tab"); START_DATE=u.searchParams.get("d");
        u.searchParams.delete("tab"); u.searchParams.delete("d");
        history.replaceState(null,"",u.pathname+(u.search||"")+(location.hash||""));
      } }catch(e){}
  }
  try{
    let bootMode=storedMode();
    let d = await api("/api/bootstrap"+(bootMode==="soft"?"?mode=soft":""));
    // Первый вход ещё не знает ролей. Выбираем доступный портфель после ответа.
    STATE.roles=d.roles||null;
    const availableMode=storedMode();
    if(availableMode==="soft" && bootMode!=="soft" && !d.needsOnboarding && !d.pending){
      bootMode="soft";
      d=await api("/api/bootstrap?mode=soft");
    }else if(bootMode==="soft" && availableMode!=="soft" && !d.needsOnboarding && !d.pending){
      bootMode=availableMode;
      d=await api("/api/bootstrap");
    }
    // Пока шёл запрос, телефон могли очистить («Выйти», замена входа): поздний
    // ответ не должен вернуть на экран и в хранилище стёртый портфель.
    if(gen!==WIPE_GEN) return;
    personalizeManifest();   // авторизация удалась → ярлык с этой страницы унесёт вход
    stampTokenUrl();         // …и в самом адресе страницы тоже (iOS берёт любой из двух)
    offerSwap(d);            // открыта новая ссылка входа при живом входе — спросить
    STATE.lang=d.lang||STATE.lang; renderLangs();
    if(d.needsOnboarding){ STATE.onb=d; renderOnboarding(); return; }
    // Заявка ждёт подтверждения владельца (второе устройство на то же ФИО).
    // Ветки не было вовсе: сервер отдавал pending, фронт валился в «Нет доступа»,
    // и человек не понимал, ждать ему или он сломал приложение.
    if(d.must_change_password){ AUTH_USER=d.username||AUTH_USER; renderPasswordChange(); return; }
    if(d.pending){ renderPending(d.employee, d.pending_kind); return; }
    // Сменился сотрудник на устройстве (перевыпуск на другого человека) — чистим кэш и
    // очередь прошлого, чтобы не смешивать ПД и не долить чужие визиты под новым токеном.
    const prev = await loadBootstrapSnapshot();
    // keepQueue: дрейф личности руководителя (acting пишет фолбэк allowed[0]
    // при смене состава) не должен стоить выезднику неотправленной очереди.
    if(prev && prev.uid && d.uid && prev.uid !== d.uid){
      WIPE_GEN++; gen=WIPE_GEN;
      const left = await pendingCount();
      await clearLocalData({keepQueue: left > 0});
    }
    if(gen!==WIPE_GEN) return;
    setBottomNav("clients");   // вкладки видны с первого экрана
    setMeta(d.meta, true); STATE.persons=d.persons; STATE.kind=d.kind||"agent";
    setPrincipal(d);
    STATE.roles=d.roles||null;   // роль руководителя: список его сотрудников + текущий
    STATE.mode=bootMode;
    STATE.online=true;
    await prepareCourier(true);
    if(gen!==WIPE_GEN)return;
    if(STATE.courier)STATE.mode='field';
    d._mode=STATE.mode; cacheBootstrap(d);   // снимок с режимом: оффлайн поднимет тот же портфель
    const renderStarted=performance.now();
    // Руководитель открывает приложение в своём режиме (сводка), если сам не
    // выбрал «Выездник»; диплинк на сводку ниже перекроет что угодно.
    if(STATE.mode==="soft") renderSoftList();
    else if(storedMode()==="lead" && !(START_TAB==="digest" && !START_TAB_USED)) renderDigest();
    else renderList();
    const bd=d.diagnostics||{};
    clientMetric("boot_ok", {persons:STATE.persons.length,
      contracts:bd.contracts,server_ms:bd.server_ms,
      render_ms:performance.now()-renderStarted,
      download_ms:performance.now()-bootStarted});
    if(!STATE.courier)warmCards(); // courier's assigned canonical cards are cached above
    flushQueue();                 // досыл накопленного оффлайна (визиты/фото/метки)
    if(!START_TAB_USED && (START_TAB==="digest" || ['manager','security','full'].includes(localStorage.getItem('account_role'))) && STATE.roles && STATE.roles.manager){
      START_TAB_USED=true;        // одноразово: boot() зовётся и после actAs/setLang
      DG.date=START_DATE||null;
      renderDigest();
    }
  }catch(e){
    if(gen!==WIPE_GEN) return;     // телефон очистили, пока шёл запрос: экран уже свой
    clientMetric("boot_error", {download_ms:performance.now()-bootStarted});
    const st=+((e&&e.message)||0);
    // 410 — старый адрес приложения (только выгрузка): портфеля и работы здесь нет,
    // только отправка того, что осталось в очереди телефона.
    if(st===410) return renderDrain();
    // Сервер ответил «не пускаю»: токен истёк/отозван либо его ещё нет.
    // Кэш здесь НЕ поднимаем (сервер доступен и отказал): мёртвый вход подменяем
    // кандидатом (новая ссылка, start_url ярлыка), а нечем — стираем портфель с
    // телефона и просим новую ссылку у аналитика (onAuthRejected).
    if(st===401||st===403) return onAuthRejected();
    // Сети нет — поднимаемся из оффлайн-снимка портфеля, если он есть.
    const snap = await loadBootstrapSnapshot();
    if(gen!==WIPE_GEN) return;
    if(snap && snap.persons){
      STATE.lang=snap.lang||STATE.lang; renderLangs();
      setMeta(snap.meta); STATE.persons=snap.persons; STATE.kind=snap.kind||"agent";
      setPrincipal(snap);
      // Без roles из снимка руководитель в поле терял и переключатель
      // портфелей, и вкладку сводки — читалось как поломка приложения.
      STATE.roles=snap.roles||null;
      STATE.mode=(snap._mode==="soft")?"soft":"field";
      STATE.online=false;
      await prepareCourier(false);
      if(gen!==WIPE_GEN)return;
      if(STATE.courier)STATE.mode='field';
      if(STATE.mode==="soft") renderSoftList(); else renderList();
    }else{
      // Связи нет и снимка портфеля на телефоне ещё нет. Здесь стояла инструкция
      // «откройте через бота»: в контуре компании бота нет — это был тупик, да ещё
      // и по-русски для узбека с таджиком. Говорим ровно то, что человек может
      // сделать сам: дойти до связи и открыть приложение ещё раз.
      const t=L();
      $("app").innerHTML = `<div class="center">${esc(t.bootnone)}<br><span class="muted">${esc(t.bootnonewhy)}</span></div>`;
    }
  }
}

// --- Нижняя навигация (Клиенты / Навигатор / Метки) — как в нативном приложении.
// Показывается СРАЗУ после входа, а не после первого захода в карточку: человек
// должен видеть, из чего состоит приложение, с первого экрана.
// Руководитель: Сводка / Сотрудники / Навигатор; выездник (и руководитель в
// режиме «Выездник»): Клиенты / Навигатор / Метки.
function setBottomNav(active){

// --- Режим руководителя (оболочка v62) ----------------------------------------
// 30.09.2026, владелец: «выбор ролей … должен быть отдельный режим вместо выбора
// собственно сотрудников, как сейчас — и у меня тоже». У кого есть роль
// руководителя (безопасник, директор, владелец), под шапкой — переключатель:
// «Руководитель» (сводка, сотрудники) ↔ «Выездник» (портфель, навигатор, метки).
// Чей портфель открыт — выбирается уже ВНУТРИ режима «Выездник». Какой режим
// открывать при запуске — удобство этого телефона (localStorage, стирается при
// выходе вместе со всем); права по-прежнему решает сервер по роли.
function hasLead(){ return !!(STATE.roles && STATE.roles.manager); }
// Контур «Софт»: портфель по «ответственный Сотрудник СОФТ». У выездников,
// переведённых УЗБ на звонки, ролей две — переключатель «Выездник | Софт».
function softRole(){ return !!(STATE.roles && STATE.roles.soft); }
function canField(){ return hasLead() || (!STATE.roles ? true :
  (STATE.roles.field===undefined ? !softRole() : !!STATE.roles.field)); }
function modeKey(){ return "hb_mode:"+currentUid(); }
function storedMode(){
  const can={lead:hasLead(),soft:softRole(),field:canField()};
  let m=""; try{ m=localStorage.getItem(modeKey())||""; }catch(e){}
  if(m==="soft"&&can.soft) return "soft";
  if(m==="lead"&&can.lead) return "lead";
  if(m==="field"&&can.field) return "field";
  if(can.soft&&!can.field&&!can.lead) return "soft";   // чистый софтник
  return can.lead?"lead":"field";
}
function leadLabel(){ const t=L(), r=(STATE.roles&&STATE.roles.role)||"manager";
  return t["mode"+r]||t.modemanager; }
function renderModeBar(){
  const el=$("modebar"); if(!el) return;

  if(modes.length<2){ el.classList.remove("on"); el.innerHTML=""; return; }

    `<button class="${STATE.mode===id?"on":""}" onclick="setMode('${id}')">${esc(label)}</button>`).join("")+`</div>`;
  el.classList.add("on");

async function setMode(m){

  const allowed=(m==="lead"&&hasLead())||(m==="field"&&canField())||(m==="soft"&&softRole());

}

// Черновик маршрута дня: сервер берёт топ по скорингу и сворачивает цепочкой

async function routeDay(){

}
let LIST_RENDER_SEQ=0;
function personCardHTML(p,t){

  const softLine = STATE.mode==="soft"

                    : (p.sc ? "📞 "+esc(p.sc) : esc(t.nostatus)) }${

       ${softLine}</div>
     <span class="pchev">${ic("chevR")}</span>
   </div>`;
}
function drawList(items){
  const host=$("plist"); if(!host) return;
  const t=L(), seq=++LIST_RENDER_SEQ, batch=60;
  let offset=0;
  host.innerHTML="";
  const append=()=>{
    // Поиск/маршрут/переход могли заменить экран, пока ждали следующий кадр.
    if(seq!==LIST_RENDER_SEQ || $("plist")!==host) return;
    const end=Math.min(offset+batch,items.length);
    host.insertAdjacentHTML("beforeend",items.slice(offset,end).map(p=>personCardHTML(p,t)).join(""));
    offset=end;
    if(offset<items.length) requestAnimationFrame(append);
  };
  try{ append(); }catch(e){ clientMetric("render_error", {persons:items.length}); }
}
// Поиск по списку. Подсказка обещает «ФИО, договор, телефон» — и ищем ровно по
// трём, а не по одному имени: выездник в поле оперирует номером договора,
// который ему называет офис, и телефоном должника, а не написанием фамилии.
// Номера и телефоны приходят вместе со списком (persons[].ids/tels), телефоны —
// одними цифрами: «+998 90 123-45-67» набирают подряд, и сырую строку реестра
// такой набор никогда не совпадёт.
// ФИО должников в реестре записаны ЛАТИНИЦЕЙ («TUKHTASINOV NUSRATULLO»), а
// ищут их набором по-русски — «Тухтасинов». Совпадения не было ни одного, и
// человек в поле видел пустой экран при живом клиенте в портфеле. Сводим обе
// стороны к общему звуковому скелету: сначала кириллица в латиницу, затем
// гасим разнобой самой латиницы. Один и тот же узбекский звук пишут
// по-разному, и это не опечатки, а две живые традиции записи:
// х = kh или x, ж = j или zh, қ = q или k, Мирзаев = Mirzaev или Mirzayev.
const FOLD_MAP={"а":"a","б":"b","в":"v","г":"g","ғ":"g","д":"d","е":"e","ё":"yo",
  "ж":"j","з":"z","и":"i","й":"y","к":"k","қ":"q","л":"l","м":"m","н":"n","о":"o",
  "п":"p","р":"r","с":"s","т":"t","у":"u","ў":"u","ф":"f","х":"x","ҳ":"h","ц":"ts",
  "ч":"ch","ш":"sh","щ":"sh","ъ":"","ы":"i","ь":"","э":"e","ю":"yu","я":"ya"};
function fold(s){
  let t=String(s||"").toLowerCase();
  t=t.replace(/[Ѐ-ӿ]/g,c=>FOLD_MAP[c]!==undefined?FOLD_MAP[c]:c);
  t=t.replace(/['`‘’ʻʼ]/g,"");   // o', g', ʻ — украшения письма
  // Порядок важен: kh гасим ДО одиночного x, иначе из «kh» вышло бы «hh».
  t=t.replace(/zh/g,"j").replace(/kh/g,"h").replace(/x/g,"h").replace(/gh/g,"g")
     .replace(/ts/g,"s").replace(/q/g,"k").replace(/ye/g,"e")
     .replace(/yo/g,"o").replace(/yu/g,"u").replace(/ya/g,"a").replace(/w/g,"v");
  t=t.replace(/(.)\1+/g,"$1");                        // Tojiddinov = Tojidinov
  return t.replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
}
function personMatches(p,q,qd,qf){
  const name=String(p.client||"").toLowerCase();
  if(name.includes(q)) return true;
  // Скелет считаем ОДИН раз на человека и держим при нём: пересчитывать 760
  // имён на каждую набранную букву — заметная пауза на телефоне в поле.
  if(qf && (p._fold||(p._fold=fold(p.client))).includes(qf)) return true;
  if(!qd) return false;
  if((p.ids||[]).some(id=>id.includes(qd))) return true;
  // Одна-две цифры — это ещё не телефон: по ним совпал бы весь портфель.
  return qd.length>=3 && (p.tels||[]).some(tel=>tel.includes(qd));
}
function listPool(){
  // В софт-режиме вкладка «Сегодня» держит свой пул: поиск не должен молча
  // подменять её всем портфелем.
  return (STATE.mode==="soft" && STATE.softPool) ? STATE.softPool : STATE.persons;
}
function filterList(){
  const pool=listPool().filter(p=>STATE.mode!=="soft" || (STATE.softRegistryPool
    ? (p.pool_partners||[]).some(tag=>tag.pool===STATE.softRegistryPool&&(!STATE.softPartner||tag.partner===STATE.softPartner))
    : !STATE.softPartner||(p.partners||[]).includes(STATE.softPartner)));
  const raw=$("q").value.trim();
  const q=raw.toLowerCase(), qd=raw.replace(/\D+/g,""), qf=fold(raw);
  const items=raw?pool.filter(p=>personMatches(p,q,qd,qf)):pool;
  drawList(items);
  const count=document.querySelector('.lhead .n');
  if(STATE.mode==='soft'&&count) count.textContent=String(items.length);
}

async function openP(rep){
  const gen=WIPE_GEN, credential=cacheCredential(), uid=STATE.uid;
  let d=null;
  try{ d=await api("/api/person?rep="+enc(rep)+"&mode="+enc(STATE.mode));
    if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid) return;
    if(d){ STATE.online=true; storeCard(d,rep).catch(()=>{}); } }   // освежить кэш карточки
  catch(e){ d=await loadCard(rep); if(d) STATE.online=false; }            // нет сети → из кэша
  if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid) return;
  if(!d){ toast(STATE.online===false?"нет данных оффлайн":"✕"); return; }
  // Старые IndexedDB-карточки могли содержать form-prefill из master. До
  // доказанного snapshot он не является пользовательским вводом и очищается;
  // отдельный localStorage-черновик восстановится поверх пустой формы ниже.
  if(!d.visited){
    (d.form||[]).forEach(f=>{ f.current=""; });
    // Текущий комментарий месяца — живой совместный текст офиса и бота. Его
    // сохраняем даже до первого завершённого визита; очищаем только недоказанный
    // legacy-prefill прочих полей.
    d.call_comment=""; d.tips="";
    storeCard(d,rep).catch(()=>{});
  }
  STATE.cur=d; STATE.tab=(STATE.mode==="soft")?"call":"visit";
  // Когда человек открыл карточку. Офис просил видеть время на адресе, а
  // честная граница измерения — именно карточка: приложение не знает, когда он
  // подошёл к подъезду, но знает, когда открыл должника и когда закрыл выезд.
  // Повторное открытие того же КД начинает отсчёт заново.
  STATE.openedAt=Date.now();
  prStart(rep);      // следы выезда: где телефон, пока открыта эта карточка
  FORM_TOUCHED.clear(); FORM_CLEARED.clear();
  // ПОВТОРНОЕ открытие уже закрытого визита: считаем тронутым всё, что человек
  // видит заполненным. Иначе второе сохранение («утром Нет контакта, вечером
  // Оплачен», «поправил опечатку») отправляет только заново набранное поле, а
  // снимок визита перезаписывается им целиком — и контакт, кто на адресе,
  // местонахождение, цель, договорённость и комментарий обнуляются молча.
  // Провенанс не страдает: у завершённого визита форма префиллится ИСКЛЮЧИТЕЛЬНО
  // из доказанного снимка (мастер её не префиллит, см. очистку выше), поэтому
  // отправляем ровно то, что уже было подтверждено нами же.
  if(d.visited){
    (d.form||[]).forEach(f=>{ if(f.current) FORM_TOUCHED.add(f.key); });
    // Симметрично d.form: иначе второе сохранение выкидывало бы обещание из
    // снимка (readForm шлёт только затронутые ключи).
    if(d.formTyped) Object.keys(d.formTyped).forEach(k=>{
      if(d.formTyped[k]) FORM_TOUCHED.add(k); });

// --- Карта (MapLibre GL). Основной слой — свой Protomaps PMTiles; пин — наш.
// Ленивая загрузка карт-библиотек: в оболочке их нет (чтобы оффлайн-старт не зависел от
// карт). Все библиотеки лежат на том же сервере: телефон больше не зависит от jsdelivr.
let _mapLibs=null;
function ensureMapLibs(){
  if(window.maplibregl && window.pmtiles && window.protomaps_themes_base) return Promise.resolve(true);
  if(_mapLibs) return _mapLibs;
  const addCss=(href)=>{ if(document.querySelector(`link[href="${href}"]`)) return;
    const l=document.createElement("link"); l.rel="stylesheet"; l.href=href; document.head.appendChild(l); };
  const addJs=(src)=>new Promise((res)=>{ const s=document.createElement("script"); s.src=src; s.onload=()=>res(true); s.onerror=()=>res(false); document.head.appendChild(s); });
  _mapLibs=(async()=>{
    addCss("/vendor/maplibre-gl-4.7.1.css");
    if(!await addJs("/vendor/maplibre-gl-4.7.1.js")){ _mapLibs=null; return false; }
    await addJs("/vendor/pmtiles-3.2.1.js");
    await addJs("/vendor/protomaps-themes-base-4.4.0.js");
    return !!window.maplibregl;
  })();
  return _mapLibs;
}
let MAP=null, PROTO_REG=false;
const RASTER_STYLE={version:8,sources:{osm:{type:"raster",
  tiles:["/tiles/raster/{z}/{x}/{y}.png"],
  tileSize:256,maxzoom:19,attribution:"© OpenStreetMap"}},
  layers:[{id:"osm",type:"raster",source:"osm"}]};
function removeMap(){ if(MAP){ try{MAP.remove();}catch(e){} MAP=null; } }
// Наш вектор-тайлсет (Protomaps PMTiles), если подложен на сервере; иначе растр.
function vectorStyle(url){
  if(!PROTO_REG){ maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile); PROTO_REG=true; }
  const ptb=window.protomaps_themes_base;
  // Symbol-слои требуют внешних glyph/sprite с protomaps.github.io. Дороги,
  // здания и вода полезнее подписей, которые могут снова уронить карту из-за CDN.
  const themed = ptb.layers ? ptb.layers("protomaps","light","ru") : ptb.default("protomaps","light");
  const layers = themed.filter(layer=>layer.type!=="symbol");
  return {version:8,
    sources:{protomaps:{type:"vector",url:"pmtiles://"+location.origin+url,attribution:"© OpenStreetMap"}},
    layers};
}
function geoHint(d,t){
  const g=d.geo&&d.geo.lat; if(!g) return t.none;
  return d.geo.src==="geonames"?t.approx:(d.geo.src==="manual"?t.manualpt:t.exact);
}
async function initMap(){
  const el=$("map"); if(!el) return;
  if(!(await ensureMapLibs())) return;   // нет сети/CDN — карту не рисуем (для визита не нужна)
  const d=STATE.cur; if(!d) return;
  const g=d.geo&&d.geo.lat;
  const lat=g?d.geo.lat:41.311, lon=g?d.geo.lon:69.240;
  removeMap();
  let style=RASTER_STYLE;
  const vt=STATE.meta&&STATE.meta.vectorTiles;
  if(vt&&window.pmtiles&&window.protomaps_themes_base){ try{ style=vectorStyle(vt); }catch(e){} }
  MAP=new maplibregl.Map({container:el,style,center:[lon,lat],zoom:g?15:9,
    attributionControl:false,dragRotate:false});
  let fellBack=false;
  MAP.on("error",()=>{ if(!fellBack&&style!==RASTER_STYLE){ fellBack=true; try{MAP.setStyle(RASTER_STYLE);}catch(e){} } });
  MAP.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
  if(g) new maplibregl.Marker({color:"#B0472C"}).setLngLat([lon,lat]).addTo(MAP);
}

// --- Карта всех моих клиентов: цвет точки = приоритет выезда, тап → карточка ---
function priColor(s){
  if(s==null) return "#9b9b9b";
  if(s>=92) return "#B0472C";   // ехать первым
  if(s>=82) return "#C9852A";   // высокий
  if(s>=70) return "#6E8F3F";   // средний
  return "#9bb08a";             // ниже
}
// Маршрут дня: едем по городам (где суммарно «жирнее»), внутри города — по приоритету.
// Так нет зигзагов между городами Сугда (они далеко друг от друга).
function routeOrder(pts){
  const sc=p=>(p.score==null?-1:p.score), byCity={};
  pts.forEach(p=>{ const c=p.city||"—"; (byCity[c]=byCity[c]||[]).push(p); });
  const cities=Object.keys(byCity).sort((a,b)=>
    byCity[b].reduce((s,p)=>s+sc(p),0)-byCity[a].reduce((s,p)=>s+sc(p),0));
  const out=[];
  cities.forEach(c=>byCity[c].sort((a,b)=>sc(b)-sc(a)).forEach(p=>out.push(p)));
  return out;
}

// Одно поле-выпадашка. Контрол остаётся <select> (мобильный нативный пикер удобен для
// длинных вариантов), автосохранение и восстановление работают по data-k без изменений.
function formField(f){
  const list=(STATE.meta&&STATE.meta.dropdowns&&STATE.meta.dropdowns[f.key])||[];
  const opts=list.map(o=>
    `<option value="${esc(o.value)}" ${o.value===f.current?"selected":""}>${esc(o.label)}</option>`).join("");
  // Пустой список — это поломка, а не поле. Молчаливый <select> с одним «—»
  // неотличим от «не открывается пикер»: человек тапает и не понимает, кто виноват.
  if(!list.length) return `<label class="fld">${esc(f.title)}</label>
    <div class="warnfld" data-k="${f.key}">${esc(L().nolist)}</div>`;
  // <select> ОСТАЁТСЯ в DOM и остаётся источником истины: по нему читают форму,
  // в него восстанавливают черновик, на него подписан автосейв. Меняем только
  // способ выбрать — своей кнопкой и своим списком, потому что системный пикер
  // 04.08.2026 не открылся у выездника, и человек встал на полтора часа.
  const cur=list.find(o=>o.value===f.current);
  return `<label class="fld">${esc(f.title)}</label>
    <select data-k="${f.key}" class="nativesel"><option value="">—</option>${opts}</select>
    <button type="button" class="pick${cur?" has":""}" data-for="${f.key}"
      onclick="openPick(${jsq(f.key)})">${esc(cur?cur.label:"—")}</button>`;
}
// Свой список вариантов. Открывается листом снизу, вариант — крупная кнопка.
// Не зависит от прошивки телефона и от того, умеет ли webview показывать
// системный <select>.
function openPick(key){
  const list=(STATE.meta&&STATE.meta.dropdowns&&STATE.meta.dropdowns[key])||[];
  if(!list.length){ toast(L().nolist); return; }
  const sel=document.querySelector('#panel select[data-k="'+key+'"]');
  const cur=sel?sel.value:"";
  const rows=[{value:"",label:"—"}].concat(list).map(o=>
    `<button type="button" class="pickrow${o.value===cur?" on":""}"
       onclick="choosePick(${jsq(key)},this)" data-v="${esc(o.value)}">${esc(o.label)}</button>`
  ).join("");
  const box=document.createElement("div");
  box.className="picksheet"; box.id="picksheet";
  box.innerHTML=`<div class="pickbg" onclick="closePick()"></div>
    <div class="pickbody">${rows}</div>`;
  document.body.appendChild(box);
}
function closePick(){ const b=$("picksheet"); if(b) b.remove(); }
function choosePick(key,btn){
  const sel=document.querySelector('#panel select[data-k="'+key+'"]');
  const val=btn.getAttribute("data-v")||"";
  if(sel&&sel.value!==val){
    sel.value=val;
    // change — тот же сигнал, что и от системного пикера: автосейв и черновик
    // подписаны именно на него и ничего не знают про нашу кнопку.
    sel.dispatchEvent(new Event("change",{bubbles:true}));
  }
  syncPickLabels();
  closePick();
}
// Кнопка показывает то, что реально лежит в <select> — включая восстановленный
// черновик и значение, пришедшее с сервера.
function syncPickLabels(){
  document.querySelectorAll('#panel button.pick[data-for]').forEach(b=>{
    const k=b.getAttribute("data-for");
    const sel=document.querySelector('#panel select[data-k="'+k+'"]');
    if(!sel) return;
    const opt=sel.options[sel.selectedIndex];
    const txt=(opt&&opt.value)?opt.text:"—";
    b.textContent=txt;
    b.classList.toggle("has",!!(opt&&opt.value));
  });
}

async function saveCall(){

  const clearedNow=[...FORM_CLEARED].filter(k=>["promise_date","forecast_sum","soft_next_call_date"].indexOf(k)>=0);

    values.promise_date=due.value; values.forecast_sum=amount;

  SAVING=true; const btn=$("callbtn"); if(btn) btn.disabled=true;
  try{
    const rep=STATE.cur.rep, op_id=uuid(), occurred_at=Date.now();
    const body={rep,values,finish:true,op_id,occurred_at,kind:"call",append_comment:true,
      opened_at:STATE.openedAt||occurred_at,form_version:FORM_VERSION,input_keys};
    if(clearedNow.length) body.cleared_keys=clearedNow;
    const result=await submitSavedOperation({op_id,kind:"save",save_kind:"call",append_comment:true,rep,values,input_keys,
      cleared_keys:clearedNow,occurred_at,opened_at:STATE.openedAt||occurred_at,
      form_version:FORM_VERSION,at:occurred_at},body);
    if(!result) return;
    if(result.queued||!result.data.rejected){try{localStorage.removeItem("softdraft:"+currentUid()+":"+rep);}catch(e){}}
    if(!result.queued){
      const j=result.data;
      STATE.online=true; STATE.cur=j.person; storeCard(j.person,rep).catch(()=>{});
      finishSavedUI(rep,t.callsaved);
      const bad=j.rejected||null;

      else if(bad) toast("Часть полей не принята: "+Object.keys(bad).join(", "));

      STATE.online=false; finishSavedUI(rep,t.savedoff);

  } finally {

  }

// --- Обещание выездника (контракт v3): дата барабаном + сумма ---------------
// Скрытый <input data-k> — ИСТИНА (как <select> у пикера): по нему читает
// readForm, в него восстанавливается черновик, на него подписан автосейв.
// Барабан и чипы — только способ выбрать. Даты только сегодня-и-вперёд:
// обещание в прошлое сразу попадало бы в «Просроченные» руководителю.
function localToday(){ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
         String(d.getDate()).padStart(2,"0"); }
function srvToday(){
  // meta.today приезжает и из ОФЛАЙН-снимка бутстрапа недельной давности —
  // дата в прошлом дороже даты вперёд (кладёт должника в «Просроченные» и
  // врёт киллер-фильтру), поэтому берём ПОЗДНЮЮ из серверной и локальной.
  const s=(STATE.meta&&STATE.meta.today)||"";
  const loc=localToday();
  return (/^\d{4}-\d{2}-\d{2}$/.test(s)&&s>loc)?s:loc;
}
function typedFields(){ return (STATE.meta&&STATE.meta.typedFields)||[]; }
// Предел обещания оплаты — решение офиса: «не более трёх дней + к дню выезда».
// Ноль значит «без предела». Считаем от СЕРВЕРНОГО сегодня: часы телефона врут,
// а обещание, уехавшее за предел из-за сбитой даты, вернётся отказом сервера.
function promiseMaxDays(){ if(STATE.mode==="soft") return 3; const n=+((STATE.meta||{}).promiseMaxDays||0);
  return Number.isFinite(n)&&n>0?n:0; }
function promiseMaxDate(){
  const n=promiseMaxDays(); if(!n) return "";
  const b=srvToday();
  const d=new Date(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10)+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
         String(d.getDate()).padStart(2,"0");
}
function promiseSection(d, fields){
  // В форме ВИЗИТА софт-дата не показывается; форма «Звонок» передаёт свой набор.
  const tf2=fields||typedFields().filter(f=>!["soft_comm_date","soft_next_call_date","meeting_date"].includes(f.key));
  if(!tf2.length) return "";
  const cur=(d&&d.formTyped)||{};
  const reg=(d&&d.formTypedRegistry)||{};
  const rows=tf2.map(f=>{
    const v=cur[f.key]||"";
    if(f.kind==="date"){
      const lim=(f.key==="promise_date")?promiseMaxDays():0;
      return `<label class="fld">${esc(f.title)}</label>
        <input type="hidden" data-k="${esc(f.key)}" value="${esc(v)}">
        <button type="button" class="pick${v?" has":""}" data-for="${esc(f.key)}"
          onclick="openDateWheel(${jsq(f.key)})">${esc(v||"—")}</button>
        ${lim?`<div class="muted" style="font-size:11px;margin:-6px 0 8px">не дальше ${esc(promiseMaxDate())} (${lim} дн от ${STATE.mode==='soft'?'звонка':'выезда'})</div>`:""}
        ${reg[f.key]&&!v?`<div class="muted" style="font-size:11px;margin:-6px 0 8px">офис: ${esc(reg[f.key])}</div>`:""}`;
    }
    return `<label class="fld">${esc(f.title)}</label>
      <div class="moneyrow" style="margin-bottom:${reg[f.key]&&!v?"2px":"10px"}">
        <input data-k="${esc(f.key)}" inputmode="${STATE.mode==='soft'?'decimal':'numeric'}" class="money" placeholder="0"
          value="${esc(fmtMoneyInput(v))}" oninput="onMoneyInput(this)">
        <button type="button" class="xbtn" aria-label="очистить"
          onclick="typedClear(${jsq(f.key)})">×</button>
      </div>
      ${reg[f.key]&&!v?`<div class="muted" style="font-size:11px;margin:0 0 10px">офис: ${esc(reg[f.key])}</div>`:""}`;
  }).join("");
  return `<div class="fsec"><div class="fsec-h">🤝</div>${rows}</div>`;

// Сумма: храним и шлём только цифры, показываем с разрядами («15 000»).
function fmtMoneyInput(v){
  if(STATE.mode==='soft'){
    const parts=String(v==null?'':v).replace(/\s/g,'').replace(',','.').replace(/[^0-9.]/g,'').split('.');
    const whole=parts[0].slice(0,13).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return whole+(parts.length>1?'.'+parts.slice(1).join('').slice(0,2):'');
  }
  const d=String(v==null?"":v).replace(/[^0-9]/g,"").slice(0,13);
  return d.replace(/\B(?=(\d{3})+(?!\d))/g," ");
}
function onMoneyInput(el){
  const shown=fmtMoneyInput(el.value);

const MONTH_NAMES=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
let WHEEL={key:null,months:[]};
function openDateWheel(key){
  const el=document.querySelector('#panel input[data-k="'+key+'"]');
  if(!el) return;
  const base=srvToday();
  const by=+base.slice(0,4), bm=+base.slice(5,7);
  // Предел офиса действует только на дату обещания: встреча и напоминание
  // могут стоять сколь угодно далеко.
  WHEEL={key,months:[],max:(key==="promise_date")?promiseMaxDate():""};
  const lim=WHEEL.max?promiseMaxDays():0;
  const span=WHEEL.max?((+WHEEL.max.slice(0,4)-by)*12+(+WHEEL.max.slice(5,7)-bm)+1):13;
  for(let i=0;i<span;i++){                 // год вперёд, а с пределом — до него
    const m=(bm-1+i)%12, y=by+Math.floor((bm-1+i)/12);
    WHEEL.months.push({y,m:m+1,label:MONTH_NAMES[m]+" "+y});
  }
  const cur=el.value&&/^\d{4}-\d{2}-\d{2}$/.test(el.value)?el.value:null;
  const preset=lim?[["Завтра",1],["Послезавтра",2],["Через 3 дня",3]].filter(x=>x[1]<=lim)
                  :[["Завтра",1],["Через неделю",7],["Через месяц",30]];
  const chips=preset.map(
    ([label,days])=>`<button type="button" class="datechip"
      onclick="wheelChip(${days})">${label}</button>`).join("");
  const monthRows=WHEEL.months.map((mm,i)=>
    `<div class="wheelitem" data-i="${i}" onclick="wheelTap(this,'m')">${esc(mm.label)}</div>`).join("");
  const box=document.createElement("div");
  box.className="picksheet"; box.id="picksheet";
  box.innerHTML=`<div class="pickbg" onclick="closePick()"></div>
    <div class="pickbody">
      <div class="datechips" style="padding-top:12px">${chips}</div>
      <div class="wheelwrap wheelhead">
        <div class="wheelband"></div>
        <div class="wheel" id="wh_m"><div class="wheelpad"></div>${monthRows}<div class="wheelpad"></div></div>
        <div class="wheel" id="wh_d"><div class="wheelpad"></div><div class="wheelpad"></div></div>
      </div>
      <div style="display:flex;gap:8px;padding:0 14px 14px">
        <button type="button" class="btn line" style="flex:1" onclick="typedClear(${jsq(key)})">Убрать</button>
        <button type="button" class="btn acc" style="flex:1" onclick="wheelDone()">Готово</button>
      </div>
    </div>`;
  document.body.appendChild(box);
  let mi=0, day=null;
  if(cur){
    const cy=+cur.slice(0,4), cm=+cur.slice(5,7);
    const found=WHEEL.months.findIndex(x=>x.y===cy&&x.m===cm);
    if(found>=0){ mi=found; day=+cur.slice(8,10); }
  }
  wheelFillDays(mi, day);
  wheelScrollTo("wh_m", mi);
  const wm=$("wh_m");
  wm.addEventListener("scroll",()=>{ clearTimeout(wm._t);
    wm._t=setTimeout(()=>{ const i=wheelIndex("wh_m");
      wheelFillDays(i,null); wheelMark(); },120); },{passive:true});
  const wd=$("wh_d");

function wheelFillDays(mi, day){
  const mm=WHEEL.months[mi]; if(!mm) return;
  const base=srvToday();
  let dim=new Date(mm.y,mm.m,0).getDate();
  // первый месяц — только с сегодняшнего дня: обещание всегда вперёд
  const from=(mm.y===+base.slice(0,4)&&mm.m===+base.slice(5,7))?+base.slice(8,10):1;
  // последний месяц предела — только до предельного числа включительно
  if(WHEEL.max&&mm.y===+WHEEL.max.slice(0,4)&&mm.m===+WHEEL.max.slice(5,7))
    dim=Math.min(dim,+WHEEL.max.slice(8,10));
  const rows=[];
  for(let d2=from;d2<=dim;d2++)
    rows.push(`<div class="wheelitem" data-d="${d2}" onclick="wheelTap(this,'d')">${d2}</div>`);
  $("wh_d").innerHTML=`<div class="wheelpad"></div>${rows.join("")}<div class="wheelpad"></div>`;

    const idx=Math.max(0,day-from);
    wheelScrollTo("wh_d", idx);
  }
}

// Гео снимается В МОМЕНТ съёмки (не отправки): фактическая точка вручения
// досудебки. Уходит ЗАГОЛОВКОМ (не в URL — query оседает в access-логах),
// одинаково для онлайн-пути и оффлайн-очереди. ts — реальное время гео-фикса
// (не момент вызова): кэшированная точка не выдаётся за точку съёмки.
function photoHeaders(geo,ext,meta){
  const h=authHeaders();
  h["Content-Type"]="application/octet-stream";
  h["X-Photo-Raw"]="1";
  h["X-Photo-Ext"]=ext||".jpg";
  // geo.ts||0: сервер трактует gat<=0 как «фикса нет». Date.now() здесь выдавал
  // бы момент ДОСЫЛА из очереди за время съёмки.
  if(geo) h["X-Photo-Geo"]=geo.lat+","+geo.lon+","+(geo.acc||0)+","+(geo.ts||0);
  // Ниже — ТОЛЬКО опциональное. Обязательный новый заголовок сломал бы
  // установленные v12/v13: legacy-ветка сервера отвечает 503 и держит
  // очередь вечно. Нет заголовка = «не знаем», а не «нарушение».
  if(meta){
    if(meta.at) h["X-Photo-Shot"]=String(meta.at);
    if(meta.src) h["X-Photo-Source"]=meta.src;
    if(meta.sm!=null) h["X-Photo-Shrunk"]=String(meta.sm);
    const x=exifHeader(meta.exif); if(x) h["X-Photo-Exif"]=x;
  }

}
// ДВЕ КНОПКИ, А НЕ УГАДЫВАНИЕ. Из поля просили прикладывать уже снятое — снял
// на камеру телефона, оформил вечером. Но точка съёмки у фото не украшение: по
// ней руководитель видит, что человек был на адресе. Камерное фото снимается
// ЗДЕСЬ И СЕЙЧАС, и текущая точка ему правда; лежавшее в галерее снято когда-то
// в другом месте, и подставить ему сегодняшнюю точку — соврать руководителю.
// Различать по file.lastModified нельзя: часть webview отдаёт время копирования
// файла в песочницу, то есть «сейчас» для любого старого снимка. Поэтому путь
// выбирает человек кнопкой, а мы просто не приписываем галерее того, чего не
// знаем. Само фото доезжает целиком — именно этого и просили.
async function upPhoto(id, live){
  const el=$(id||"photo"); if(!el) return;
  const files=[...(el.files||[])]; if(!files.length) return;
  if(!STATE.cur) return;                       // карточку успели закрыть
  const rep=STATE.cur.rep;
  const gen=WIPE_GEN, credential=cacheCredential(), uid=STATE.uid;
  // Намерение «переснять» живёт до первого снимка пачки, только для него и
  // только в пределах своего же КД.
  const retakeOf=(RETAKE_FOR&&RETAKE_FOR.rep===rep)?RETAKE_FOR.op_id:null;
  RETAKE_FOR=null;
  PHOTO_BUSY++;
  // Важно для iOS: читаем и жмём ВСЕ выбранные файлы сразу, пока
  // security-scoped файлы из picker живы. Дальше в сеть и IndexedDB идут
  // самостоятельные ArrayBuffer'ы, не File/Blob path.
  const prepared=[];
  const staged=[];
  let committed=0;
  try{
    // Start reading every native handle immediately; commit ALL originals
    // before decoding, GPS or network. A suspended app can replay these bytes.
    const captured=await Promise.allSettled(files.map(async (f,i)=>{
      const bytes=await (f.arrayBuffer?f.arrayBuffer():new Response(f).arrayBuffer());
      if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid) throw new Error("stale photo");
      const entry={op_id:uuid(),kind:"photo",rep,bytes,mime:f.type||"image/jpeg",
        ext:photoExt(f.name,f.type),geo:null,at:Date.now(),src:live!==false?"camera":"gallery",exif:exifNone()};
      if(i===0&&retakeOf)entry.replaces_op_id=retakeOf;
      PHOTO_PREPARING.add(entry.op_id);staged.push(entry);
      if(!(await enqueue(entry)))throw new Error("photo storage");
      committed++;
      return {name:f.name,file:new Blob([bytes],{type:entry.mime}),entry};
    }));
    for(const result of captured){
      if(result.status!=="fulfilled"){toast(L().photolost);continue;}
      if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid)return;
      const f=result.value.file;
      try{
        // EXIF — ПЕРВЫМ: shrinkPhoto стирает метаданные без следа и без лога.
        // Таймаут: медленное чтение не должно расширять окно, в котором файл
        // живёт только в памяти (iOS выгружает PWA на любом await).
        const exif=await Promise.race([
          readExifMeta(f).catch(()=>exifNone("error")),
          new Promise(r=>setTimeout(()=>r(exifNone("error")),EXIF_MS))]);
        // Original is durable already. A stuck decoder must not block replay.
        let decodeTimer;
        const small=await Promise.race([shrinkPhoto(f),new Promise(resolve=>{
          decodeTimer=setTimeout(()=>resolve(null),15000);
        })]).finally(()=>clearTimeout(decodeTimer));
        exif.sm=small?1:0;   // «пережато/оригинал»: у HEIC-оригинала разбор возможен позже
        prepared.push({bytes:await photoBytes(small||f),
                       mime:small?"image/jpeg":(f.type||"image/jpeg"),
                       ext:small?".jpg":photoExt(result.value.name,f.type), exif,entry:result.value.entry});
      }catch(e){ /* Original already committed; replay can send it. */ }
    }
    try{ el.value=""; }catch(e){}
    // Only local preparation is awaited. Network latency never holds the picker
    // or keeps the remaining photos in volatile memory.
    for(let i=0;i<prepared.length;i++){
      if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid) return;
      await sendPhoto(rep,prepared[i],live!==false,i===0?retakeOf:null,true);
    }
  }finally{
    for(const entry of staged)PHOTO_PREPARING.delete(entry.op_id);
    PHOTO_BUSY--;
    if(gen===WIPE_GEN&&credential===cacheCredential()&&uid===STATE.uid){
      await updateOffBar();
      if(committed)toast(L().savedoff);
      void flushQueue();
    }
  }
}
async function sendPhoto(rep,p,live,retakeOf,deferNetwork=false){
  const gen=WIPE_GEN, credential=cacheCredential(), uid=STATE.uid;
  const op_id=p.entry?.op_id||uuid(), at=p.entry?.at||Date.now();
  const bytes=p.bytes, mime=p.mime, ext2=p.ext;
  // Сначала фиксируем единственную самостоятельную копию и ждём commit IDB.
  // Только после этого допустимы geolocation/fetch: iOS может выгрузить PWA на
  // любом await, а pageshow/следующий запуск безопасно досылает тот же op_id.
  const entry={...p.entry,op_id,kind:"photo",rep,bytes,mime,ext:ext2,geo:null,at,
               src:live?"camera":"gallery", exif:p.exif};
  let geo=null;
  PHOTO_PREPARING.add(op_id);
  try{
    if(!(await enqueue(entry))){ toast(L().photolost); return; }
    // Связь ставим ТОЛЬКО если человек нажал «Переснять». Раньше её вешали на
    // «самое старое неудачное фото этого КД», и обычное добавление снимка молча
    // убирало из очереди чужую запись — вместе с напоминанием, что её надо
    // переснять. С мультивыбором это стало бы заметнее.
    if(retakeOf&&retakeOf!==op_id){
      entry.replaces_op_id=retakeOf;
      try{ await IDB.put("queue",entry); }catch(e){}  // базовая запись уже committed
    }
    // maximumAge 5с: для пруфа съёмки нужна свежая точка, а не кэш минутной
    // давности от прошлого адреса. Нет разрешения/сигнала — фото без точки.
    // Галерея точку не получает вовсе (см. комментарий у upPhoto).
    if(live){
      geo=await grabGeo(4000,5000);
      if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid) return;
      entry.geo=geo;
      try{ await IDB.put("queue",entry); }catch(e){}  // без geo фото всё равно сохранено
    }
  }finally{
    if(!deferNetwork)PHOTO_PREPARING.delete(op_id);
  }
  if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid||!queueBelongs(entry)) return;
  if(deferNetwork)return;
  PHOTO_INFLIGHT.add(op_id);
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),120000);
  try{
    const r=await fetch("/api/photo?rep="+enc(rep)+"&op="+op_id,
      {method:"POST",signal:ctl.signal,redirect:"error",headers:photoHeaders(geo,ext2,
         {at,src:entry.src,sm:p.exif&&p.exif.sm,exif:p.exif}),body:bytes});
    if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid) return;
    if(r.ok){
      const j=await r.json();
      if(!j||j.ok!==true)throw new Error("invalid acknowledgement");
      if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid) return;
      STATE.online=true;
      showPhotoCount(rep,j.photos);
      await retireReplacedPhoto(entry);
      try{ await IDB.ack(op_id); }catch(e){}
      toast(L().saved); updateOffBar(); return;
    }
    if(r.status!==401&&r.status!==403&&r.status!==408&&r.status!==429&&r.status<500){
      await markPhotoFailed(entry,String(r.status));
      STATE.online=true;
      toast(L().photolost); updateOffBar(); return;
    }
    throw new Error(r.status);
  }catch(e){
    // Нет сети/временная серверная ошибка: committed-запись уже в очереди.
    if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid) return;
    // Счётчик покажем оптимистично, тот же op_id досылается при связи.
    // STATE.cur обнуляется тапом по нижней навигации. Без проверки это TypeError,
    // и он рвёт цикл отправки: остальные снимки пачки не уходят вообще.
    STATE.online=false;
    if(STATE.cur&&STATE.cur.rep===rep){
      STATE.cur.photos=(STATE.cur.photos||0)+1;
      const el=$("phc");
      if(el) el.textContent=L().photos+": "+STATE.cur.photos+" ("+L().queuedn+")";
    }
    toast(L().savedoff); updateOffBar();
  }finally{
    clearTimeout(timer);
    PHOTO_INFLIGHT.delete(op_id);
  }
}

async function sendReceipt(rep,fields,p){
  const gen=WIPE_GEN, credential=cacheCredential(), uid=STATE.uid;
  const op_id=uuid(), at=Date.now();
  const entry=Object.assign({op_id,kind:"receipt",rep,bytes:p.bytes,ext:p.ext,at},fields);
  if(!(await enqueue(entry))){ toast(L().rcBadPhoto); return; }
  if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid||!queueBelongs(entry)) return;
  try{
    const q=new URLSearchParams({rep,op:op_id,amount:String(fields.amount),
      paid_at:fields.paid_at,payer:fields.payer_other?"other":"client"});
    if(fields.note) q.set("note",fields.note);
    if(fields.visit_op) q.set("visit",fields.visit_op);
    const r=await fetch("/api/receipt?"+q.toString(),
      {method:"POST",headers:receiptHeaders(p.ext),body:p.bytes});
    if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid) return;
    if(r.ok){
      const acknowledgement=await r.json();
      if(!acknowledgement||acknowledgement.ok!==true)throw new Error("invalid acknowledgement");
      if(acknowledgement.rejected&&Object.keys(acknowledgement.rejected).length){
        entry.failed="server-fields";entry.rejected=acknowledgement.rejected;await IDB.put("queue",entry);updateOffBar();return;
      }
      STATE.online=true;
      try{ await IDB.ack(op_id); }catch(e){}
      toast(L().saved); renderReceipts(); updateOffBar(); return;
    }
    if(r.status!==401&&r.status!==403&&r.status<500){
      await markPhotoFailed(entry,String(r.status));
      STATE.online=true; toast(L().rcBadPhoto); updateOffBar(); return;
    }
    throw new Error(r.status);
  }catch(e){
    // Нет сети: committed-запись в очереди, досыл тем же op_id при связи.
    if(gen!==WIPE_GEN||credential!==cacheCredential()||uid!==STATE.uid) return;
    STATE.online=false; toast(L().savedoff);
    renderReceipts(); updateOffBar();
  }
}
