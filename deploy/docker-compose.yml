# Мобильная система выездного взыскания — развёртывание.
#
# Один сервис. Всё состояние — в ./data (том), поэтому пересборка образа данные
# не трогает. Порт публикуется ТОЛЬКО на localhost: наружу отдаёт обратный
# прокси с сертификатом (см. README, раздел «HTTPS обязателен»).

services:
  bot:
    build: ../hardbot
    image: hardbot:latest
    container_name: hardbot
    restart: unless-stopped
    env_file: .env

    ports:
      # Наружу НЕ публикуем: перед сервисом должен стоять прокси с HTTPS.
      # Если прокси в этой же сети docker — строку можно убрать совсем.
      - "127.0.0.1:8080:8080"

    volumes:
      # База, фотографии, выгрузки. Единственное, что нужно бэкапить.
      - ./data:/data

    # ЛИМИТ ПАМЯТИ НЕ СТАВИТЬ.
    # На 9 сотрудниках сервис занимает ~330 МБ, но при загрузке большого реестра
    # кратковременно берёт заметно больше. С потолком 768 МБ контейнер убивало
    # нехваткой памяти пять раз подряд. Если ограничение всё же требуется
    # политикой — не ниже 2 ГБ.

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

